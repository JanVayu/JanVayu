<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1096.5" role="img" aria-label="Your airshed or your town. Across all 785 Indian districts, 89.2 per cent of the variation in annual PM2.5 lies between states rather than within them, and only 10.8 per cent between districts inside the same state. Two worked examples. The national median district reads 39.0 micrograms per cubic metre. Delhi as a whole sits 53.7 above that, and New Delhi is a further 1.5 below its own state, giving 91.2. Punjab sits 16.8 above the national median, and Ludhiana is a further 3.0 above its own state, giving 58.8. In both cases the region contributes far more than the town. The consequence is that NCAP sets reduction targets city by city, so a city acting alone can only reach the smaller local share. The diagram also warns that a district below its state median is not thereby well governed: the figure names no cause, and local deviation can be terrain, a valley or an industrial cluster.">
