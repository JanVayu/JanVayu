<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" role="img" aria-label="Delhi weekly mean PM2.5 across seven winters" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="980" height="490" fill="#fbfaf7"/>
<text x="14.0" y="26.0" font-size="17" fill="#1e2a22" text-anchor="start" font-weight="700">Delhi, weekly mean PM2.5 (µg/m³), May to April</text>
<text x="14.0" y="46.0" font-size="11.5" fill="#5b6b60" text-anchor="start" font-weight="400">Shaded band: lowest to highest week across 6 winters, 2018-19 to 2023-24. Line: their mean. Dashed: winter 2024-25, to December (no January to March data).</text>
<text x="14.0" y="62.0" font-size="11.5" fill="#5b6b60" text-anchor="start" font-weight="400">Dotted lines: 60, the 24-hour standard, and 250, CPCB's Severe threshold. Dots: green up to 60, amber to 120, red to 250, dark red above.</text>
