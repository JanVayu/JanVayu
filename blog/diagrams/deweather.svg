<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 786.0" role="img" aria-label="How JanVayu separates a real change in Delhi’s air from a change in the weather">
<text x="490" y="34" font-family="Kalam, Comic Sans MS, cursive" font-size="25" fill="#146c33" font-weight="700" text-anchor="middle">Was it policy, or was it the wind?</text><text x="490" y="57" font-family="Kalam, Comic Sans MS, cursive" font-size="14" fill="#5b6b60" text-anchor="middle">taking the weather out of Delhi’s air</text><text x="30" y="96" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">THE PROBLEM</text><text x="30" y="118" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#5b6b60">The same chimneys, the same traffic, two different weeks. The meter disagrees.</text><path d="M38 134 H314 Q326 134 326 146 V218 Q326 230 314 230 H38 Q26 230 26 218 V146 Q26 134 38 134 Z" fill="#fee2e2" stroke="none"/><path d="M24.64 133.93 Q101.71 133.57 179.09 131.5 Q251.75 131.06 324.95 133.58 M26.83 133.48 Q101.59 133.18 173 134.82 Q249.73 132.75 325.48 133.99 M325.58 134.3 Q324.29 159.64 325 183.65 Q324.75 206.89 325.29 230.43 M326.57 134.07 Q327.6 158.42 327.63 182.45 Q325.73 206.4 325.7 229.87 M326.75 230.74 Q252.46 230.94 176.5 230.61 Q99.05 230.57 25.43 231.07 M324.71 228.67 Q248.29 229.73 173.6 230.63 Q100.75 230.52 26.69 231.19 M26.1 230.04 Q26.34 205.82 26.75 182.37 Q26.3 157.88 25.88 134.28 M25.48 229.62 Q24.61 206.38 25.7 182.8 Q25.65 159.19 25.54 134.13" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><text x="176" y="160" font-family="Kalam, Comic Sans MS, cursive" font-size="15" fill="#b91c1c" font-weight="700" text-anchor="middle">Still, cold week</text><text x="176" y="182" font-family="Kalam, Comic Sans MS, cursive" font-size="11.8" fill="#5b6b60" text-anchor="middle">nothing disperses</text><text x="176" y="210" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#b91c1c" font-weight="700" text-anchor="middle">reads DIRTY</text><path d="M358 134 H634 Q646 134 646 146 V218 Q646 230 634 230 H358 Q346 230 346 218 V146 Q346 134 358 134 Z" fill="#dcfce7" stroke="none"/><path d="M345.21 134.57 Q417.76 137.11 494.11 137.13 Q568.63 135.69 644.65 134.82 M347.08 134.13 Q424.04 134.8 499.08 134.85 Q570.5 134.75 645.43 133.76 M646.39 134.39 Q646.77 158.5 646.26 182.32 Q644.97 206.3 645.7 230.57 M645.32 133.3 Q644.57 157.86 644.74 182.33 Q645.87 206.27 646.36 230.63 M646.19 230.07 Q571.65 229.66 497.43 230.71 Q421.57 229.76 345.78 230.52 M645.01 229.28 Q568.37 230.72 495.43 231.52 Q420.33 232.26 345.12 230.24 M346.63 229.79 Q347.23 205.86 345.8 180.49 Q345.6 157.66 345.8 134.03 M346.66 230.55 Q347.1 205.58 347.22 180.52 Q346.56 156.82 345.68 134.09" fill="none" stroke="#146c33" stroke-width="2.2" stroke-linecap="round"/><text x="496" y="160" font-family="Kalam, Comic Sans MS, cursive" font-size="15" fill="#146c33" font-weight="700" text-anchor="middle">Windy, wet week</text><text x="496" y="182" font-family="Kalam, Comic Sans MS, cursive" font-size="11.8" fill="#5b6b60" text-anchor="middle">everything blows away</text><text x="496" y="210" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#146c33" font-weight="700" text-anchor="middle">reads CLEAN</text><path d="M678 134 H938 Q950 134 950 146 V218 Q950 230 938 230 H678 Q666 230 666 218 V146 Q666 134 678 134 Z" fill="#fdf0d5" stroke="none"/><path d="M666.72 134.71 Q738.41 134.91 808.48 134.59 Q877.12 134.55 949.45 135.03 M664.76 132.72 Q734.39 133.74 805.69 134.61 Q878.76 134.5 950.66 135.15 M950.1 134.04 Q950.34 157.82 950.75 182.37 Q950.3 205.88 949.88 230.28 M949.48 133.62 Q948.61 158.38 949.7 182.8 Q949.65 207.19 949.54 230.13 M951.15 229.61 Q881.24 229.75 807.63 227.25 Q736.28 229.39 665.64 230.05 M951.21 231.01 Q881.01 229.24 810.23 227.31 Q738.01 227.85 665.43 230.16 M665.71 230.67 Q666.46 206.32 666.75 182.87 Q666.42 158.43 665.79 133.44 M666.01 230.32 Q666.42 204.62 667.64 180.44 Q667.49 156.39 666.35 133.79" fill="none" stroke="#8a5300" stroke-width="2.2" stroke-linecap="round"/><text x="808" y="162" font-family="Kalam, Comic Sans MS, cursive" font-size="13" fill="#5b6b60" text-anchor="middle">Emissions:</text><text x="808" y="188" font-family="Kalam, Comic Sans MS, cursive" font-size="17" fill="#8a5300" font-weight="700" text-anchor="middle">IDENTICAL</text><text x="808" y="212" font-family="Kalam, Comic Sans MS, cursive" font-size="11.5" fill="#5b6b60" text-anchor="middle">in both weeks</text><text x="30" y="274" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">WHAT WE DO ABOUT IT</text><path d="M38 292 H314 Q326 292 326 304 V406 Q326 418 314 418 H38 Q26 418 26 406 V304 Q26 292 38 292 Z" fill="#e0f2fe" stroke="none"/><path d="M25.6 291.58 Q98.19 290.43 173.85 290.01 Q249.51 291.18 325.25 292.22 M25.93 293.09 Q100.24 290.94 173.68 292.16 Q248.87 292.1 324.7 291.59 M325.33 292.6 Q324.37 323.38 324.23 353.46 Q326.54 386.22 326.68 418.61 M326.14 291.2 Q326.33 322.76 324.6 354.59 Q324.32 385.86 325.49 417.7 M324.87 418.41 Q251.34 419.32 174.87 420.96 Q100.81 420.43 25.86 418.55 M325.28 417.61 Q249.26 418.81 173.3 419.12 Q97.44 418.98 25.32 418.54 M25.93 417.64 Q25.49 386.34 25.61 356.5 Q26.04 323.46 26.77 292.74 M26.12 418.13 Q26.09 386.43 25.67 356.7 Q26.54 324.33 25.67 292.16" fill="none" stroke="#075985" stroke-width="2.2" stroke-linecap="round"/><text x="41" y="318" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#075985" font-weight="700">1. Learn the weather’s fingerprint</text><text x="41" y="340" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">A random forest reads five years of daily</text><text x="41" y="356.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">readings and works out how much of each</text><text x="41" y="373" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">day was wind, temperature and humidity</text><text x="41" y="389.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">— and how much was the season, the day</text><text x="41" y="406" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">of the week, and which station.</text><path d="M331.63 354.61 Q334.85 355 339.24 354.27 Q342.33 354.65 346.46 355.29 M332.06 354.97 Q336.32 355.24 339.57 354.49 Q342.26 354.77 346.09 355.28 M346.11 355.15 Q344.13 355.91 341.66 357.11 Q339.26 357.65 337.6 358.91 M346.1 355.09 Q343.9 353.56 341.59 352.67 Q339.56 351.68 338.1 350.95" fill="none" stroke="#075985" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M362 292 H638 Q650 292 650 304 V406 Q650 418 638 418 H362 Q350 418 350 406 V304 Q350 292 362 292 Z" fill="#e0f2fe" stroke="none"/><path d="M348.87 293 Q422.27 291.8 497.03 289.42 Q575.9 291.53 651.14 293.02 M350.24 290.66 Q425.55 290.76 497.66 291.32 Q572.18 290.93 649.15 291.49 M649.33 292.24 Q650.2 324.29 649.32 356.77 Q649.89 387.95 649.92 418.33 M649.57 291.77 Q648.96 323.98 648.39 355.67 Q647.88 387.09 649.6 418.32 M649.89 417.4 Q574.15 417.73 499.34 420.51 Q425.07 417.93 351.28 419.23 M650.19 418.21 Q575.15 417.89 499.45 420.84 Q425.9 419.38 349.44 418.27 M350.43 418.72 Q350.53 387.16 348.83 356.42 Q348.67 323.4 349.87 292.71 M349.34 418.19 Q350.93 386.52 350.6 355.36 Q351.55 323.27 350.4 291.69" fill="none" stroke="#075985" stroke-width="2.2" stroke-linecap="round"/><text x="365" y="318" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#075985" font-weight="700">2. Give every day the same weather</text><text x="365" y="340" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">Hold the date and the station fixed, then</text><text x="365" y="356.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">swap in weather drawn at random from the</text><text x="365" y="373" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">whole record. Do it sixty times and average.</text><text x="365" y="389.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">Now no day is flattered or punished by the</text><text x="365" y="406" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">week it happened to fall in.</text><path d="M656.22 355.25 Q660.5 355.7 663.82 355.93 Q666.31 355.12 670.06 354.57 M655.64 355 Q658.83 355.37 662.77 355.74 Q666.4 355.66 670.35 355.24 M670.1 355.09 Q667.9 355.46 665.59 356.48 Q663.56 357.38 662.1 358.56 M669.76 354.87 Q667.7 353.9 665.86 352.61 Q664.33 352.19 662.05 351.47" fill="none" stroke="#075985" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M686 292 H962 Q974 292 974 304 V406 Q974 418 962 418 H686 Q674 418 674 406 V304 Q674 292 686 292 Z" fill="#e0f2fe" stroke="none"/><path d="M672.87 292.41 Q749.34 293.32 822.87 294.96 Q898.81 294.43 973.86 292.55 M673.28 291.61 Q747.26 292.81 821.3 293.12 Q895.44 292.98 973.32 292.54 M973.93 291.64 Q973.49 323.34 973.61 356.5 Q974.04 386.46 974.77 418.74 M974.12 292.13 Q974.09 323.43 973.67 356.7 Q974.54 387.33 973.67 418.16 M974.72 419.21 Q899.88 419.11 822.04 420.38 Q746.78 417.83 673.78 419.19 M972.89 418.31 Q900.55 418.03 825.01 418.6 Q751.6 417.61 674.67 417.48 M673.77 418.78 Q673.51 386.57 673.33 355.03 Q673.99 323.76 673.94 292.17 M674.42 417.3 Q673.2 385.51 673.09 355.64 Q672.8 324.99 673.42 292.18" fill="none" stroke="#075985" stroke-width="2.2" stroke-linecap="round"/><text x="689" y="318" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#075985" font-weight="700">3. Read what is left</text><text x="689" y="340" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">What survives that swap is the part the</text><text x="689" y="356.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">weather cannot explain. Compare those</text><text x="689" y="373" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">numbers across years and you are finally</text><text x="689" y="389.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">comparing like with like — emissions,</text><text x="689" y="406" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">not luck.</text><text x="30" y="452" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">WHAT IT SAYS FOR DELHI, SEPTEMBER AND OCTOBER, 2018–2022</text><text x="30" y="494" font-family="Kalam, Comic Sans MS, cursive" font-size="13" fill="#5b6b60">As measured</text><path d="M162 476 H538 Q550 476 550 488 V490 Q550 502 538 502 H162 Q150 502 150 490 V488 Q150 476 162 476 Z" fill="#fee2e2" stroke="none"/><path d="M150.61 476.55 Q249.6 472.9 347.93 473.33 Q447.98 473.06 551.61 474.46 M148.6 476.06 Q246.89 475.47 347.72 473.04 Q448.48 473.57 549.72 476.45 M549.55 475.76 Q549.52 482.22 549.88 488.09 Q550.84 495.57 550.39 502.5 M549.87 476.11 Q549.52 482.73 549.12 488.86 Q549.33 495.22 550.32 502.38 M551.42 501.79 Q451 499.13 347.2 501.18 Q248.47 500.03 149.91 501.81 M549.58 501.39 Q448.45 503.36 346.25 503.69 Q246.74 503.39 151.44 500.54 M150.14 501.76 Q150.05 495.05 148.92 488.5 Q149.79 482.39 149.95 476.12 M149.96 501.72 Q149.89 495.89 149.26 489.84 Q149.6 482.73 150.31 475.53" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><text x="350" y="495" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#b91c1c" font-weight="700" text-anchor="middle">falling 5.5 µg/m³ a year</text><text x="30" y="534" font-family="Kalam, Comic Sans MS, cursive" font-size="13" fill="#5b6b60">Weather removed</text><path d="M162 516 H218 Q230 516 230 528 V530 Q230 542 218 542 H162 Q150 542 150 530 V528 Q150 516 162 516 Z" fill="#dcfce7" stroke="none"/><path d="M149.4 515.68 Q169.36 515.62 189.84 514.77 Q211.13 516.1 230.53 516.67 M149.83 516.15 Q169.36 516.31 188.82 515.81 Q209.1 515.62 230.42 516.52 M230.42 515.94 Q230.3 521.65 229.17 528.76 Q229.55 534.91 229.97 541.94 M229.87 515.82 Q229.54 522.9 228.88 529.5 Q229.03 535.91 230.43 541.57 M230.19 541.68 Q210.07 541.4 188.55 541.33 Q169.71 541.86 149.93 542.16 M229.94 541.62 Q209.86 542.52 189.01 543.12 Q169.46 542.31 150.41 541.37 M150.16 541.63 Q149.86 536.48 150.6 529.9 Q150.65 522.19 149.89 515.7 M150.46 542.21 Q150.41 536.3 149.73 529.08 Q150.34 522.67 150.09 516.22" fill="none" stroke="#146c33" stroke-width="2.2" stroke-linecap="round"/><text x="190" y="535" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#146c33" font-weight="700" text-anchor="middle">1.1</text><text x="244" y="535" font-family="Kalam, Comic Sans MS, cursive" font-size="12.5" fill="#5b6b60">about a fifth of it</text><path d="M38 560 H938 Q950 560 950 572 V641 Q950 653 938 653 H38 Q26 653 26 641 V572 Q26 560 38 560 Z" fill="#fdf0d5" stroke="none"/><path d="M26.05 557.92 Q254.79 557.57 484.89 559.9 Q718.46 557.65 948.19 559.82 M25.82 559.97 Q257.2 557.52 485.06 560.3 Q717.75 560.48 950.95 560.85 M949.68 560.61 Q950.45 584.64 949.87 607.1 Q949.94 629.29 950.16 652.74 M950.13 560.62 Q950.98 583.04 950.89 607.15 Q950.18 629.11 949.85 652.42 M951.18 652 Q723.08 650.27 489.13 652.48 Q255.7 650.75 27.87 651.5 M949.92 652.21 Q715.61 653.6 486.34 654.48 Q256.86 654.61 24.42 652.22 M26.25 652.78 Q26.73 629.75 26.1 605.39 Q26.13 582.2 25.81 559.5 M26.27 653.59 Q26.05 630.94 27.1 606.68 Q26.35 582.66 25.57 559.43" fill="none" stroke="#8a5300" stroke-width="2.2" stroke-linecap="round"/><text x="41" y="586" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#8a5300" font-weight="700">THE HONEST ANSWER</text><text x="41" y="608" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">Neither figure clears its own margin of error, so JanVayu claims NO DIRECTION.</text><text x="41" y="624.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">Most of the apparent improvement in those months was the wind. What is left</text><text x="41" y="641" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">cannot be told apart from no change at all.</text><path d="M38 667 H938 Q950 667 950 679 V748 Q950 760 938 760 H38 Q26 760 26 748 V679 Q26 667 38 667 Z" fill="#fbfaf7" stroke="none"/><path d="M26.83 665.47 Q260.94 669.04 491.93 667.62 Q719.05 665.45 950.99 666.77 M24.2 668.19 Q254.31 670.03 489.13 667.35 Q720.87 670.12 950.24 667.35 M950.2 667.16 Q949.21 690.51 949.04 712.8 Q950.27 736.8 949.7 759.85 M949.7 667.54 Q950.02 690.13 949.27 711.9 Q949.38 734.97 949.96 759.43 M950.14 759.68 Q715.44 762.3 484.3 761.53 Q252.45 760.19 26.06 759.07 M950.89 760.69 Q716.56 761.76 488.07 760.3 Q258.96 759.58 26.53 758.98 M25.36 759.3 Q26.78 736.18 27.1 713.27 Q27.37 689.18 25.68 666.44 M25.75 760.51 Q26.95 737.87 26.97 714.15 Q25.54 691.7 25.35 667.24" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><text x="41" y="693" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#b91c1c" font-weight="700">THE TRAP WE AVOID</text><text x="41" y="715" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">We never feed yesterday’s pollution in as a clue. It would let the model</text><text x="41" y="731.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">predict today from yesterday and call the leftover “emissions” — a convincing</text><text x="41" y="748" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">trend made out of nothing but the fact that dirty days come in runs.</text>
</svg>
