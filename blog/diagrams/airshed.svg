<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 655.5" role="img" aria-label="Your airshed or your town. Across all 785 Indian districts, 89.2 per cent of the variation in annual PM2.5 lies between states rather than within them, and only 10.8 per cent between districts inside the same state. Two worked examples. The national median district reads 39.0 micrograms per cubic metre. Delhi as a whole sits 53.7 above that, and New Delhi is a further 1.5 below its own state, giving 91.2. Punjab sits 16.8 above the national median, and Ludhiana is a further 3.0 above its own state, giving 58.8. In both cases the region contributes far more than the town. The consequence is that NCAP sets reduction targets city by city, so a city acting alone can only reach the smaller local share. The diagram also warns that a district below its state median is not thereby well governed: the figure names no cause, and local deviation can be terrain, a valley or an industrial cluster.">
<text x="490" y="34" font-family="Kalam, Comic Sans MS, cursive" font-size="25" fill="#146c33" font-weight="700" text-anchor="middle">Your airshed, or your town?</text><text x="490" y="57" font-family="Kalam, Comic Sans MS, cursive" font-size="14" fill="#5b6b60" text-anchor="middle">why your city cannot fix this on its own</text><text x="30" y="96" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">WHERE THE DIFFERENCE ACTUALLY LIVES</text><text x="30" y="120" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#5b6b60">Take the spread of annual PM2.5 across all 785 districts and split it in two.</text><path d="M38 136 H838 Q850 136 850 148 V186 Q850 198 838 198 H38 Q26 198 26 186 V148 Q26 136 38 136 Z" fill="#fee2e2" stroke="none"/><path d="M27.99 136.95 Q233.59 134.09 442.61 137.08 Q646.56 134.6 849.77 136.62 M27.2 135.3 Q231.72 135.19 440.83 140.58 Q647.2 140.37 849.92 135.54 M850.12 135.87 Q850.06 151.51 849.86 166.06 Q848.99 181.47 849.71 197.53 M849.76 135.66 Q849.25 150.66 849.26 167.41 Q849.15 183.62 850.13 198.38 M851.73 196.88 Q642.98 193.78 437.28 193.68 Q231.1 194.58 24.94 196.85 M848.83 196.24 Q640.33 196.96 435.45 200.07 Q230.86 201.75 24.77 199.5 M26.29 198.59 Q26.51 182.6 25.98 165.96 Q25.77 151.13 25.58 135.69 M26.51 197.74 Q26.18 181.42 25.36 166.29 Q25.43 150.11 26.26 135.46" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><text x="438" y="166" font-family="Kalam, Comic Sans MS, cursive" font-size="17" fill="#b91c1c" font-weight="700" text-anchor="middle">89.2%  between states</text><text x="438" y="186" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60" text-anchor="middle">which airshed you are in</text><path d="M868 136 H938 Q950 136 950 148 V186 Q950 198 938 198 H868 Q856 198 856 186 V148 Q856 136 868 136 Z" fill="#dcfce7" stroke="none"/><path d="M856.14 135.85 Q879.57 136.01 902.84 134.9 Q925.32 134.8 949.67 135.45 M855.72 135.61 Q878.62 135.03 902.14 136.48 Q925.51 137.31 950.15 136.44 M950.51 135.67 Q949.7 150.26 949.79 165.73 Q949.74 181.5 949.69 197.66 M949.66 135.48 Q948.92 151.2 949.25 167.61 Q949.67 183.6 949.64 198.44 M950.33 198.69 Q927.09 198.11 902.98 196.79 Q879.24 197.57 855.51 197.64 M950.6 197.69 Q926.71 196.75 902.26 197.17 Q878.83 196.38 856.3 197.37 M856.04 197.6 Q856.49 182.33 856.94 165.63 Q856.59 150.15 855.8 135.87 M856.24 198.3 Q857.24 183.11 857.25 168 Q855.59 151.11 855.45 135.8" fill="none" stroke="#146c33" stroke-width="2.2" stroke-linecap="round"/><text x="903" y="166" font-family="Kalam, Comic Sans MS, cursive" font-size="15" fill="#146c33" font-weight="700" text-anchor="middle">10.8%</text><text x="903" y="186" font-family="Kalam, Comic Sans MS, cursive" font-size="11" fill="#5b6b60" text-anchor="middle">your town</text><text x="30" y="236" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">THE SAME THING, FOR TWO REAL PLACES</text><text x="36" y="254" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">NEW DELHI</text><path d="M44 266 H320 Q332 266 332 278 V414 Q332 426 320 426 H44 Q32 426 32 414 V278 Q32 266 44 266 Z" fill="#fbfaf7" stroke="none"/><path d="M31.85 267.15 Q109.24 264.79 184.56 263.8 Q256.98 263.81 332.2 266.64 M32.44 267.31 Q108.66 266.48 181.48 266.06 Q255 267.58 331.98 266.3 M331.7 266.1 Q330.98 304.5 330.74 344.2 Q330.66 385.87 331.24 425.45 M332.39 265.36 Q331.45 306.26 332.87 344.87 Q333.48 386.76 332.73 426.01 M332.23 425.7 Q257.09 426.9 180.16 429.11 Q107.51 425.55 31.07 424.69 M331.47 425.05 Q258.87 423.84 183.58 425.14 Q108.88 426.13 32.01 425.35 M31.4 425.27 Q32.58 385.09 31.44 344.82 Q31.7 305.12 31.76 265.18 M32.86 425.82 Q31.8 385.18 30.64 346.32 Q31.15 306.93 31.88 265.1" fill="none" stroke="#1e2a22" stroke-width="2.2" stroke-linecap="round"/><text x="48" y="294" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22">India median</text><text x="318" y="294" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700" text-anchor="end">39.0</text><text x="48" y="324" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22">Delhi adds</text><text x="318" y="324" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#b91c1c" font-weight="700" text-anchor="end">+53.7</text><text x="48" y="339" font-family="Kalam, Comic Sans MS, cursive" font-size="10.6" fill="#5b6b60">the airshed</text><text x="48" y="364" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22">New Delhi adds</text><text x="318" y="364" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#146c33" font-weight="700" text-anchor="end">-1.5</text><text x="48" y="379" font-family="Kalam, Comic Sans MS, cursive" font-size="10.6" fill="#5b6b60">the town itself</text>M44.84 395.85 Q113.77 393.92 183.31 393.62 Q254.67 393.85 324.12 396.16 M44.49 395.08 Q114.19 395.33 185.69 397.36 Q254.77 397.45 323.62 395.7<text x="48" y="418" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22" font-weight="700">New Delhi breathes</text><text x="318" y="418" font-family="Kalam, Comic Sans MS, cursive" font-size="15" fill="#b91c1c" font-weight="700" text-anchor="end">91.2</text><text x="366" y="254" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">LUDHIANA</text><path d="M374 266 H650 Q662 266 662 278 V414 Q662 426 650 426 H374 Q362 426 362 414 V278 Q362 266 374 266 Z" fill="#fbfaf7" stroke="none"/><path d="M361.91 265.11 Q436.56 265.6 510.24 263.17 Q585.62 263.28 661.13 265.34 M361.65 265.77 Q435.62 265.52 512.99 267.39 Q587.12 267.26 663.23 265.74 M662.36 265.54 Q662.55 306.15 663.99 344.45 Q662.45 385.26 662.62 425.21 M662.53 265.1 Q662.34 305.36 662.57 346.39 Q663.42 387.12 661.96 426.02 M662.9 426.43 Q587.56 424.97 509.73 426.75 Q437.35 425.06 361.92 425.05 M661.74 424.75 Q585.62 425.61 509.76 424.05 Q435.76 423.17 361.47 425.09 M361.15 425.82 Q359.66 385.84 359.89 345.82 Q361.82 306.64 361.23 266.67 M361.84 426.68 Q362.5 386.7 363.34 347.8 Q362.14 307.82 362.05 265.29" fill="none" stroke="#1e2a22" stroke-width="2.2" stroke-linecap="round"/><text x="378" y="294" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22">India median</text><text x="648" y="294" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700" text-anchor="end">39.0</text><text x="378" y="324" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22">Punjab adds</text><text x="648" y="324" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#b91c1c" font-weight="700" text-anchor="end">+16.8</text><text x="378" y="339" font-family="Kalam, Comic Sans MS, cursive" font-size="10.6" fill="#5b6b60">the airshed</text><text x="378" y="364" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22">Ludhiana adds</text><text x="648" y="364" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#b91c1c" font-weight="700" text-anchor="end">+3.0</text><text x="378" y="379" font-family="Kalam, Comic Sans MS, cursive" font-size="10.6" fill="#5b6b60">the town itself</text>M374.84 395.85 Q443.77 393.92 513.31 393.62 Q584.67 393.85 654.12 396.16 M374.49 395.08 Q444.19 395.33 515.69 397.36 Q584.77 397.45 653.62 395.7<text x="378" y="418" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22" font-weight="700">Ludhiana breathes</text><text x="648" y="418" font-family="Kalam, Comic Sans MS, cursive" font-size="15" fill="#b91c1c" font-weight="700" text-anchor="end">58.8</text><path d="M708 266 H942 Q954 266 954 278 V495.5 Q954 507.5 942 507.5 H708 Q696 507.5 696 495.5 V278 Q696 266 708 266 Z" fill="#dcfce7" stroke="none"/><path d="M696.1 266.04 Q760.92 265.12 827.53 267.05 Q890.98 267.79 954.78 266.98 M695.41 266.4 Q759.42 266.38 823.13 264.61 Q889.71 264.22 953.27 265.31 M954.53 266.89 Q954.11 326.54 953.68 387.2 Q953.8 448.61 954.18 508.6 M954.53 266.35 Q953.5 324.67 955.56 384.67 Q954.41 446.34 954.35 506.9 M953.15 506.44 Q887.27 509.89 824.29 509.98 Q759.81 508.36 696.63 506.55 M954.15 507.58 Q888.26 508.03 822.68 505.53 Q760.15 507.78 695.19 507.05 M695.05 508.01 Q696.75 445.76 697.71 385.95 Q695.51 325.94 694.99 265.7 M694.95 506.93 Q695.08 447.09 697.97 386.99 Q696.19 327.39 695.43 267.1" fill="none" stroke="#146c33" stroke-width="2.2" stroke-linecap="round"/><text x="711" y="292" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#146c33" font-weight="700">So what?</text><text x="711" y="314" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">NCAP sets clean-air targets</text><text x="711" y="330.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">city by city.</text><text x="711" y="347" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60"></text><text x="711" y="363.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">If most of what you breathe</text><text x="711" y="380" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">blew in from four states away,</text><text x="711" y="396.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">your city can only reach the</text><text x="711" y="413" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">small green slice above,</text><text x="711" y="429.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">however well it is run.</text><text x="711" y="446" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60"></text><text x="711" y="462.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">That is an argument about</text><text x="711" y="479" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">what level the policy has</text><text x="711" y="495.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">to work at.</text><path d="M38 531.5 H942 Q954 531.5 954 543.5 V593.5 Q954 605.5 942 605.5 H38 Q26 605.5 26 593.5 V543.5 Q26 531.5 38 531.5 Z" fill="#fee2e2" stroke="none"/><path d="M26.52 530.05 Q260.4 529.97 493.43 532.3 Q724.84 533.12 952.34 531.16 M24.85 529.77 Q256.39 526.73 488.9 528.28 Q723.84 531.7 955.69 530.95 M954.46 531.64 Q954.13 550.55 953.65 569.51 Q953.5 588.1 954.12 605 M953.43 531.72 Q953.48 549.7 954.74 567.13 Q954.28 586.97 953.72 605.44 M956.04 606.38 Q723.93 606.24 490.43 606.58 Q261.44 606.58 27.51 603.8 M954.33 607.25 Q721 603.99 493.23 606.67 Q258.75 607.71 27.02 605.96 M26.35 605.09 Q26.84 587.13 26.2 569.49 Q25.91 550.18 25.92 531.08 M25.67 605.07 Q26.27 585.53 26.86 567.66 Q27.02 550.54 26.65 532.1" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><text x="46" y="557.5" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#b91c1c" font-weight="700">What this does NOT say</text><text x="46" y="579.5" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#5b6b60">A district below its state median is not thereby well governed, and one above it is not badly run. This figure names no cause: local</text><text x="46" y="597.5" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#5b6b60">deviation can be terrain, a river valley, an industrial cluster, or simply how a 1 km satellite grid falls across an oddly shaped district.</text><text x="26" y="631.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11" fill="#8a5300">Air: SatPM2.5 V6GL03 (ACAG/WashU), 2024 annual mean, 785 districts. Variance split and per-district figures: data/airshed.json.</text>
</svg>
