<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 762.5" role="img" aria-label="What 44 Indian cities look like once the weather is taken out of their air, 2018 to 2024. Thirty-three are improving and eleven are not. The steepest real falls are Meerut at 14.63 micrograms per cubic metre a year, Varanasi at 14.19, Lucknow at 13.98, Moradabad at 13.51 and Agra at 10.61. The cities getting worse are led by Chandigarh at plus 3.07, Gwalior at plus 2.37, Chandrapur at plus 2.36, Solapur at plus 1.73 and Mumbai at plus 0.80. Taking the weather out can do three things to a number, and all three appear here: for Delhi it changes almost nothing, minus 1.75 measured against minus 1.78 with weather removed; for Lucknow it makes the fall steeper, minus 11.62 measured against minus 13.98, because the weather in those years was hiding the improvement rather than flattering it; and for Chandigarh the rise survives, plus 2.32 measured against plus 3.07. Only six of the 44 cities move by as much as one microgram a year when the weather is removed, and in five of those six the measured figure was understating the improvement. What is left after the weather is removed is not proof that policy caused it: emissions, fuel mix, construction and economic activity all sit inside it.">
<text x="490" y="34" font-family="Kalam, Comic Sans MS, cursive" font-size="25" fill="#146c33" font-weight="700" text-anchor="middle">Thirty-three cities are getting cleaner.</text><text x="490" y="60" font-family="Kalam, Comic Sans MS, cursive" font-size="25" fill="#b91c1c" font-weight="700" text-anchor="middle">Eleven are not.</text><text x="490" y="84" font-family="Kalam, Comic Sans MS, cursive" font-size="14" fill="#5b6b60" text-anchor="middle">44 Indian cities with the weather taken out of their air, 2018–2024</text><text x="30" y="124" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">THE SPLIT</text><path d="M38 140 H474 Q486 140 486 152 V246 Q486 258 474 258 H38 Q26 258 26 246 V152 Q26 140 38 140 Z" fill="#dcfce7" stroke="none"/><path d="M27.61 140.88 Q141.41 140.11 252.9 139.06 Q369.57 140.87 487.64 138.68 M24.61 140.8 Q138.2 140.56 254.61 140.87 Q369.34 143.12 486.44 141.38 M486.69 139.39 Q486.48 169.99 486.65 200.37 Q486.24 230.31 486.33 258.33 M486.47 139.25 Q487.56 168.7 486.5 197.46 Q486.76 226.43 486.25 257.6 M487.68 257.83 Q373.36 256.45 255.76 257.4 Q139.89 256.15 25.84 256.35 M486.67 259.73 Q372.89 260.74 256.8 257.19 Q142.06 256.65 24.61 259.54 M26.11 257.29 Q25.72 228.79 27.22 199.7 Q27.13 170.75 25.96 140.24 M25.8 257.86 Q26.14 228.78 24.27 199.64 Q25.1 169.5 25.86 139.3" fill="none" stroke="#146c33" stroke-width="2.2" stroke-linecap="round"/><text x="256" y="174" font-family="Kalam, Comic Sans MS, cursive" font-size="22" fill="#146c33" font-weight="700" text-anchor="middle">33 falling</text><text x="256" y="200" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#5b6b60" text-anchor="middle">steepest: Meerut −14.6, Varanasi −14.2,</text><text x="256" y="218" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#5b6b60" text-anchor="middle">Lucknow −14.0, Moradabad −13.5, Agra −10.6</text><text x="256" y="242" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#5b6b60" text-anchor="middle">micrograms per cubic metre, per year</text><path d="M518 140 H938 Q950 140 950 152 V246 Q950 258 938 258 H518 Q506 258 506 246 V152 Q506 140 518 140 Z" fill="#fee2e2" stroke="none"/><path d="M507.6 138.6 Q618.11 141.13 729.49 143.16 Q839.54 144.17 950.75 140.77 M507.09 138.27 Q620.6 138.16 729.16 136.46 Q840.75 135.22 950.58 139.09 M950.71 139.93 Q951 168.85 949.9 198.75 Q949.53 227.72 949.93 257.3 M950.28 140.73 Q950.8 170.66 950.34 198.66 Q950.45 227.93 949.41 258.65 M950.24 256.35 Q838.35 258.66 730.81 259.61 Q619.6 260.88 505.9 258.55 M949.54 257.68 Q839.32 258.64 724.01 259.48 Q614.92 258.01 505.68 256.39 M505.51 258.55 Q506.13 228.66 506.71 200.52 Q507.09 171.42 506.58 140.14 M506.25 258 Q505.79 228.58 506.07 198.16 Q505.89 168.49 506.56 139.6" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><text x="728" y="174" font-family="Kalam, Comic Sans MS, cursive" font-size="22" fill="#b91c1c" font-weight="700" text-anchor="middle">11 rising</text><text x="728" y="200" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#5b6b60" text-anchor="middle">Chandigarh +3.1, Gwalior +2.4,</text><text x="728" y="218" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#5b6b60" text-anchor="middle">Chandrapur +2.4, Solapur +1.7, Mumbai +0.8</text><text x="728" y="242" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#5b6b60" text-anchor="middle">with no weather left to blame</text><text x="30" y="300" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">WHAT TAKING THE WEATHER OUT ACTUALLY DOES</text><text x="30" y="322" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#5b6b60">Three cities, three outcomes. Left column as measured, right column with the weather removed.</text><path d="M38 340 H314 Q326 340 326 352 V474 Q326 486 314 486 H38 Q26 486 26 474 V352 Q26 340 38 340 Z" fill="#fbfaf7" stroke="none"/><path d="M