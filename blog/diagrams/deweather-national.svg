2 Q350 340 362 340 Z" fill="#fbfaf7" stroke="none"/><path d="M348.82 339.62 Q425.03 341.39 498.93 339.61 Q574.47 338.38 650.69 340.15 M349.74 339.6 Q424.12 339.55 497.56 338.8 Q573.15 340.72 649.64 340.11 M649.9 340.34 Q650.09 376.09 650.97 414.37 Q650.85 449.2 649.16 485.88 M649.82 339.74 Q650.18 377.18 649.63 414.16 Q649.15 449.93 649.82 485.8 M650.02 487.23 Q574.05 487.22 501.55 485.32 Q425.43 486.66 350.03 485.12 M651.02 484.99 Q574.31 485.66 498.37 487.03 Q422.48 487.23 349.25 485.66 M350.62 486.22 Q350.38 448.31 348.33 411.9 Q349.73 377.13 350.18 340.56 M350.71 486.24 Q349.69 449.32 349.6 412.81 Q350.39 376.25 350.09 339.2" fill="none" stroke="#075985" stroke-width="2.2" stroke-linecap="round"/><text x="500" y="370" font-family="Kalam, Comic Sans MS, cursive" font-size="17" fill="#075985" font-weight="700" text-anchor="middle">Lucknow</text><text x="428" y="402" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#5b6b60" text-anchor="middle">as measured</text><text x="428" y="428" font-family="Kalam, Comic Sans MS, cursive" font-size="19" fill="#5b6b60" font-weight="700" text-anchor="middle">−11.62</text><path d="M482.48 420.28 Q491.19 420.19 499.72 419.17 Q508.28 419.63 517.72 420.47 M481.63 419.78 Q491.14 419.72 501.07 418.82 Q509.4 419.08 517.47 419.93 M518.03 420.27 Q515.81 420.92 513.72 421.46 Q511.54 422.42 509.84 423.72 M517.82 419.79 Q515.72 418.3 513.83 417.55 Q511.97 417.04 509.82 416.35" fill="none" stroke="#075985" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="572" y="402" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#5b6b60" text-anchor="middle">weather removed</text><text x="572" y="428" font-family="Kalam, Comic Sans MS, cursive" font-size="19" fill="#146c33" font-weight="700" text-anchor="middle">−13.98</text><text x="500" y="462" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#146c33" text-anchor="middle">The weather was HIDING the improvement.</text><path d="M686 340 H962 Q974 340 974 352 V474 Q974 486 962 486 H686 Q674 486 674 474 V352 Q674 340 686 340 Z" fill="#fbfaf7" stroke="none"/><path d="M673.84 340.53 Q749.13 339.36 825.51 342.12 Q900.32 339.54 972.7 339.81 M673.72 339.6 Q749.28 341.05 823.43 341.81 Q897.68 340.67 973.73 339.69 M974.01 340.79 Q973.39 377.28 975 412.56 Q974.28 449.92 974.02 485.43 M974.65 339.35 Q973.56 376.28 972.95 413.67 Q972.38 450.29 973.52 485.78 M974.96 486.35 Q899.6 484.15 821.4 484.29 Q748.58 486.98 674.28 486.86 M975.11 486.37 Q898.52 485.72 823.38 485.7 Q749.6 485.62 674.15 484.75 M673.28 485.91 Q672.83 449.61 672.6 413.98 Q672.56 376.73 673.92 340.11 M674.08 486.74 Q673.02 450.54 673.61 413.82 Q674.42 377.79 673.98 339.44" fill="none" stroke="#075985" stroke-width="2.2" stroke-linecap="round"/><text x="824" y="370" font-family="Kalam, Comic Sans MS, cursive" font-size="17" fill="#075985" font-weight="700" text-anchor="middle">Chandigarh</text><text x="752" y="402" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#5b6b60" text-anchor="middle">as measured</text><text x="752" y="428" font-family="Kalam, Comic Sans MS, cursive" font-size="19" fill="#5b6b60" font-weight="700" text-anchor="middle">+2.32</text><path d="M805.55 419.5 Q814.18 418.64 823.59 418.97 Q832.57 419.9 841.62 420.29 M805.59 420.06 Q814.8 418.96 824.09 418.93 Q832.84 419.31 842.3 419.95 M841.82 419.79 Q839.72 420.2 837.83 421.35 Q835.97 422.75 833.82 423.96 M842.16 420.12 Q840.47 419.17 838.34 418.5 Q835.9 417.49 833.71 416.11" fill="none" stroke="#075985" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="896" y="402" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#5b6b60" text-anchor="middle">weather removed</text><text x="896" y="428" font-family="Kalam, Comic Sans MS, cursive" font-size="19" fill="#b91c1c" font-weight="700" text-anchor="middle">+3.07</text><text x="824" y="462" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#b91c1c" text-anchor="middle">Rising, and not because of the weather.</text><path d="M38 520 H938 Q950 520 950 532 V617.5 Q950 629.5 938 629.5 H38 Q26 629.5 26 617.5 V532 Q26 520 38 520 Z" fill="#e0f2fe" stroke="none"/><path d="M26.2 521.67 Q260.93 520.37 491.41 524.08 Q722.66 524.75 950.27 520.56 M24.02 521.25 Q257.39 518.77 491.1 520.41 Q719.75 519.09 949.23 518.05 M950.09 520.77 Q949.58 547.3 949.43 573.49 Q949.02 600.89 949.99 629.25 M949.99 519.85 Q948.75 546.27 949 574.86 Q950.56 602.77 950.3 629.17 M948.59 627.84 Q717.15 623.66 487.26 625.23 Q257.67 628.67 25.78 630.7 M949.22 627.41 Q716.85 629.08 484.26 626.76 Q258.05 624.99 26.89 628.38 M26.44 629.85 Q27.45 602.48 27.19 575.9 Q26.04 548.37 25.63 519.76 M26.57 628.95 Q27.47 602.72 26.56 574.83 Q25.59 547.24 25.55 520.19" fill="none" stroke="#075985" stroke-width="2.2" stroke-linecap="round"/><text x="41" y="546" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#075985" font-weight="700">THE RESULT THAT SURPRISED US</text><text x="41" y="568" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">Only 6 of the 44 cities move by as much as one microgram a year when the weather comes out,</text><text x="41" y="584.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">and in 5 of those 6 the measured figure was UNDERSTATING the improvement. The usual worry is a</text><text x="41" y="601" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">city claiming credit the wind earned. On this record that is rare — the raw number is usually</text><text x="41" y="617.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">the more pessimistic one.</text><path d="M38 643.5 H938 Q950 643.5 950 655.5 V724.5 Q950 736.5 938 736.5 H38 Q26 736.5 26 724.5 V655.5 Q26 643.5 38 643.5 Z" fill="#fdf0d5" stroke="none"/><path d="M26.72 641.54 Q259.08 640.78 488.68 641.7 Q720.94 640.6 951.32 643.88 M27.22 644.42 Q259.24 642.96 485.37 641.48 Q717.43 645.17 950.75 643.26 M949.64 643.23 Q949.04 666.69 949.05 690.97 Q949.26 713.08 950.19 735.83 M950.06 643.32 Q948.83 665.49 949.15 689.11 Q950.35 712.06 950.22 736.01 M949.24 737.78 Q717.13 736.19 487.76 738.36 Q258.98 737.33 24.84 735.71 M950.85 736.13 Q718.57 736.53 484.33 740.79 Q254.19 740.14 28.02 736.73 M26.3 736.09 Q26.11 712.71 25.15 690.87 Q24.88 666.91 25.64 643.48 M25.35 735.86 Q24.89 712.64 26.25 689.95 Q25.23 665.77 25.82 642.89" fill="none" stroke="#8a5300" stroke-width="2.2" stroke-linecap="round"/><text x="41" y="669.5" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#8a5300" font-weight="700">WHAT THIS DOES NOT SAY</text><text x="41" y="691.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">Removing the weather rules out ONE explanation. It does not prove policy caused the rest.</text><text x="41" y="708" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">Emissions, fuel mix, construction and economic activity all sit inside what is left. And a</text><text x="41" y="724.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">city is only included if it has enough monitors: 194 cities with some data do not qualify.</text>
</svg>
