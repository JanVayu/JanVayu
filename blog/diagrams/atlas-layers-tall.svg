<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1224.0" role="img" aria-label="How the JanVayu boundary atlas is built: four sources — SatPM2.5 annual and monthly grids, Landsat 8/9 scenes, ESA WorldCover 2021 and boundary geometry — feed a national heat mosaic and a tile-major land-cover pass, then one zonal pass bakes nine numbers into every polygon: annual PM2.5, the same by season for winter, summer, monsoon and post-monsoon, surface heat, tree cover, green cover and built-up. Six administrative levels ship as PMTiles the browser reads by range request; villages carry the same nine numbers but are too many to tile, so they load one quantized file per district.">
