<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 556" role="img" aria-label="How to read the JanVayu map. The coloured dots are live readings from about 565 CPCB monitors updated hourly; the shading underneath is a satellite estimate averaged over a whole year, and the two are never one sentence. Pick one of seven levels from the Boundaries menu covering 983,149 areas, pick one of nine measures from the Colour menu, then tap any area. Green cover counts cropland, so the typical Indian district is 97% green and 14% treed — use tree cover if you want to know about trees.">
