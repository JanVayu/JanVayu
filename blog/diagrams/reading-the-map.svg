amily="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">2. PICK A COLOUR</text><path d="M598 108 H770 Q782 108 782 120 V384 Q782 396 770 396 H598 Q586 396 586 384 V120 Q586 108 598 108 Z" fill="#fbfaf7" stroke="none"/><path d="M586.37 108.65 Q633.6 107.8 683.38 109.48 Q732.77 109.47 781.44 108.91 M586.33 108.4 Q635.2 108.85 684.73 108.14 Q731.98 109.17 781.48 107.38 M782.33 107.54 Q781.55 181.44 783.56 254.97 Q782.15 326.66 781.2 394.74 M781.19 108.95 Q782.75 183.61 782.05 254.78 Q783.6 323.11 781.79 394.83 M782.8 395.12 Q733.53 396.83 681.98 398.35 Q633.67 397.93 585.05 396.28 M781.67 396.23 Q731.92 394.31 683.18 395.3 Q633.51 394.43 586.23 396.39 M584.7 396.63 Q587.46 323 588.58 248.99 Q585.56 177.89 586.24 108.83 M587.23 394.91 Q587.76 323.95 586.36 254.84 Q586 182.3 586.32 108.76" fill="none" stroke="#1e2a22" stroke-width="2.2" stroke-linecap="round"/><text x="602" y="134" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#5b6b60">AIR</text><text x="602" y="158" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22">Annual PM2.5</text><text x="602" y="180" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22">Winter · Summer</text><text x="602" y="202" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22">Monsoon · Post-monsoon</text><text x="602" y="224" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#5b6b60">THE GROUND</text><text x="602" y="248" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22">Surface heat</text><text x="602" y="270" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22">Tree cover</text><text x="602" y="292" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22">Green cover</text><text x="602" y="314" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#1e2a22">Built-up</text><text x="602" y="356" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#8a5300">Every area carries</text><text x="602" y="372" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#8a5300">all nine, at every level.</text><text x="828" y="94" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">3. TAP IT</text><path d="M836 108 H942 Q954 108 954 120 V189 Q954 201 942 201 H836 Q824 201 824 189 V120 Q824 108 836 108 Z" fill="#dcfce7" stroke="none"/><path d="M824.29 107.58 Q856.08 107.9 888.1 109.12 Q920.64 107.91 953.92 107.8 M824.34 108.11 Q858.25 108.35 890.09 107.33 Q922.77 106.85 954.76 108.28 M954.43 108.51 Q953.15 132.02 952.76 154.53 Q953.69 176.85 953.97 200.5 M953.87 108.66 Q955.12 132.94 954.99 155.42 Q953.78 178.9 954.08 201.28 M953.25 201.36 Q919.39 200.07 887.89 199.4 Q856.44 199.14 824.71 201.23 M954.47 201.47 Q921.88 202.24 888.29 202.9 Q855.55 202.21 824.18 201.26 M823.39 201.01 Q822.71 178.63 823.84 154.53 Q824.95 130.82 824.16 108.28 M824.08 200.69 Q822.95 177.52 822.43 152.92 Q822.4 131.08 824.1 108.16" fill="none" stroke="#146c33" stroke-width="2.2" stroke-linecap="round"/><text x="839" y="134" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#146c33" font-weight="700">You get</text><text x="839" y="156" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">its name, all nine</text><text x="839" y="172.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">numbers, and what</text><text x="839" y="189" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">each one means</text><text x="840" y="216" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#8a5300">"My area" jumps</text><text x="840" y="231" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#8a5300">straight there.</text><path d="M836 254 H942 Q954 254 954 266 V368 Q954 380 942 380 H836 Q824 380 824 368 V266 Q824 254 836 254 Z" fill="#fdf0d5" stroke="none"/><path d="M824.5 254.59 Q855.51 254.9 887.56 254.04 Q921.14 252.96 953.97 253.42 M823.85 254.77 Q857.8 255.97 890.15 255.07 Q921.25 255.34 954.1 254.32 M953.26 254.36 Q951.93 284.59 952.91 315.42 Q953.94 346.66 954.7 380.22 M954.47 254.46 Q954.38 286.72 953.3 318.87 Q953.06 349.69 954.18 380.26 M953.29 380.01 Q920 381.02 888.81 380.03 Q857.6 379.5 824.18 380.32 M954.09 379.64 Q920.28 379.74 887.17 378.15 Q854.63 379.81 824.12 380.19 M823.48 380.21 Q822.96 347.07 822.94 315.23 Q822.85 284.32 823.84 253.55 M824.56 380.55 Q824.62 348.73 825.5 317.05 Q823.98 284.38 823.68 253.67" fill="none" stroke="#8a5300" stroke-width="2.2" stroke-linecap="round"/><text x="839" y="280" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#8a5300" font-weight="700">Then Compare</text><text x="839" y="302" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">Plot any two of</text><text x="839" y="318.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">the nine against</text><text x="839" y="335" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">each other, for</text><text x="839" y="351.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">whatever is on</text><text x="839" y="368" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">your screen.</text><path d="M539.91 250.52 Q550.43 250.81 560.75 250.2 Q573.03 250.83 584.09 250.52 M540.37 250.37 Q550.87 249.96 561.87 250.58 Q572.12 250.4 583.94 249.57 M584.21 249.96 Q581.65 250.56 579.68 251.45 Q577.85 252.31 575.72 253.54 M583.98 249.83 Q581.88 248.97 579.58 247.54 Q577.61 246.61 575.67 246.07" fill="none" stroke="#146c33" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M781.63 198.4 Q790.54 193.68 800.84 188.93 Q811.45 185.01 821.53 179.96 M781.77 198.3 Q791.5 195.03 802.7 190.19 Q812.28 184.69 821.45 179.61 M821.98 179.83 Q820.45 181.63 818.72 182.85 Q817.32 184.58 815.95 186.69 M822.1 179.87 Q819.91 180.01 818.08 179.49 Q815.38 179.7 813.18 179.65" fill="none" stroke="#146c33" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 422 H942 Q954 422 954 434 V486 Q954 498 942 498 H38 Q26 498 26 486 V434 Q26 422 38 422 Z" fill="#fee2e2" stroke="none"/><path d="M27.62 421.66 Q255.56 418.98 488.15 418.46 Q721.78 417.74 953.03 419.92 M26.85 420.77 Q258.26 417.79 487.84 420.63 Q721.13 419.44 952.68 424.07 M953.96 421.57 Q953.79 440.81 953.15 458.64 Q953.33 477.69 953.58 497.68 M953.83 421.89 Q953.33 440.77 954.48 460.67 Q954.06 479.6 954.59 497.87 M954.82 496.96 Q723.25 498.34 494.49 494.49 Q259.01 496.33 27.41 496.21 M955.19 495.96 Q722.77 496.55 491.28 498.88 Q261.2 500.54 25.92 498.04 M26.44 498.21 Q26.27 478.5 24.91 460.36 Q26.17 440.55 25.96 421.54 M25.88 497.4 Q25.34 478.81 24.92 459.06 Q25.4 439.64 25.75 421.56" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><text x="46" y="448" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#b91c1c" font-weight="700">The one thing that will mislead you</text><text x="46" y="470" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#5b6b60">"Green cover" counts cropland, shrub and grass as well as trees — so the typical Indian district reads 97% green and 14% treed,</text><text x="46" y="489" font-family="Kalam, Comic Sans MS, cursive" font-size="12.2" fill="#5b6b60">and in Nagaur it is 98% green and 0% treed. If you want to know about trees, use tree cover — it is the one that tracks heat.</text><text x="26" y="528" font-family="Kalam, Comic Sans MS, cursive" font-size="11" fill="#8a5300">Air: SatPM2.5 V6GL03 (ACAG/WashU), 2024. Heat: Landsat 8/9, 2026 pre-monsoon. Land cover: ESA WorldCover 2021. Boundaries: LGD &amp; SBM via indianopenmaps.com.</text>
