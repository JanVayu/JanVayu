<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1071.0" role="img" aria-label="How JanVayu separates a real change in Delhi’s air from a change in the weather">
<text x="180" y="34" font-family="Kalam, Comic Sans MS, cursive" font-size="21" fill="#146c33" font-weight="700" text-anchor="middle">Was it policy,</text><text x="180" y="60" font-family="Kalam, Comic Sans MS, cursive" font-size="21" fill="#146c33" font-weight="700" text-anchor="middle">or was it the wind?</text><text x="20" y="92" font-family="Kalam, Comic Sans MS, cursive" font-size="12.5" fill="#5b6b60" font-weight="700">THE PROBLEM</text><path d="M30 106 H330 Q342 106 342 118 V172 Q342 184 330 184 H30 Q18 184 18 172 V118 Q18 106 30 106 Z" fill="#fee2e2" stroke="none"/><path d="M18.92 107.35 Q100.12 104.36 180.07 102.75 Q259.81 106.12 340.81 106.15 M17.24 105.05 Q98.33 104.44 176.7 103.39 Q259.05 104.21 341.7 107.41 M341.33 105.53 Q341.04 126.49 341.29 146.05 Q340.9 165.92 341.9 184.07 M342.25 105.47 Q342.59 124.99 342.08 146.33 Q342.09 166.17 342.34 184.14 M341.51 182.98 Q258.88 181.78 178.41 183.04 Q99.81 183.96 19.06 184.43 M341.54 182.8 Q261.97 185.08 182.2 186.34 Q98.77 186.87 19.1 184.97 M18.36 184.5 Q18.26 164.13 17.41 144.25 Q17.55 124.38 18.5 105.59 M18.01 184.27 Q17.97 165.41 19.14 146.06 Q19.03 125.77 17.64 106.62" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><text x="180" y="132" font-family="Kalam, Comic Sans MS, cursive" font-size="15" fill="#b91c1c" font-weight="700" text-anchor="middle">Still, cold week</text><text x="180" y="152" font-family="Kalam, Comic Sans MS, cursive" font-size="11.5" fill="#5b6b60" text-anchor="middle">nothing disperses</text><text x="180" y="174" font-family="Kalam, Comic Sans MS, cursive" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">reads DIRTY</text><path d="M30 194 H330 Q342 194 342 206 V260 Q342 272 330 272 H30 Q18 272 18 260 V206 Q18 194 30 194 Z" fill="#dcfce7" stroke="none"/><path d="M18.3 195.28 Q99.29 193.6 178.14 195.75 Q260.37 194.87 341.27 194.31 M18 192.79 Q98.8 194.63 177.71 196.3 Q258.56 194.32 341.71 193.61 M341.46 194.16 Q341.39 213.47 341.62 232.92 Q342.47 251.64 342.39 271.42 M341.41 193.59 Q341.99 213.17 341.95 232.61 Q341.33 251.5 342.56 271.55 M342.1 270.88 Q262.23 269.7 179.11 270.45 Q98.3 269.96 17.7 272.2 M341.1 271.58 Q259.79 270.27 178.06 268.75 Q98.56 270.73 18.17 273.17 M18.47 272.03 Q17.39 251.57 17.51 232.65 Q17.55 212.15 17.8 193.34 M17.44 271.79 Q17.53 252.9 17.56 232.67 Q18.47 213.48 17.64 194.07" fill="none" stroke="#146c33" stroke-width="2.2" stroke-linecap="round"/><text x="180" y="220" font-family="Kalam, Comic Sans MS, cursive" font-size="15" fill="#146c33" font-weight="700" text-anchor="middle">Windy, wet week</text><text x="180" y="240" font-family="Kalam, Comic Sans MS, cursive" font-size="11.5" fill="#5b6b60" text-anchor="middle">everything blows away</text><text x="180" y="262" font-family="Kalam, Comic Sans MS, cursive" font-size="13" fill="#146c33" font-weight="700" text-anchor="middle">reads CLEAN</text><path d="M30 282 H330 Q342 282 342 294 V326 Q342 338 330 338 H30 Q18 338 18 326 V294 Q18 282 30 282 Z" fill="#fdf0d5" stroke="none"/><path d="M19.25 282.01 Q101.39 284.58 181.36 283.24 Q261.59 283.16 340.82 281.32 M18.66 281.89 Q100.42 283.11 182.53 283.61 Q264.36 283.97 342.14 280.79 M342.45 281.78 Q343.26 296.03 343.32 310.9 Q341.62 324.56 341.59 338.01 M342.46 281.99 Q342.4 295.72 340.86 310.17 Q342.44 324.48 342.51 337.49 M342.84 336.86 Q260.51 339.61 179.18 339.02 Q99.3 341.12 19.28 339.25 M342.45 338.29 Q261.46 336.68 178.96 334.74 Q99.39 336.46 18.95 337.62 M18.55 338.49 Q19.34 325.45 19.19 310.89 Q19.07 297.04 18.02 282.41 M17.81 338.19 Q17.32 324.76 17.98 311.24 Q17.12 296.97 17.52 281.68" fill="none" stroke="#8a5300" stroke-width="2.2" stroke-linecap="round"/><text x="180" y="306" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#8a5300" font-weight="700" text-anchor="middle">Emissions: IDENTICAL</text><text x="180" y="326" font-family="Kalam, Comic Sans MS, cursive" font-size="11.5" fill="#5b6b60" text-anchor="middle">in both weeks</text><text x="20" y="366" font-family="Kalam, Comic Sans MS, cursive" font-size="12.5" fill="#5b6b60" font-weight="700">WHAT WE DO ABOUT IT</text><path d="M30 378 H330 Q342 378 342 390 V459 Q342 471 330 471 H30 Q18 471 18 459 V390 Q18 378 30 378 Z" fill="#e0f2fe" stroke="none"/><path d="M16.83 377.42 Q100.98 380.02 183.3 380.87 Q262.8 379.35 341.81 377.11 M17.63 378.31 Q98.03 377.07 179.87 378.66 Q258.57 378.62 340.74 377.71 M341.85 377.99 Q342.2 400.91 342.79 425.54 Q341.69 449.48 341.36 471.64 M341.59 378.39 Q341.85 401.53 342.11 425.69 Q341.85 448.47 341.46 470.3 M343.34 470.1 Q259.61 471.4 177.3 472.23 Q97.05 473.23 18.52 471.52 M342.39 470.33 Q262.01 472.1 180.98 471.39 Q102.17 471.43 19.29 471.01 M18.37 470.29 Q17.39 447.24 16.61 423.73 Q16.73 401.51 17.66 378.12 M18.38 470.54 Q18.18 446.06 19.06 423.59 Q17.59 400.69 17.69 378.42" fill="none" stroke="#075985" stroke-width="2.2" stroke-linecap="round"/><text x="33" y="404" font-family="Kalam, Comic Sans MS, cursive" font-size="13" fill="#075985" font-weight="700">1. Learn the weather’s fingerprint</text><text x="33" y="426" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">How much of each day was wind,</text><text x="33" y="442.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">temperature and humidity — and how</text><text x="33" y="459" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">much was the season and the station.</text><path d="M30 483 H330 Q342 483 342 495 V564 Q342 576 330 576 H30 Q18 576 18 564 V495 Q18 483 30 483 Z" fill="#e0f2fe" stroke="none"/><path d="M17.69 482.98 Q99.41 482.31 181.6 485.11 Q260.36 486.5 340.7 484.31 M17.17 483.8 Q98.69 483.57 180.23 485.4 Q260.7 484.47 340.91 481.58 M342.66 482.56 Q341.31 506.45 340.67 530.11 Q341.04 553.85 342.26 576.26 M342.19 482.67 Q342.5 506.79 342.48 529.69 Q343.57 552.96 342.64 576.01 M342.76 574.57 Q259.77 574.98 177.18 574.43 Q96.43 576.52 17.31 576.24 M342.77 575.08 Q261.36 572.58 182.14 574.16 Q98.17 574.87 17.37 576.85 M17.37 576.43 Q16.7 551.74 16.48 529.02 Q17.14 506.79 17.44 482.95 M18.04 576.32 Q17.55 553.01 18.28 531.06 Q18.31 506.89 18.38 482.8" fill="none" stroke="#075985" stroke-width="2.2" stroke-linecap="round"/><text x="33" y="509" font-family="Kalam, Comic Sans MS, cursive" font-size="13" fill="#075985" font-weight="700">2. Give every day the same weather</text><text x="33" y="531" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">Hold the date and station fixed, swap</text><text x="33" y="547.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">in weather drawn from the whole</text><text x="33" y="564" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">record, average over sixty draws.</text><path d="M30 588 H330 Q342 588 342 600 V669 Q342 681 330 681 H30 Q18 681 18 669 V600 Q18 588 30 588 Z" fill="#e0f2fe" stroke="none"/><path d="M19.34 587.1 Q97.61 588.4 177.3 589.23 Q259.05 590.23 342.52 588.52 M18.39 587.33 Q100.01 589.1 180.98 588.39 Q264.17 588.43 343.29 588.01 M342.37 587.29 Q341.39 610.74 340.61 633.73 Q340.73 658.01 341.66 681.12 M342.38 587.54 Q342.18 609.56 343.06 633.59 Q341.59 657.19 341.69 681.42 M340.73 681.86 Q258.36 678.95 176.93 680.02 Q97.26 682.1 16.87 680.91 M342.09 681.65 Q260.08 681.53 180.57 684.17 Q99.63 682.3 18.78 680.59 M17.5 681.17 Q18.3 657.7 18.6 635.79 Q18 611.3 18.68 587.59 M18.57 680.99 Q18.64 657.96 19.61 635.77 Q18.86 612.73 17.61 588.2" fill="none" stroke="#075985" stroke-width="2.2" stroke-linecap="round"/><text x="33" y="614" font-family="Kalam, Comic Sans MS, cursive" font-size="13" fill="#075985" font-weight="700">3. Read what is left</text><text x="33" y="636" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">What survives is the part the weather</text><text x="33" y="652.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">cannot explain. Now the years are</text><text x="33" y="669" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">comparable — emissions, not luck.</text><text x="20" y="709" font-family="Kalam, Comic Sans MS, cursive" font-size="12.5" fill="#5b6b60" font-weight="700">DELHI, SEP–OCT, 2018–2022</text><text x="20" y="741" font-family="Kalam, Comic Sans MS, cursive" font-size="12" fill="#5b6b60">As measured</text><path d="M30 749 H330 Q342 749 342 761 V763 Q342 775 330 775 H30 Q18 775 18 763 V761 Q18 749 30 749 Z" fill="#fee2e2" stroke="none"/><path d="M18.87 748.02 Q97.55 747.3 178.38 745.91 Q261.66 746.35 341.25 750.02 M18.96 748.39 Q101.47 750.88 181.68 751.24 Q259.73 749.99 341.34 750.07 M342.5 749.39 Q343.22 755.93 342.51 762.31 Q341.84 769.07 342.17 775.48 M341.79 748.79 Q341.43 756.16 342.11 762.48 Q341.6 768.38 341.6 774.76 M342.52 775.51 Q259.04 777.58 176.72 776.55 Q98.33 776.1 16.92 776.28 M343.41 775.52 Q262.51 774.89 179.77 774.78 Q100.31 776.66 18.68 776.2 M18.39 775.34 Q17.54 769.07 17.83 762.9 Q18.4 756.27 18.19 749.39 M17.63 774.66 Q18.07 768.74 18.88 762.4 Q18.25 755.27 18.1 749" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><text x="180" y="768" font-family="Kalam, Comic Sans MS, cursive" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">falling 5.5 µg/m³ a year</text><text x="20" y="799" font-family="Kalam, Comic Sans MS, cursive" font-size="12" fill="#5b6b60">Weather removed</text><path d="M30 807 H76 Q88 807 88 819 V821 Q88 833 76 833 H30 Q18 833 18 821 V819 Q18 807 30 807 Z" fill="#dcfce7" stroke="none"/><path d="M18.64 807.5 Q37.06 807.55 53.66 807.39 Q70.29 807.73 88.22 807.61 M17.73 806.73 Q34.78 807.84 53.14 807.62 Q69.99 806.85 87.49 806.69 M88.18 807.18 Q87.32 814.39 86.86 820.54 Q87.77 826.88 87.63 833.44 M88.49 807.18 Q88.52 813.46 87.92 819.92 Q88.45 827.08 88.24 833.42 M88.5 833.43 Q69.91 833.73 52.78 834.15 Q36.02 833.98 18.24 833.5 M87.53 832.57 Q70.59 833.3 54.13 833.52 Q35.82 832.71 18.13 833.01 M18.47 832.87 Q17.58 826.56 17.2 819.62 Q17.63 813.38 17.93 807.15 M18.04 832.92 Q17.63 827.29 17.63 820.31 Q18.29 814.13 18.26 806.73" fill="none" stroke="#146c33" stroke-width="2.2" stroke-linecap="round"/><text x="53" y="826" font-family="Kalam, Comic Sans MS, cursive" font-size="13" fill="#146c33" font-weight="700" text-anchor="middle">1.1</text><text x="98" y="826" font-family="Kalam, Comic Sans MS, cursive" font-size="12" fill="#5b6b60">about a fifth</text><path d="M30 849 H330 Q342 849 342 861 V930 Q342 942 330 942 H30 Q18 942 18 930 V861 Q18 849 30 849 Z" fill="#fdf0d5" stroke="none"/><path d="M19.35 848.61 Q97.8 849.18 177.69 847.9 Q259.92 848.64 341.8 849.42 M18.11 848.77 Q97.92 851.27 178.94 849.9 Q261.83 850.82 342.75 848.22 M342.67 848.32 Q342.6 872.63 342.71 896.28 Q341.56 919.4 341.62 941.96 M341.56 848.31 Q340.78 871.95 341.59 896.77 Q342.17 919.85 342.21 941.58 M342.35 942.65 Q259.83 940.41 180.48 941.07 Q98.9 941.66 18.18 941.96 M342.34 940.56 Q260.15 940.53 179.81 942.6 Q100.19 941.67 17.99 941.51 M18.58 941.92 Q18.67 919.5 18.88 896 Q18.91 872.13 17.7 849.03 M18.29 942 Q18.31 917.25 18.32 894.17 Q19.21 870.93 18.08 848.57" fill="none" stroke="#8a5300" stroke-width="2.2" stroke-linecap="round"/><text x="33" y="875" font-family="Kalam, Comic Sans MS, cursive" font-size="13" fill="#8a5300" font-weight="700">THE HONEST ANSWER</text><text x="33" y="897" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">Neither clears its margin of error, so</text><text x="33" y="913.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">JanVayu claims NO DIRECTION. Most of</text><text x="33" y="930" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">the apparent improvement was wind.</text><path d="M30 954 H330 Q342 954 342 966 V1035 Q342 1047 330 1047 H30 Q18 1047 18 1035 V966 Q18 954 30 954 Z" fill="#fbfaf7" stroke="none"/><path d="M19.36 952.63 Q100.21 954.78 181.44 955.58 Q260.11 955.31 341.23 953.92 M17.12 952.6 Q96.53 953.39 179.16 956.58 Q261.35 956.24 342.43 953.16 M342.17 954.32 Q341.42 976.47 342.24 1000.04 Q341.95 1023.58 342.09 1046.98 M342.17 953.29 Q341.58 976.52 341.91 1000.8 Q342.59 1023.59 342 1046.76 M343.18 1046.84 Q262.37 1048.53 181.79 1048.02 Q100.84 1046.77 17.4 1047.06 M342.59 1047.01 Q261.63 1043.96 180.65 1044.31 Q101.45 1044.32 18.15 1046.12 M18.3 1046.73 Q18.59 1023.08 17.72 999.19 Q17.54 976.77 17.79 954.09 M17.36 1046.29 Q17.8 1024.85 17.76 1001.38 Q18.49 978.29 18.39 954" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><text x="33" y="980" font-family="Kalam, Comic Sans MS, cursive" font-size="13" fill="#b91c1c" font-weight="700">THE TRAP WE AVOID</text><text x="33" y="1002" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">We never feed yesterday’s pollution in</text><text x="33" y="1018.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">as a clue — it would manufacture a</text><text x="33" y="1035" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">trend out of dirty days coming in runs.</text>
