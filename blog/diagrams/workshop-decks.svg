<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 583.0" role="img" aria-label="One Markdown file becomes a whole workshop. The file uses three marks: a line starting with a single hash becomes a step, a line reading hash-bracket-quiz makes that step a graded quiz, and inside a quiz a dash-bracket-x marks the correct option. The same file can be run four ways with no conversion: as a live session where people join with a six-character code and the facilitator sees who is stuck, on a projector, as a printed handout, or translated into another language. JanVayu publishes four decks. Know Your Ward runs thirty minutes and ends with you knowing your own neighbourhood's annual PM2.5. The RTI Clinic runs forty-five minutes and ends with a filed Right to Information request, not a drafted one. The JanVayu Walkthrough runs an hour and ends with an alert set for your own city. Air-Literacy for Educators runs an hour and ends with a lesson and an assessment a teacher can use on Monday. Two limits: a free Workshopy session is capped at forty-five minutes and thirty participants, so the two hour-long decks carry a marked split point; and nothing in the decks depends on that tool, because the content is a text file and stays one.">
<text x="490" y="36" font-family="Kalam, Comic Sans MS, cursive" font-size="25" fill="#1e2a22" font-weight="700" text-anchor="middle">One file becomes the workshop</text><text x="490" y="62" font-family="Kalam, Comic Sans MS, cursive" font-size="14" fill="#5b6b60" text-anchor="middle">Four JanVayu sessions, written as Markdown so anyone can run them without asking us</text><text x="30" y="104" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">THE WHOLE SYNTAX</text><path d="M38 118 H406 Q418 118 418 130 V282 Q418 294 406 294 H38 Q26 294 26 282 V130 Q26 118 38 118 Z" fill="#fbfaf7" stroke="none"/><path d="M26.96 116.4 Q126.39 116.44 221.13 114.92 Q320.78 114.95 416.57 117.75 M27.08 118.23 Q127.6 117.8 223.53 121.75 Q320.95 117.37 417.8 116.88 M417.69 118.68 Q416.89 163.01 417.95 205.43 Q418.09 249.19 418.59 294.43 M417.51 118.97 Q418.03 161.52 418.61 206.14 Q418.98 249.11 417.51 293.37 M417.9 294.48 Q320.86 291.37 220.76 291.47 Q122.7 290.74 25.81 294.38 M417.25 292.39 Q322.16 293.07 224.53 292.93 Q125.93 291.53 26.01 292.4 M26.37 294.3 Q25.43 250.79 26.36 206.13 Q27.33 161.85 26.58 117.6 M26.64 294.12 Q24.53 248.48 24.63 204.91 Q25.67 162.87 26.64 118.12" fill="none" stroke="#1e2a22" stroke-width="2.2" stroke-linecap="round"/><text x="44" y="148" font-family="Kalam, Comic Sans MS, cursive" font-size="12.6" fill="#1e2a22" font-weight="700"># Find yourself on the map</text><text x="44" y="166" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#5b6b60">a step</text><text x="44" y="192" font-family="Kalam, Comic Sans MS, cursive" font-size="12.6" fill="#1e2a22" font-weight="700">#[quiz] Check yourself</text><text x="44" y="210" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#5b6b60">a graded quiz</text><text x="44" y="236" font-family="Kalam, Comic Sans MS, cursive" font-size="12.6" fill="#1e2a22" font-weight="700">- [x] The 2024 annual mean</text><text x="44" y="254" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#5b6b60">the right answer</text><text x="222" y="280" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#5b6b60" text-anchor="middle">That is all of it. There is no fourth mark.</text><path d="M424.32 191.46 Q435.8 191.48 445.71 190.96 Q457.26 190.97 467.52 191.92 M424.36 192.08 Q436.21 191.93 446.51 193.26 Q457.32 191.79 467.93 191.62 M468.06 192.24 Q466.37 193.22 464.46 193.45 Q461.77 194.55 459.62 195.77 M468.19 192.18 Q465.41 191.09 463.32 189.99 Q461.54 189.38 460.06 188.36" fill="none" stroke="#075985" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="104" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">FOUR WAYS TO RUN THE SAME FILE</text><path d="M488 118 H694 Q706 118 706 130 V174 Q706 186 694 186 H488 Q476 186 476 174 V130 Q476 118 488 118 Z" fill="#e0f2fe" stroke="none"/><path d="M475.1 117.75 Q532.7 116.27 589.73 117.62 Q645.96 116.6 705.39 118.27 M477.09 118.37 Q532.77 118.15 590.55 120.44 Q647.18 120.21 706.81 118.32 M705.79 117.44 Q705.67 134.49 706.65 152.2 Q706.07 168.31 706.25 185.74 M705.46 117.44 Q706.67 134.88 707.28 151.91 Q706.82 168.34 705.44 185.44 M706.27 187.01 Q650.26 187.15 593.32 184.07 Q533 184.7 475.03 185.86 M706.39 186.15 Q648.36 185.13 589.87 185.33 Q531 184.19 475.09 185.2 M476.44 186.43 Q474.7 169.09 474.59 151.74 Q475.19 135.54 476.52 118.38 M475.65 186.53 Q475.88 168.27 476.04 151.31 Q476.44 134.13 476.36 117.96" fill="none" stroke="#075985" stroke-width="2.2" stroke-linecap="round"/><text x="490" y="144" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#075985" font-weight="700">Live session</text><text x="490" y="162" font-family="Kalam, Comic Sans MS, cursive" font-size="10.9" fill="#5b6b60">join with a 6-character code;</text><text x="490" y="176" font-family="Kalam, Comic Sans MS, cursive" font-size="10.9" fill="#5b6b60">the room shows who is stuck</text><path d="M7