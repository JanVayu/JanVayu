 Sans MS, cursive" font-size="13.5" fill="#075985" font-weight="700">A printout</text><text x="490" y="240" font-family="Kalam, Comic Sans MS, cursive" font-size="10.9" fill="#5b6b60">no screen, no signal,</text><text x="490" y="254" font-family="Kalam, Comic Sans MS, cursive" font-size="10.9" fill="#5b6b60">no account</text><path d="M730 196 H936 Q948 196 948 208 V252 Q948 264 936 264 H730 Q718 264 718 252 V208 Q718 196 730 196 Z" fill="#e0f2fe" stroke="none"/><path d="M718.79 196.78 Q773.14 196.17 830.45 195.52 Q889.04 196.98 948.94 196.69 M717.36 196.97 Q775.28 194.68 833.08 194.74 Q891.3 194.43 948.66 195.93 M948 195.98 Q948.99 212.56 949.26 229.58 Q949.01 246.65 948.25 263.49 M947.62 196.3 Q947.72 213.4 948.13 230.38 Q947.45 247.21 948.51 263.44 M947.06 262.97 Q888.82 263.05 833.11 262.91 Q776.13 262.15 717.54 264.25 M947.24 263.75 Q890.95 265.17 833.71 263.49 Q777.39 264.46 718.84 263.8 M717.79 264.52 Q716.67 247.2 716.56 231.32 Q717.62 213.68 718.15 195.58 M717.98 264.58 Q718.74 246.82 718.18 228.7 Q717.61 211.48 718.45 195.86" fill="none" stroke="#075985" stroke-width="2.2" stroke-linecap="round"/><text x="732" y="222" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#075985" font-weight="700">Another language</text><text x="732" y="240" font-family="Kalam, Comic Sans MS, cursive" font-size="10.9" fill="#5b6b60">CC BY-NC-SA: translate it,</text><text x="732" y="254" font-family="Kalam, Comic Sans MS, cursive" font-size="10.9" fill="#5b6b60">cut it, add local numbers</text><text x="30" y="310" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">THE FOUR DECKS, AND WHAT EACH ONE ENDS WITH</text><path d="M38 326 H238 Q250 326 250 338 V432 Q250 444 238 444 H38 Q26 444 26 432 V338 Q26 326 38 326 Z" fill="#fbfaf7" stroke="none"/><path d="M25.61 325.88 Q81.86 325.57 135.93 327.7 Q192.91 327.45 250.55 324.99 M26.13 325.94 Q80.17 323.88 136.79 324.58 Q194.71 326.41 250.98 325.44 M249.91 325.35 Q251.08 354.4 