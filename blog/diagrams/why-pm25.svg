<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-label="Why PM2.5 is the number that matters: PM10 is about 10 micrometres and PM2.5 is 2.5 micrometres or less, drawn to scale with each other, while a human hair at 70 micrometres would be 28 times wider than the PM2.5 dot. The nose and throat catch most PM10 and cilia sweep more of it back out, but PM2.5 reaches the alveoli and crosses into the bloodstream. PM2.5 is measured in micrograms per cubic metre, with India's annual limit at 40 and the WHO guideline at 5. AQI is a unitless index that reports only whichever of six pollutants scores worst, so two cities at the same AQI can be breathing very different PM2.5.">
<text x="480" y="34" font-family="Kalam, Comic Sans MS, cursive" font-size="25" fill="#b91c1c" font-weight="700" text-anchor="middle">Why PM2.5 is the number that matters</text><text x="480" y="57" font-family="Kalam, Comic Sans MS, cursive" font-size="14" fill="#5b6b60" text-anchor="middle">size decides how deep it goes · and how deep it goes decides what it does</text><text x="30" y="96" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">HOW BIG, ACTUALLY</text><path d="M62 120 C 96 154, 62 208, 96 244" stroke="#9ca3af" stroke-width="13" fill="none" stroke-linecap="round"/><text x="84" y="272" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#374151" font-weight="700" text-anchor="middle">hair</text><text x="84" y="291" font-family="Kalam, Comic Sans MS, cursive" font-size="12" fill="#5b6b60" text-anchor="middle">~70 µm</text><circle cx="212" cy="176" r="20" fill="#fdf0d5" stroke="none"/><path d="M231.8 176.79 Q231.21 180.87 230.15 184.87 Q226.22 188 223.88 190.46 Q220.86 193.23 216.48 194.77 Q212.47 193.83 207.16 194.47 Q203.9 191.58 199.9 190.46 Q196.56 187.46 194.47 184.83 Q193.77 179.23 191.27 175.27 Q193.47 172.7 194.43 168.18 Q197.57 164.59 199.1 159.69 Q202.74 158.72 208.25 157.42 Q211.43 157.29 215.88 155.82 Q221.31 159.09 225.01 160.86 Q227.82 164.14 230.21 168.22 Q231.67 171.46 231.3 175.75 M232.01 175.88 Q231.43 179.48 229.18 183.51 Q225.76 187.21 223.46 191.23 Q219.42 193.16 216.59 196.48 Q212.31 196.68 207.27 196.76 Q203.33 193.56 198.57 191.68 Q195.51 188.32 193.51 184.26 Q192.94 180.79 192.69 176.23 Q193.58 170.77 194.3 167.15 Q196.34 163.86 198.85 159.61 Q202.79 157.72 208.01 157.18 Q211.9 157.92 215.88 157.25 Q220.63 158.63 224.37 161.93 Q227.83 165.47 229.35 167.99 Q230.27 171.56 231.62 176.92" fill="none" stroke="#8a5300" stroke-width="2.2" stroke-linecap="round"/><text x="212" y="216" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#8a5300" font-weight="700" text-anchor="middle">PM10</text><text x="212" y="236" font-family="Kalam, Comic Sans MS, cursive" font-size="12" fill="#5b6b60" text-anchor="middle">~10 µm</text><text x="212" y="252" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#5b6b60" text-anchor="middle">dust, grit, pollen</text><circle cx="340" cy="176" r="5" fill="#b91c1c" stroke="none"/><path d="M344.89 175.77 Q344.65 177.12 344.09 177.93 Q343.31 179.4 343.11 180.3 Q342.33 180.24 341.26 181.13 Q340.58 181.14 339.05 180.54 Q337.53 179.95 336.65 180.06 Q336.36 178.98 335.23 178.54 Q335.27 177.25 335.16 176.23 Q335.09 174.46 335.31 173.64 Q336.13 172.22 336.69 171.48 Q337.35 171.05 338.7 170.54 Q340.11 171.05 341.39 171.02 Q341.95 171.96 343.04 172.26 Q344.08 172.81 344.19 174.12 Q344.18 175.37 344.65 176.12 M344.78 176.11 Q345.07 177.06 344.76 178.18 Q344.15 179.56 343 180.09 Q341.74 179.97 341.01 180.49 Q340.18 180.72 339.01 180.44 Q338.31 180.1 337.17 179.48 Q336.38 178.58 335.97 177.81 Q335.51 177.28 335.48 175.82 Q335.69 174.97 335.31 173.95 Q335.96 173.19 336.86 172.02 Q337.44 171.75 338.66 171.14 Q339.7 170.82 341.07 171.48 Q342.2 171.44 343.19 171.86 Q344.03 172.96 345.01 173.52 Q345.15 174.98 344.47 176.12" fill="none" stroke="#7f1d1d" stroke-width="1.5" stroke-linecap="round"/><text x="340" y="216" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#b91c1c" font-weight="700" text-anchor="middle">PM2.5</text><text x="340" y="236" font-family="Kalam, Comic Sans MS, cursive" font-size="12" fill="#5b6b60" text-anchor="middle">2.5 µm or less</text><text x="340" y="252" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#5b6b60" text-anchor="middle">smoke, soot, exhaust</text><path d="M57.09 312.45 Q146.93 311.75 235.78 311.57 Q322.9 311.34 410.98 312.82 M55.6 311.75 Q145.29 313.2 233.51 313.87 Q320.48 313.81 409.59 311.55" fill="none" stroke="#5b6b60" stroke-width="1.6"/><text x="30" y="332" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#5b6b60">The two circles are exactly to scale with each other. The hair is not —</text><text x="30" y="348" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#5b6b60">at that scale it would be 28× wider than the red dot and would not fit.</text><text x="470" y="96" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">WHERE EACH ONE STOPS</text><path d="M478 110 H692 Q704 110 704 122 V158 Q704 170 692 170 H478 Q466 170 466 158 V122 Q466 110 478 110 Z" fill="#fdf0d5" stroke="none"/><path d="M465.17 111.06 Q525.45 112.06 587.22 110.01 Q646.18 110.68 703.02 110.22 M465.55 110.85 Q524.23 108.99 585.73 107.69 Q645.31 109.78 704.12 110.09 M704.21 110.03 Q704.41 124.8 705.15 141 Q704.78 156.09 703.52 170.44 M704.53 110.24 Q703.51 125.48 704.15 140.58 Q703.67 155.61 703.86 170.56 M702.93 170.93 Q645.84 169.38 586.07 168.86 Q524.82 168.69 466.94 169.07 M703.53 169.21 Q644.91 171.86 585.76 172.43 Q525.53 171.86 466.47 169.53 M466.21 169.73 Q466.92 155.29 465.95 140.78 Q465.71 126.42 466.31 110.59 M466.17 169.92 Q465.76 155.76 466.09 140.12 Q465.92 125.23 466.46 109.47" fill="none" stroke="#8a5300" stroke-width="2.2" stroke-linecap="round"/><text x="481" y="136" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#8a5300" font-weight="700">Nose &amp; throat</text><text x="481" y="158" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">catch most of PM10 here</text><path d="M478 188 H692 Q704 188 704 200 V236 Q704 248 692 248 H478 Q466 248 466 236 V200 Q466 188 478 188 Z" fill="#fdf0d5" stroke="none"/><path d="M466.4 188.06 Q526.28 187.61 587.22 189.94 Q646 190.1 703.07 188.84 M467.03 188.45 Q524.55 188.93 585.28 189.11 Q643.86 189.17 703.74 189.08 M703.44 188.48 Q704.7 202.68 704.55 217.41 Q703.65 232.32 704.49 247.52 M703.76 187.59 Q704.21 203.96 704.4 219.26 Q704.01 233.97 704.25 247.76 M704.4 247.47 Q646.27 248.56 584.91 249.5 Q524.94 250.73 466.59 249.14 M704.33 247.85 Q644.04 249.47 585.17 248.23 Q525.35 248.44 466.88 246.97 M465.5 248.03 Q465.66 233 466.01 219.22 Q465.38 203.28 465.76 188.61 M466.02 248.36 Q466.3 233.58 467.01 217.27 Q467.31 202.02 466.2 188.38" fill="none" stroke="#8a5300" stroke-width="2.2" stroke-linecap="round"/><text x="481" y="214" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#8a5300" font-weight="700">Windpipe &amp; bronchi</text><text x="481" y="236" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">cilia sweep much of it back out</text><path d="M478 270 H692 Q704 270 704 282 V334.5 Q704 346.5 692 346.5 H478 Q466 346.5 466 334.5 V282 Q466 270 478 270 Z" fill="#fee2e2" stroke="none"/><path d="M464.93 270.93 Q526.84 269.38 586.07 268.86 Q643.82 268.69 704.94 269.07 M465.53 269.21 Q525.91 271.86 585.76 272.43 Q644.53 271.86 704.47 269.53 M704.23 269.7 Q705 289.44 703.95 309.1 Q703.69 328.92 704.33 347.14 M704.19 269.91 Q703.74 289.95 704.09 308.38 Q703.92 327.62 704.5 345.92 M703.03 346.57 Q643.84 346.51 585.01 348.84 Q524.3 347.04 465.54 347.67 M704.05 347.19 Q645.08 347.62 586.94 345.1 Q528.02 344.62 466.39 347.23 M466.45 346.72 Q466.14 327.09 467.45 307.91 Q465.96 289.69 466.04 270.07 M465.56 346.99 Q466.23 327.46 467.44 307.43 Q466.5 288.77 465.82 269.53" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><text x="481" y="296" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#b91c1c" font-weight="700">Alveoli — the air sacs</text><text x="481" y="318" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">PM2.5 reaches here. Nothing</text><text x="481" y="334.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">sweeps it back out.</text><path d="M478 368 H692 Q704 368 704 380 V432.5 Q704 444.5 692 444.5 H478 Q466 444.5 466 432.5 V380 Q466 368 478 368 Z" fill="#fee2e2" stroke="none"/><path d="M466.4 367.47 Q527.27 368.56 584.91 369.5 Q643.94 370.73 704.59 369.14 M466.33 367.85 Q525.04 369.47 585.17 368.23 Q644.35 368.44 704.88 366.97 M703.45 368.04 Q703.63 387.13 704.01 407.57 Q703.33 425.68 703.74 445.16 M704.03 368.39 Q704.32 387.75 705.09 405.46 Q705.42 424.31 704.22 444.91 M704.79 444.88 Q644.75 443.99 587.58 443.89 Q525.43 445.49 466.07 444.63 M703.22 445.37 Q644.92 444.65 587.56 443.04 Q526.38 443.87 465.68 443.66 M465.63 443.96 Q466.21 424.49 464.97 406.87 Q465.68 386.59 466.34 367.87 M465.9 444.61 Q464.76 425.38 465.27 406.54 Q465.95 387.61 466.1 367.52" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><text x="481" y="394" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#b91c1c" font-weight="700">Bloodstream</text><text x="481" y="416" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">heart, brain, placenta —</text><text x="481" y="432.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">it does not stay in the lungs</text><path d="M585.4 169.67 Q584.76 174.01 584.96 178.53 Q584.91 182.67 584.88 185.82 M584.85 169.93 Q585.67 173.8 585.99 178.67 Q585.32 182.26 585.46 185.57 M584.97 186.13 Q584.67 183.91 583.7 181.36 Q582.37 179.76 581.33 177.64 M584.75 185.81 Q585.9 184.28 586.88 182.43 Q587.58 179.92 588.9 177.6" fill="none" stroke="#b91c1c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M585.26 247.67 Q585.27 252.17 585.86 257.74 Q584.74 263.17 585 268.03 M584.96 248.08 Q584.59 252.63 584.36 257.64 Q584.57 262.49 584.68 267.56 M584.83 268.08 Q584.13 266.33 582.72 263.87 Q582.24 262.26 581 260.09 M584.78 267.9 Q585.54 265.76 587.02 264.12 Q587.95 261.95 588.56 259.81" fill="none" stroke="#b91c1c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M584.67 347.25 Q584.83 350.76 584.03 355.56 Q584.81 361.08 584.9 365.88 M585.33 347 Q584.76 351.89 584.38 357.07 Q584.65 361.41 585.09 366.31 M584.87 365.76 Q583.86 364.09 582.61 361.95 Q581.81 360.35 580.96 358.02 M585.17 366.23 Q585.8 363.87 586.34 361.51 Q587.93 360 588.74 358.08" fill="none" stroke="#b91c1c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M355.42 176.76 Q382.42 206.29 408.5 235.57 Q436.62 266.46 462.28 295.48 M355.16 175.96 Q382.01 205.62 408.4 234 Q435.03 265.41 461.66 295.26 M461.74 296.01 Q460.15 295.05 458.28 294.77 Q455.52 293.58 453.5 292.56 M462.1 295.97 Q461.38 293.91 460.56 291.98 Q459.68 289.49 459.35 287.35" fill="none" stroke="#b91c1c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="372" y="150" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#b91c1c">PM2.5 goes</text><text x="372" y="166" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#b91c1c">straight past</text><text x="748" y="96" font-family="Kalam, Comic Sans MS, cursive" font-size="13.5" fill="#5b6b60" font-weight="700">TWO WAYS TO SAY IT</text><path d="M756 110 H928 Q940 110 940 122 V250 Q940 262 928 262 H756 Q744 262 744 250 V122 Q744 110 756 110 Z" fill="#dcfce7" stroke="none"/><path d="M742.98 110.04 Q793.82 109.8 843.59 112.2 Q889.87 111.07 939.04 110.6 M743.22 110.85 Q792.51 110.96 843.74 111.37 Q893.26 109.81 940.05 108.99 M940.33 109.91 Q940.07 148.22 939.44 187 Q938.61 223.89 939.67 261.94 M939.75 109.11 Q939.13 146.96 940.13 183.96 Q938.83 222.73 939.61 261.44 M939.89 261.98 Q891.33 263.7 843.75 263.46 Q793.52 263.75 745.03 262.29 M940.44 262.28 Q892.94 260.29 843.52 260.11 Q793.84 260.17 743.7 261.2 M744.34 261.26 Q744.15 222.72 743.3 184.75 Q742.23 148.65 743.53 110.49 M743.15 262.38 Q742.62 224.55 741.97 187.43 Q743.08 148.34 743.99 109.88" fill="none" stroke="#146c33" stroke-width="2.2" stroke-linecap="round"/><text x="759" y="136" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#146c33" font-weight="700">PM2.5</text><text x="759" y="158" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">micrograms per cubic</text><text x="759" y="174.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">metre — a real amount</text><text x="759" y="191" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">of a real substance</text><text x="759" y="222" font-family="Kalam, Comic Sans MS, cursive" font-size="12.6" fill="#146c33" font-weight="700">India's limit: 40</text><text x="759" y="243" font-family="Kalam, Comic Sans MS, cursive" font-size="12.6" fill="#146c33" font-weight="700">WHO guideline: 5</text><path d="M756 278 H928 Q940 278 940 290 V466 Q940 478 928 478 H756 Q744 478 744 466 V290 Q744 278 756 278 Z" fill="#fbfaf7" stroke="none"/><path d="M744.38 277.9 Q793.08 278.25 841.36 279.15 Q889.4 277.87 939.62 277.94 M743.71 276.97 Q792 276.8 842.15 275.64 Q889.65 276.54 939.55 277.36 M939.88 277.98 Q940.34 329.72 941.77 379.48 Q940.52 429.77 941.04 478.3 M940.45 278.29 Q941.96 326.27 941.53 376.09 Q940.85 426.15 939.69 477.19 M940.39 477.15 Q891.17 476.52 841.19 476.56 Q790.95 478.75 743.45 478.57 M939.02 478.44 Q889.4 478.63 839.66 479.65 Q791.93 478.39 743.98 477.86 M743.35 477 Q742.02 428.05 742.79 376.65 Q742.55 328.3 744.65 278.42 M744.75 477.05 Q746.06 427.09 746.25 380.04 Q746.85 328.57 744.86 278.08" fill="none" stroke="#1e2a22" stroke-width="2.2" stroke-linecap="round"/><text x="759" y="304" font-family="Kalam, Comic Sans MS, cursive" font-size="14.5" fill="#1e2a22" font-weight="700">AQI</text><text x="759" y="326" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">an index, no unit. Takes</text><text x="759" y="342.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">whichever of six pollutants</text><text x="759" y="359" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">scores worst and reports</text><text x="759" y="375.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">only that one.</text><text x="759" y="404" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#8a5300">Two cities at AQI 180</text><text x="759" y="420" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#8a5300">can breathe very</text><text x="759" y="436" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#8a5300">different PM2.5 — and</text><text x="759" y="452" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#8a5300">India and the US scale</text><text x="759" y="468" font-family="Kalam, Comic Sans MS, cursive" font-size="11.4" fill="#8a5300">it differently.</text><text x="30" y="508" font-family="Kalam, Comic Sans MS, cursive" font-size="15" fill="#b91c1c" font-weight="700">So: JanVayu leads with PM2.5</text><text x="30" y="531" font-family="Kalam, Comic Sans MS, cursive" font-size="12.4" fill="#5b6b60">AQI is useful for one thing — a quick "is today bad?" — and useless for comparing places, comparing</text><text x="30" y="550" font-family="Kalam, Comic Sans MS, cursive" font-size="12.4" fill="#5b6b60">years, or checking a target. Every limit, every health study and every promise India has made is</text><text x="30" y="569" font-family="Kalam, Comic Sans MS, cursive" font-size="12.4" fill="#5b6b60">written in µg/m³ of PM2.5. We show AQI beside it, never instead of it.</text><text x="30" y="596" font-family="Kalam, Comic Sans MS, cursive" font-size="11" fill="#8a5300">Sizes: US EPA. Deposition: WHO Global Air Quality Guidelines 2021. Limits: CPCB NAAQS (40 µg/m³ annual), WHO 2021 (5 µg/m³ annual).</text>
</svg>
