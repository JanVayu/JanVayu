8 639.06 195.88 638.53 M196.22 638.01 Q193.91 639.38 192.27 640.47 Q190.09 641.42 187.7 641.81 M195.84 638.04 Q193.51 636.99 191.81 636.27 Q189.53 635.63 187.7 634.41" fill="none" stroke="#075985" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="258" y="644" font-family="Kalam, Comic Sans MS, cursive" font-size="17" fill="#b91c1c" font-weight="700" text-anchor="middle">+3.07</text><text x="180" y="674" font-family="Kalam, Comic Sans MS, cursive" font-size="10.8" fill="#b91c1c" text-anchor="middle">Rising, and not because of the weather.</text><path d="M30 704 H330 Q342 704 342 716 V801.5 Q342 813.5 330 813.5 H30 Q18 813.5 18 801.5 V716 Q18 704 30 704 Z" fill="#e0f2fe" stroke="none"/><path d="M17.68 703.43 Q99.08 703.39 179.08 706.27 Q258.76 705.27 342.01 703.83 M17.99 705.04 Q101.45 703.1 182.63 700.94 Q264.49 701.84 342.95 703.87 M341.93 704.48 Q341.14 732.9 341.71 760.26 Q342.43 786.11 341.96 813.33 M342.31 704.06 Q341.7 731.88 341.85 758.75 Q342.09 786.22 341.67 813.66 M343.17 813.56 Q260.72 815.8 181.87 816.55 Q100.09 816.54 17.23 813.52 M341.66 813.35 Q259.68 811.73 177.72 811.23 Q98.16 812 18.01 814.21 M17.55 813.62 Q16.72 785.95 17.69 759.24 Q17 732.75 17.6 704.62 M18.07 813.86 Q18.17 785.62 18.52 757.16 Q19.02 729.44 18.2 703.24" fill="none" stroke="#075985" stroke-width="2.2" stroke-linecap="round"/><text x="33" y="730" font-family="Kalam, Comic Sans MS, cursive" font-size="13" fill="#075985" font-weight="700">THE SURPRISE</text><text x="33" y="752" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">Only 6 of 44 cities move by a whole</text><text x="33" y="768.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">microgram a year when weather comes</text><text x="33" y="785" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">out — and in 5 of those, the measured</text><text x="33" y="801.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">figure was understating the fall.</text><path d="M30 825.5 H330 Q342 825.5 342 837.5 V906.5 Q342 918.5 330 918.5 H30 Q18 918.5 18 906.5 V837.5 Q18 825.5 30 825.5 Z" fill="#fdf0d5" stroke="none"/><path d="M17.87 826.41 Q97.37 828.37 179.45 828.35 Q261.81 825.48 341.92 825.19 M18.59 825.62 Q98.44 826.46 179.72 825.5 Q261.17 825.67 341.38 825.8 M342.58 825.53 Q341.86 849.89 342.92 873.51 Q342.54 896.75 341.62 918.51 M341.83 825.43 Q341.35 847.88 340.88 870.88 Q341.58 894.51 342.01 918.85 M341.14 918.72 Q258.59 918.16 179.41 919.42 Q97.12 921.1 17.24 919.67 M342.12 919.17 Q261.32 917.54 180.99 915.5 Q100.93 914.85 18.37 917.07 M17.8 917.96 Q18.6 894.26 18.01 871.65 Q18.25 848.29 18.22 825.64 M17.93 918.38 Q17.81 895.63 16.99 872.28 Q17.59 848.83 17.74 826.17" fill="none" stroke="#8a5300" stroke-width="2.2" stroke-linecap="round"/><text x="33" y="851.5" font-family="Kalam, Comic Sans MS, cursive" font-size="13" fill="#8a5300" font-weight="700">WHAT IT DOES NOT SAY</text><text x="33" y="873.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">This rules out ONE explanation, not</text><text x="33" y="890" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">all of them. Emissions, fuel mix and</text><text x="33" y="906.5" font-family="Kalam, Comic Sans MS, cursive" font-size="11.6" fill="#5b6b60">construction sit inside what is left.</text>
</svg>
