  <style>
    :root {
      --theme-color: var(--accent);
      --theme-color-secondary: var(--accent-hover);
      --sidebar-width: 280px;
      --sidebar-background: var(--bg-section);
      --sidebar-border-color: var(--border);
      --sidebar-name-color: var(--text);
      --sidebar-name-font-size: 1.1rem;
      --sidebar-name-font-weight: 700;
      --sidebar-nav-link-color: var(--text-2);
      --sidebar-nav-link-color--active: var(--accent);
      --sidebar-nav-link-font-weight--active: 600;
      --sidebar-nav-strong-color: var(--text);
      --sidebar-nav-strong-font-size: 0.7rem;
      --sidebar-nav-strong-font-weight: 700;
      --sidebar-nav-strong-margin: 1.5em 0 0.5em 0;
      --sidebar-nav-strong-text-transform: uppercase;
      --sidebar-nav-strong-letter-spacing: 0.08em;
      --content-max-width: 720px;
      --base-font-family: var(--sans);
      --base-font-size: 16px;
      --base-line-height: 1.85;
      --base-color: var(--text);
      --heading-color: var(--text);
      --heading-font-family: var(--serif);
      --heading-font-weight: 600;
      --link-color: var(--accent);
      --link-color--hover: var(--accent-hover);
      --blockquote-border-color: var(--accent);
      --blockquote-background: var(--bg-section);
      --blockquote-border-width: 3px;
      --notice-tip-border-color: var(--accent);
      --search-background: var(--bg-card);
      --search-input-border-color: var(--border);
      --search-result-keyword-color: var(--accent);
    }

    /* Dark mode set text colours but never a background, so the page stayed
       white while --base-color went near-white and the even-row rule painted
       #141414 stripes: light page, black bands, invisible text. The content
       background has to be declared here too, and by the same token every
       surface that had a hardcoded light value above. */
    [data-theme="dark"] {
      --sidebar-background: var(--bg-section);
      --sidebar-border-color: var(--border);
      --sidebar-name-color: var(--text);
      --sidebar-nav-link-color: var(--text-2);
      --sidebar-nav-link-color--active: var(--accent);
      --sidebar-nav-strong-color: var(--text);
      --base-color: var(--text);
      --heading-color: var(--text);
      --blockquote-background: var(--bg-section);
      --search-background: var(--bg-card);
      --search-input-border-color: var(--border);
      --base-background-color: var(--bg);
      --background: var(--bg);
      --content-background: var(--bg);
      /* Left as literals on purpose: the nine --code-theme-* values below
         and the two code backgrounds were measured against each other, and
         the comment explaining them names #161b22 by number. Pointing the
         background at a token would move it and silently invalidate all
         nine ratios, so this pair stays fixed with the values it was
         measured against. */
      --code-theme-background: #161b22;
      --code-inline-background: #161b22;
      /* The dark block used to set only the code BACKGROUND. The theme takes
         inline code's colour from --code-inline-color, which defaults to
         var(--code-theme-text) = #333, so every `inline code` span rendered
         #333 on #161b22: a contrast ratio of 1.35:1, which is what a reader
         on a phone reported as invisible. The prism token colours below have
         the same problem in the two posts that carry fenced blocks. Each
         value here clears 4.5:1 against #161b22; check before changing one. */
      --code-theme-text: #e2e8f0;
      --code-theme-comment: #9aa7b8;
      --code-theme-punctuation: #b0bccd;
      --code-theme-keyword: #7dd3fc;
      --code-theme-function: #ff9db0;
      --code-theme-selector: #a3e635;
      --code-theme-tag: #f9a8d4;
      --code-theme-variable: #fcd34d;
      --code-theme-operator: #e8b88a;
      --link-color: var(--accent);
      --notice-tip-background: var(--bg-section);
      /* This is a border SHORTHAND, not a colour. A bare hex made the
         whole declaration invalid, so dark mode had no divider at all. */
      --pagination-border-top: 1px solid #2d3748;
    }
    [data-theme="dark"],
    [data-theme="dark"] .content,
    [data-theme="dark"] .markdown-section,
    [data-theme="dark"] main,
    [data-theme="dark"] section.cover { background-color: var(--bg); }
    [data-theme="dark"] .markdown-section { color: var(--text); }
    [data-theme="dark"] .markdown-section a { color: var(--accent); }
    /* The theme targets inline code as .markdown-section code:not([class*=lang-])
       :not([class*=language-]), which outspecifies a plain
       [data-theme] .markdown-section code, so the rule that used to sit
       here never applied. Match its shape so this one does. */
    [data-theme="dark"] .markdown-section code:not([class*=lang-]):not([class*=language-]) {
      background: #161b22;
      color: #e2e8f0;
    }
    [data-theme="dark"] .markdown-section blockquote { background: var(--bg-section); }
    /* Diagrams are drawn on warm paper; keep them readable rather than
       inverting them, which would wreck the hand-drawn colour scheme. */
    [data-theme="dark"] .jv-dgm { background: #f7f5f0; border-color: var(--border); }

    /* Typography */
    .markdown-section h1 {
      font-family: 'Newsreader', Georgia, serif;
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      padding-bottom: 0;
      border-bottom: none;
    }

    .markdown-section h2 {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 1.35rem;
      margin-top: 2.5rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--sidebar-border-color);
    }

    .markdown-section h3 {
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--theme-color);
      margin-top: 2rem;
    }

    .markdown-section p {
      font-size: 1.0125rem;
      line-height: 1.85;
      margin: 1.25em 0;
    }

    .markdown-section strong {
      color: var(--heading-color);
    }

    .markdown-section em {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
    }

    .markdown-section hr {
      border: none;
      border-top: 1px solid var(--sidebar-border-color);
      margin: 2rem 0;
    }

    /* Post metadata (bold line after title) */
    .markdown-section h1 + p strong {
      color: var(--theme-color);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Blockquotes as callouts */
    .markdown-section blockquote {
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      font-size: 0.95rem;
    }

    .markdown-section blockquote p {
      font-size: 0.95rem;
      margin: 0.5em 0;
    }

    /* Lists */
    .markdown-section ul, .markdown-section ol {
      padding-left: 1.5rem;
    }

    .markdown-section li {
      margin-bottom: 0.4em;
      font-size: 1rem;
      line-height: 1.7;
    }

    /* Tables */
    table { border-collapse: collapse; width: 100%; margin: 1.5em 0; border-radius: 8px; overflow: hidden; }
    table th { background: #f0fdf4; font-weight: 600; text-align: left; padding: 10px 14px; border: 1px solid #e5e7eb; font-size: 0.85rem; }
    table td { padding: 10px 14px; border: 1px solid #e5e7eb; font-size: 0.9rem; }
    table tr:nth-child(even) { background: #fafbfc; }
    [data-theme="dark"] table th { background: var(--bg-section); border-color: var(--border); }
    [data-theme="dark"] table td { border-color: var(--border); }
    [data-theme="dark"] table tr:nth-child(odd) { background: var(--bg); }
    [data-theme="dark"] table tr:nth-child(even) { background: var(--bg-section); }
    [data-theme="dark"] table td, [data-theme="dark"] table th { color: var(--text); }

    /* Sources section at end of posts */
    .markdown-section h2:last-of-type {
      font-size: 0.8rem;
      font-family: 'DM Sans', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--theme-color);
      border-bottom: none;
      margin-top: 3rem;
      margin-bottom: 0.5rem;
    }

    /* Sidebar tweaks */
    .sidebar .app-name {
      padding: 16px 16px 8px;
    }

    .sidebar-nav > ul > li > a,
    .sidebar-nav > ul > li > ul > li > a {
      font-size: 0.82rem;
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height: 1.5;
      display: block;
      padding: 4px 0;
    }

    /* Dark mode toggle */

    /* Back to site link */
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'DM Sans', sans-serif; font-size: 0.75rem;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--theme-color); text-decoration: none;
      padding: 8px 0; margin-bottom: 0;
    }
    .back-link:hover { text-decoration: underline; }

    /* Smooth scroll */
    html { scroll-behavior: smooth; }

    /* Better code blocks */
    .markdown-section pre { border-radius: 8px; padding: 1em; }
    .markdown-section code { border-radius: 4px; padding: 2px 6px; }

    /* Previous / next post links.

       docsify-pagination injects its own stylesheet into <head> at runtime,
       after everything here, and it fades the previous-post block to
       opacity .3 whenever a next post exists. Alpha applies to the text the
       reader is meant to click, so the result was 1.5:1 over the light page
       and 2.2:1 over #0d1117 — the least legible text on the post, in both
       themes. Keep the de-emphasis; carry it in colour, which can be
       measured, instead of alpha, which cannot.

       The .markdown-section prefix is load-bearing: without it these lose to
       the plugin's .pagination-item:not(:last-child) a .pagination-item-title. */
    .markdown-section .pagination-item a .pagination-item-label,
    .markdown-section .pagination-item a .pagination-item-subtitle,
    .markdown-section .pagination-item a .pagination-item-title,
    .markdown-section .pagination-item:not(:last-child) a .pagination-item-label,
    .markdown-section .pagination-item:not(:last-child) a .pagination-item-subtitle,
    .markdown-section .pagination-item:not(:last-child) a .pagination-item-title,
    .markdown-section .pagination-item:last-child .pagination-item-label {
      opacity: 1;
    }
    .markdown-section .pagination-item-label { color: #4b5563; }
    .markdown-section .pagination-item-title { color: #15803d; }
    [data-theme="dark"] .markdown-section .pagination-item-label { color: var(--text-3); }
    [data-theme="dark"] .markdown-section .pagination-item-title { color: var(--accent); }

    /* Mobile */
    /* Sargam icons, the set used across the rest of the site. The blog is a
       standalone docsify page and never had them, so its dark-mode toggle was
       a moon EMOJI: a different shape on every platform, and the one place on
       the site still using an emoji as an interface element. Masked SVG takes
       currentColor, so it follows the button's own colour in both themes. */
    .si { display: inline-block; width: 18px; height: 18px; background: currentColor;
          -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
          -webkit-mask-position: center; mask-position: center;
          -webkit-mask-size: contain; mask-size: contain; vertical-align: -0.18em; }
    .si-moon { -webkit-mask-image: url(https://cdn.jsdelivr.net/npm/sargam-icons@1.6.7/Icons/Line/si_Moon.svg);
               mask-image: url(https://cdn.jsdelivr.net/npm/sargam-icons@1.6.7/Icons/Line/si_Moon.svg); }
    .si-sun  { -webkit-mask-image: url(https://cdn.jsdelivr.net/npm/sargam-icons@1.6.7/Icons/Line/si_Sun.svg);
               mask-image: url(https://cdn.jsdelivr.net/npm/sargam-icons@1.6.7/Icons/Line/si_Sun.svg); }

    /* Wide tables on a desktop.
       docsify-themeable caps the prose column at 720px, which is right for
       reading and wrong for a comparison table. The source-comparison table is
       ten columns and needs 763px, so 133px of it sat hidden behind a
       horizontal scrollbar inside a narrow column, on a 1440px screen with
       roughly 700px of unused margin either side. A reader on a laptop found
       it cut off.
       Above 700px the table breaks out of the prose column and centres on the
       available width. Prose stays at its readable measure; only the table
       widens. Below that it keeps the normal scroll, which is correct on a
       narrow screen. */
    @media (min-width: 700px) {
      .markdown-section .table-wrapper {
        width: min(96vw, 1180px);
        max-width: none;
        margin-left: calc(50% - min(48vw, 590px));
      }
      .markdown-section .table-wrapper > table { width: 100%; }
    }

    /* Wide tables on a phone.
       docsify-themeable stacks a table below 30em: it hides the head, makes
       every cell a block, pads it 8em on the left and floats the column label
       into that gutter with a NEGATIVE margin. A float is out of flow, so the
       cell reserves one line of height no matter how long the label is. Any
       label that wraps to a second line therefore prints on top of the row
       beneath it. On the source-comparison table that was 34 cells: "AQI.in /
       IQAir / AQICN" over "OpenAQ", "Sensor networks" over "VayuBuddy". The
       label needs 53px and the cell gives it 31.
       A two-column grid puts the label back in flow, so the row grows to fit
       whichever side is taller and no label can collide with anything. */
    @media (max-width: 30em) {
      .markdown-section .table-wrapper td {
        display: grid;
        grid-template-columns: 7.5em minmax(0, 1fr);
        gap: 0 0.6em;
        align-items: start;
        padding: 0.25em 0;
      }
      .markdown-section .table-wrapper td::before {
        display: block;
        float: none;
        width: auto;
        margin-left: 0;
        overflow-wrap: anywhere;
      }
    }

    @media (max-width: 768px) {
      .markdown-section h1 { font-size: 1.5rem; }
      .markdown-section p { font-size: 0.95rem; }
      .markdown-section { padding: 0 16px; }
    }

    /* Cover page tweaks */
    section.cover { background: linear-gradient(135deg, #1a3a2a 0%, #16A34A 100%) !important; }

    /* Hand-drawn (Excalidraw-style) diagrams embedded in posts */
    @font-face { font-family: 'Kalam'; font-weight: 400; font-display: swap; src: url('/fonts/kalam-400.woff2') format('woff2'); }
    @font-face { font-family: 'Kalam'; font-weight: 700; font-display: swap; src: url('/fonts/kalam-700.woff2') format('woff2'); }
    .jv-dgm { background: #fbfaf7; border: 1px solid #e7e4dc; border-radius: 14px; padding: 10px 14px; overflow-x: auto; margin: 1.75rem 0; }
    .jv-dgm svg, .jv-dgm img { display: block; width: 100%; height: auto; }
    .jv-dgm-wide svg, .jv-dgm-wide img { min-width: 560px; }
    .jv-dgm-tall { display: none; }
    .jv-dgm-tall svg, .jv-dgm-tall img { min-width: 0; max-width: 400px; margin: 0 auto; }
    @media (max-width: 680px) { .jv-dgm-wide { display: none; } .jv-dgm-tall { display: block; overflow-x: visible; } }
  </style>
</head>
