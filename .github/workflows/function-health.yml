name: Function Health Monitor

# Probes the live site + serverless functions every 15 minutes and keeps a
# single tracking issue in sync with reality:
#   - opens / comments on a "status: outage" issue when a function is DOWN
#     (HTTP 5xx or unreachable — e.g. the air-query chatbot 502 of May 2026)
#   - closes the issue automatically once everything recovers
#
# Probe details live in scripts/health-check.sh. POST probes use an empty body
# so functions hit their own validation and spend no Groq tokens.

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # manual trigger
    inputs:
      base_url:
        description: 'Base URL to probe (defaults to production)'
        required: false
        default: 'https://www.janvayu.in'

permissions:
  issues: write
  contents: read

concurrency:
  group: function-health
  cancel-in-progress: false

env:
  OUTAGE_LABEL: 'status: outage'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run health check
        id: check
        run: |
          BASE_URL="${{ github.event.inputs.base_url || 'https://www.janvayu.in' }}" \
            bash scripts/health-check.sh report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Ensure outage label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$OUTAGE_LABEL" --color B60205 \
            --description "An automated health check found a live endpoint down" \
            --force 2>/dev/null || true

      - name: Sync tracking issue
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DOWN="${{ steps.check.outputs.exit_code }}"

          # Find an already-open outage issue, if any.
          EXISTING=$(gh issue list --label "$OUTAGE_LABEL" --state open \
                       --json number --jq '.[0].number // empty')

          BODY_FILE=report.md
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf '\n\n[Workflow run](%s)\n' "$RUN_URL" >> "$BODY_FILE"

          # transition: "down" = just went down, "recovered" = just came back,
          # "" = no state change. Email is sent only on a transition, so a
          # prolonged outage triggers exactly one alert, not one every 15 min.
          transition=""
          if [ "$DOWN" != "0" ]; then
            if [ -n "$EXISTING" ]; then
              echo "Outage ongoing — commenting on issue #$EXISTING"
              gh issue comment "$EXISTING" --body-file "$BODY_FILE"
            else
              echo "New outage — opening tracking issue"
              gh issue create \
                --title "🔴 Live function outage detected" \
                --label "$OUTAGE_LABEL" \
                --body-file "$BODY_FILE"
              transition="down"
            fi
          else
            if [ -n "$EXISTING" ]; then
              echo "Recovered — closing issue #$EXISTING"
              {
                echo "## ✅ Recovered"
                echo ""
                echo "All monitored endpoints are healthy again. Closing automatically."
                echo ""
                cat "$BODY_FILE"
              } > recovered.md
              gh issue comment "$EXISTING" --body-file recovered.md
              gh issue close "$EXISTING" --reason completed
              transition="recovered"
            else
              echo "All healthy — nothing to do."
            fi
          fi
          echo "transition=$transition" >> "$GITHUB_OUTPUT"

      # Immediate email alert on a state change, via Resend (the same provider
      # the daily digest uses). Sends one email when an outage starts and one
      # when it recovers. No-ops silently if RESEND_API_KEY isn't configured as
      # a repository secret.
      - name: Email alert on state change
        if: steps.sync.outputs.transition != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL || 'contribute@janvayu.in' }}
          RESEND_FROM: ${{ vars.RESEND_FROM || 'JanVayu Status <alerts@janvayu.in>' }}
          TRANSITION: ${{ steps.sync.outputs.transition }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "RESEND_API_KEY not set — skipping email alert."
            exit 0
          fi

          if [ "$TRANSITION" = "down" ]; then
            SUBJECT="🔴 JanVayu: a live service is DOWN"
          else
            SUBJECT="✅ JanVayu: all services recovered"
          fi

          # Build an HTML body from the latest probe report.
          REPORT_HTML=$(sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' report.md)
          HTML="<h2>${SUBJECT}</h2><p>Status page: <a href=\"https://www.janvayu.in/status\">janvayu.in/status</a> · <a href=\"${RUN_URL}\">workflow run</a></p><pre style=\"font-family:monospace;font-size:13px\">${REPORT_HTML}</pre>"

          # Compose JSON safely with jq.
          jq -n \
            --arg from "$RESEND_FROM" \
            --arg to "$ALERT_EMAIL" \
            --arg subject "$SUBJECT" \
            --arg html "$HTML" \
            '{from:$from, to:[$to], subject:$subject, html:$html}' > payload.json

          CODE=$(curl -s -o resp.json -w "%{http_code}" -X POST https://api.resend.com/emails \
                   -H "Authorization: Bearer ${RESEND_API_KEY}" \
                   -H "Content-Type: application/json" \
                   --data @payload.json)
          echo "Resend responded HTTP $CODE"
          if [ "$CODE" -ge 300 ]; then
            echo "::warning::Alert email failed (HTTP $CODE): $(cat resp.json)"
          else
            echo "Alert email sent to $ALERT_EMAIL"
          fi

      - name: Fail the job when endpoints are down
        if: steps.check.outputs.exit_code != '0'
        run: |
          echo "::error::One or more live endpoints are DOWN — see the tracking issue."
          exit 1
