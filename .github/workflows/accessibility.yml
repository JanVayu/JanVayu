name: Accessibility Audit (axe)

# Runs axe-core against the static site on every push and PR.
# Advisory only — surfaces violations in the PR step summary so reviewers
# see drift without breaking the build. Once the violation count is at zero
# (or knowingly ignored via .axerc), flip `--exit` to make this gating.

on:
  push:
    branches: [main, claude/weekly-factcheck]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  axe-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # axe-core/cli drives Chrome via ChromeDriver. The runner's Chrome and a
      # freshly-installed ChromeDriver can drift a major version apart (e.g.
      # Chrome 150 vs a driver built for 151), which makes every axe run fail
      # with "session not created" and silently produce zero results. This
      # action installs a ChromeDriver matching the runner's Chrome.
      - name: Install matching ChromeDriver
        uses: nanasess/setup-chromedriver@v3

      - name: Install axe-core/cli + http-server
        run: |
          npm install -g @axe-core/cli@4.10.1 http-server@14.1.1

      - name: Serve static site on port 8888
        run: |
          http-server . -p 8888 --silent &
          sleep 2
          curl -sf http://127.0.0.1:8888/ > /dev/null && echo "Server up" || (echo "Server failed to start" && exit 1)

      - name: Run axe against key URLs
        id: axe
        continue-on-error: true
        run: |
          mkdir -p axe-results
          set +e
          # The four most-visited surfaces. Add more as needed.
          # axe-core/cli ships its own ChromeDriver (built for the newest
          # Chrome) which drifts ahead of the runner's Chrome. Point it at the
          # version-matched driver that setup-chromedriver put on PATH.
          DRIVER="$(command -v chromedriver || true)"
          echo "Using chromedriver: ${DRIVER:-<bundled>}"
          for path in "" "ask/" "blog/" "downloads/"; do
            url="http://127.0.0.1:8888/${path}"
            slug=${path:-root}
            slug=${slug%/}
            echo "::group::axe ${slug}"
            axe "$url" \
              --tags wcag2a,wcag2aa \
              ${DRIVER:+--chromedriver-path "$DRIVER"} \
              --save "axe-results/${slug}.json" \
              --exit || true
            echo "::endgroup::"
          done

      - name: Summarise violations in PR step summary
        if: always()
        run: |
          echo "## Accessibility audit (axe-core, WCAG 2.1 AA)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Page | Violations | Top rule(s) |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----------:|-------------|" >> $GITHUB_STEP_SUMMARY
          TOTAL=0
          for f in axe-results/*.json; do
            [ -f "$f" ] || continue
            slug=$(basename "$f" .json)
            count=$(jq '[.[].violations[]] | length' "$f" 2>/dev/null || echo "0")
            top=$(jq -r '[.[].violations[] | .id] | group_by(.) | map({rule: .[0], n: length}) | sort_by(-.n) | .[0:3] | map("\(.rule) (×\(.n))") | join(", ")' "$f" 2>/dev/null || echo "—")
            echo "| \`/$slug/\` | $count | $top |" >> $GITHUB_STEP_SUMMARY
            TOTAL=$((TOTAL + count))
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total:** $TOTAL violations across audited pages." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full JSON reports are uploaded as a build artifact below." >> $GITHUB_STEP_SUMMARY

      - name: Upload full axe reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-reports
          path: axe-results/
          retention-days: 30

  # The contrast gate. tests/contrast-sweep.mjs is the hand explorer and is
  # deliberately NOT here: it opens the real page against the real APIs, and
  # the site paints a band colour per live AQI reading, so its counts move on
  # their own. One hand run reported 331 light failures and the next 499 with
  # no code change in between, and a gate on a number that drifts is a gate
  # somebody switches off.
  #
  # tests/contrast-ci.mjs removes the drift: every third-party request is
  # intercepted, the APIs that feed visible numbers are answered from
  # tests/fixtures/, and everything else is aborted so a CDN that loads here
  # and is blocked in an agent sandbox cannot make the same commit pass in one
  # place and fail in the other.
  #
  # This is gating, unlike the advisory axe job above. It exists because
  # check-theme-contrast.py reads css/*.css only: on 2026-09-22 the site
  # carried 164 failing elements, and the worst of them were a colour literal
  # in app.js and an undefined CSS variable, neither of which that guard can
  # see. What this does NOT cover: anything drawn into a <canvas>, anything
  # needing a third-party script to render, and any panel missing from
  # tests/contrast-sweep-panels.txt.
  contrast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Playwright and its Chromium
        run: |
          npm install --no-save playwright-core@1.49.1 playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Serve the site on port 8231
        run: |
          npx --yes http-server@14.1.1 . -p 8231 --silent &
          npx --yes wait-on@7.2.0 http://127.0.0.1:8231/ --timeout 60000

      - name: No text may fail WCAG AA in either theme
        run: node tests/contrast-ci.mjs
