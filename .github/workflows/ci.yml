name: CI

on:
  push:
    branches: [main, claude/weekly-factcheck]
  pull_request:
    branches: [main]

jobs:
  # Guard against accidental deletion/emptying of the main app file
  guard-index-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify index.html is not empty or gutted
        run: |
          LINES=$(wc -l < index.html)
          echo "index.html has $LINES lines"
          if [ "$LINES" -lt 100 ]; then
            echo "::error::index.html has only $LINES lines (expected ~13,000). This would take down www.janvayu.in!"
            exit 1
          fi

  # The site quotes its own figures in a dozen places — homepage cards, panels,
  # the README, the walkthrough decks — and they drift as the data grows. The
  # gallery went to 31 photographs while the homepage card still said 24, and
  # the ward count in the source panel was five releases stale. Both were
  # invisible until something recomputed the numbers from the data and compared.
  guard-site-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check stated figures against the data
        run: python3 scripts/check-site-figures.py

      # data/station-observed.json is the only layer on the site built from
      # instrument readings rather than a model, and it carries a correlation
      # against the satellite layer in its own metadata. This recomputes that
      # number from the records, so a hand-edited statistic cannot survive.
      # Deliberately network-free: the third-party API it is built from does
      # not belong in a per-push job. Rebuild with
      # `python3 scripts/build-station-observed.py`.
      - name: Check the observed station layer
        run: python3 scripts/build-station-observed.py --check

      # The national deweathering layer states, in its own metadata, how many
      # cities are improving once weather is removed. That count is the
      # headline anyone will quote, so it is recounted from the records here
      # rather than trusted. Network-free, like the layer above: the XKDR and
      # Open-Meteo calls belong in a rebuild, not a per-push job.
      - name: Check the national deweathering layer
        run: python3 scripts/build-deweathered-national.py --check

      # The homepage "How JanVayu works" diagram had every number right and its
      # whole inventory wrong: it named five live feeds and four satellite
      # sources, and neither of the two largest things on the site — eleven
      # years of CPCB's own bulletin, and the measured station record the
      # modelled layers are checked against. check-site-figures could not catch
      # that, because a missing source is not a wrong number. So the drawing is
      # generated from the data instead of hand-placed, in all three places it
      # appears. Rebuild with `python3 scripts/build-how-it-works.py`.
      - name: Check the how-it-works diagram
        run: python3 scripts/build-how-it-works.py --check

      # v26.6.210 shipped styles.css with its 67 Sargam icon URLs rewritten from
      # the CDN to a local /sargam/ path that is not in the repo, so every icon
      # on the site rendered as nothing. A status check could not see it:
      # Netlify's SPA fallback answers 200 for any unmatched path, so the
      # browser was handed text/html where it wanted an image. This checks the
      # paths against the repo instead of against a server.
      - name: Check every asset URL resolves
        run: python3 scripts/check-asset-urls.py

      # The desktop nav was rebuilt from nine groups to six plus an overflow
      # menu. Regrouping moves buttons between parents, and a destination that
      # loses its last button is not reachable on desktop at all: the panel
      # still exists, still renders if you get to it, and nothing errors. The
      # guard records every destination the chrome can reach in
      # data/nav-baseline.json and fails if that set shrinks, so a later tidy-up
      # cannot quietly orphan a tool. Adding one is a one-line baseline update.
      - name: Check no tool lost its way into the nav
        run: python3 scripts/check-nav-coverage.py

      # index.html inlines a subset of styles.css so the header and hero paint
      # before the 125KB stylesheet arrives. Its own comment says keep it in
      # sync; nothing checked that it was, and it had drifted 77 properties
      # across 30 selectors, frozen at the pre-redesign look. Two long-running
      # reports were this and only this: the page visibly flipping from the old
      # design to the new one on every refresh (measured: headline 57.6px ->
      # 80px, radius 12px -> 0, centre -> left, shadow -> none), and a hero note
      # cut mid-line, because styles.css loads second and its max-height of
      # 7.2em is four and a HALF lines at line-height 1.6. Edits to the inline
      # copy changed nothing, which is why it took so many rounds to find.
      - name: Check first paint draws the same page as final paint
        run: python3 scripts/check-critical-css.py

      # sw.js serves same-origin CSS/JS cache-first and never revalidates, so
      # ?v=<stamp> is the only thing that makes a returning visitor fetch a new
      # stylesheet. bump-version.mjs stamped with String.replace and no /g, so
      # it rewrote only the FIRST match: the <link rel="preload"> in <head>.
      # The <link rel="stylesheet"> that actually loads the file sits ~800
      # lines lower and stayed pinned at ?v=202606118 for about a hundred
      # releases. A first visit looked right, because a query string does not
      # change which file Netlify serves; anyone holding that URL in their
      # browser or SW cache kept the OLD stylesheet indefinitely, which reads
      # exactly like "the new design is not live" and was reported as such.
      - name: Versioned asset URLs carry the current stamp
        run: python3 scripts/check-asset-stamps.py

      # A dark-mode sweep on 2026-09-17 measured every text element on all 56
      # panels in both themes: 1,844 failing in dark, 1,233 in light, almost
      # all from three habits rather than 3,000 separate mistakes. A themed
      # background with hardcoded white text (6.52:1 light, 1.74:1 dark). A
      # hardcoded light background with no ink, so dark mode paints near-white
      # on a pastel at 1.01:1. And a band colour written as a literal in JS,
      # which cannot know which theme it landed in. The full sweep lives in
      # tests/contrast-sweep.mjs and is run by hand: its counts drift on their
      # own because the page shows live AQI.
      - name: Check no colour choice works in only one theme
        run: python3 scripts/check-theme-contrast.py

      # text-transform: uppercase is a display rule except for one character:
      # CSS maps U+00B5 MICRO SIGN to Greek capital Mu, so a label reading
      # "µg/m³" renders as "ΜG/M³" and a reader parses milligrams. A factor of
      # a thousand on the unit, with nothing wrong in the source, no console
      # error, and nothing to see in a diff. Two live instances existed,
      # including the AQI explainer's own breakpoint table.
      - name: Check no unit renders as milligrams
        run: python3 scripts/check-uppercase-units.py

      # CPCB's own daily AQI bulletins, 2015-2025, as day counts per city per
      # year. The check recomputes every category count from the records and
      # refuses two things the data cannot support: an annual mean AQI (an
      # index cannot be averaged) and any cross-year trend block (the stations
      # behind each city grew from a median of one to six, so the instrument
      # changed under the series).
      - name: Check the CPCB bulletin layer
        run: python3 scripts/build-aqi-bulletins.py --check

      # scripts/fetch-cpcb-bulletin.py reads a live PDF, so nothing in CI could
      # ever see it, and its one shipped defect was correspondingly invisible:
      # every page header carries the day of the month as a bare token, and
      # when that number equalled the serial following a page break the scanner
      # matched the header instead of the row and dropped a city. It cost one
      # city on all eight 21sts of 2026, and on 2025-11-15 it cost Arrah from
      # the very parse used to validate the parser. This drives the row grammar
      # over synthetic bulletins carrying both published layouts and every
      # day/page-break combination, offline.
      - name: Check the bulletin row grammar survives the page header
        run: python3 scripts/check-bulletin-parser.py

      # The About panel carries a "Just shipped (vX)" line and a Version
      # History, both prose, neither moving when a release ships. It advertised
      # v26.6.125 while the site ran v26.6.203, and the repo had already fixed
      # the same staleness once at v26.6.187 without adding a check.
      - name: Check the About panel is not far behind the release
        run: python3 scripts/check-about-currency.py

      # The four workshop decks in workshops/ are plain Markdown so anyone can
      # import them into Workshopy, project them or translate them. Three ways
      # they break without rendering wrong: a deck path in workshops.json that
      # no longer has a file behind it (the panel's download link 404s
      # silently), a quiz question where every option is "- [ ]" (imports
      # cleanly, grades cleanly, and cannot be answered correctly by anyone),
      # and a README table whose step counts have drifted from the files.
      - name: Check the workshop decks match what the site says about them
        run: python3 scripts/check-workshop-decks.py

      # data/stories.json feeds the homepage's blog section. It used to be
      # hand-maintained and went six posts stale, so the front page showed
      # nothing published that month. It is generated from blog/README.md now;
      # this fails the build if someone publishes a post without regenerating.
      - name: Check the homepage blog list matches the blog
        run: python3 scripts/build-blog-index.py --check

      # gallery/gallery.json was hand-written at 24 photographs and never
      # updated as the gallery reached 31, so it sat seven short while nothing
      # read it and nothing failed. A stale manifest that looks authoritative
      # is worse than no manifest: regenerating the gallery from it would have
      # dropped g25-g31, and the figure check above counts <figure> elements
      # in the panel, so it would not have noticed.
      - name: Check the photo manifest matches the gallery panel
        run: python3 scripts/build-gallery-manifest.py --check

      # data/district-history.json is 43 years x 783 districts and is built from a
      # 2.9 GB Zenodo archive that CI does not download. --check therefore verifies
      # the committed file's shape rather than rebuilding it: every district must
      # carry a complete annual and four-season series, so a truncated or
      # partially-written file fails here rather than rendering as gaps in a chart.
      - name: Check the district history is complete
        run: python3 scripts/build-district-history.py --check

      # data/reduction.json joins two sources that can drift apart without any
      # error: the LongPMInd annual mean per district, and a city-specific
      # apportionment study's shares. --check rebuilds it and diffs, so an edit
      # to data/apportionment.json that changes a share, or a district key that
      # stops resolving, fails here rather than shipping a calculator whose
      # parts no longer sum to the whole it claims.
      - name: Check the reduction calculator's data
        run: python3 scripts/build-reduction-data.py --check

      # The hero's dated standfirst is hand-written and nothing generates it.
      # It said "July 2026" on 1 August, caught only by a manual pre-conference
      # audit, and "August 2026" on 8 September, caught by a reader. Everything
      # else on that line ages fine; the month label is the part that rots on
      # its own, in the largest type on the page. A week's grace, then it fails.
      - name: Check the homepage bulletin is from this month
        run: python3 scripts/check-hero-currency.py

      # A retraction is not a one-time edit. JanVayu publicly retracted the
      # "~70% of global PM2.5 deaths" claim in July 2026 and fixed the homepage,
      # the panels and the assistant; on 8 September it was still live in eleven
      # files, all four translations among them. Delhi's superseded 91.6 µg/m³
      # was in nine. The correction reached every surface anyone looks at and
      # none of the surfaces they do not.
      - name: Check no retracted claim has come back
        run: python3 scripts/check-retracted-claims.py

      # Two conference decks and the wiki told visitors every number was
      # "fact-checked — weekly". The audit that phrase referred to ran five
      # times and stopped on 27 July 2026; six weeks later the promise was
      # still on the decks. This checks both ends: the audit may not go stale,
      # and no page may advertise a cadence the practice does not keep.
      - name: Check the fact-check promise matches the practice
        run: python3 scripts/check-factcheck-freshness.py

      # The de-weathered series is a model output, so the thing worth policing is
      # not its shape but whether the model is real: --check refuses the file if
      # the placebo (held-out score on shuffled targets) rises above 0.05, and if
      # fewer than two months are common to every year, since a naive annual mean
      # of this coverage reads the gaps as a trend.
      - name: Check the de-weathered series is sound
        run: python3 scripts/build-deweathered.py --check

  # Guard against the class of bug that took the chatbot (air-query) down for
  # ~2 weeks in May 2026: declaring `__dirname`/`__filename` at the top level
  # of a Netlify function. Netlify's esbuild bundler injects its own shims for
  # those identifiers, so a manual `const __dirname = ...` is a redeclaration
  # that throws "Identifier already declared" at load time → every request 502s.
  guard-netlify-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject top-level __dirname / __filename redeclarations
        run: |
          MATCHES=$(grep -rnE '^[[:space:]]*(const|let|var)[[:space:]]+(__dirname|__filename)[[:space:]]*=' \
                      netlify/functions || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::A Netlify function redeclares __dirname/__filename. This collides with the esbuild shim and 502s at load. Use new URL('./data/file.json', import.meta.url) instead."
            echo "$MATCHES"
            exit 1
          fi
          echo "OK — no __dirname/__filename redeclarations in netlify/functions"

      - name: Syntax-check all functions
        run: |
          shopt -s nullglob
          fail=0
          for f in netlify/functions/*.mjs netlify/functions/*.js; do
            if ! node --check "$f"; then
              echo "::error file=$f::Syntax error"
              fail=1
            fi
          done
          exit $fail

  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # On PR: don't fail the build — just surface the count in the PR check
      # summary so reviewers see drift. The strict, fail-on-broken pass runs
      # weekly via .github/workflows/link-audit.yml and reports via issue.
      - name: Check links (advisory, PR-time)
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --accept 200,204,301,302,403,429 --root-dir "${{ github.workspace }}" --exclude-path docs --exclude-path docs-bn --exclude-path docs-hi --exclude-path docs-mr --exclude-path docs-ta --exclude-path docs-impactmojo --exclude-path docs-impactmojo-bn --exclude-path docs-impactmojo-hi --exclude-path docs-impactmojo-mr --exclude-path docs-impactmojo-ta --exclude "localhost|127.0.0.1|example.com|twitter.com|x.com|linkedin.com|facebook.com|instagram.com|t.me|wa.me|play.google.com|apps.apple.com|mailto:|/api$|/api/|janvayu.in/api" --timeout 30 --max-retries 2 "**/*.html" "**/*.md"
          fail: false

      - name: Surface broken-link count in PR summary
        if: always()
        run: |
          if [ -f lychee/out.md ]; then
            BROKEN=$(grep -c "✗" lychee/out.md || echo "0")
            echo "## Broken-link audit" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**${BROKEN}** potentially-broken links found across HTML + Markdown." >> $GITHUB_STEP_SUMMARY
            if [ "$BROKEN" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details><summary>See full report</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              cat lychee/out.md >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          fi

