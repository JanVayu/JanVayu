name: CI

on:
  push:
    branches: [main, claude/weekly-factcheck]
  pull_request:
    branches: [main]

jobs:
  # Guard against accidental deletion/emptying of the main app file
  guard-index-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify index.html is not empty or gutted
        run: |
          LINES=$(wc -l < index.html)
          echo "index.html has $LINES lines"
          if [ "$LINES" -lt 100 ]; then
            echo "::error::index.html has only $LINES lines (expected ~13,000). This would take down www.janvayu.in!"
            exit 1
          fi

  # Guard against the class of bug that took the chatbot (air-query) down for
  # ~2 weeks in May 2026: declaring `__dirname`/`__filename` at the top level
  # of a Netlify function. Netlify's esbuild bundler injects its own shims for
  # those identifiers, so a manual `const __dirname = ...` is a redeclaration
  # that throws "Identifier already declared" at load time → every request 502s.
  guard-netlify-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject top-level __dirname / __filename redeclarations
        run: |
          MATCHES=$(grep -rnE '^[[:space:]]*(const|let|var)[[:space:]]+(__dirname|__filename)[[:space:]]*=' \
                      netlify/functions || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::A Netlify function redeclares __dirname/__filename. This collides with the esbuild shim and 502s at load. Use new URL('./data/file.json', import.meta.url) instead."
            echo "$MATCHES"
            exit 1
          fi
          echo "OK — no __dirname/__filename redeclarations in netlify/functions"

      - name: Syntax-check all functions
        run: |
          shopt -s nullglob
          fail=0
          for f in netlify/functions/*.mjs netlify/functions/*.js; do
            if ! node --check "$f"; then
              echo "::error file=$f::Syntax error"
              fail=1
            fi
          done
          exit $fail

  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # On PR: don't fail the build — just surface the count in the PR check
      # summary so reviewers see drift. The strict, fail-on-broken pass runs
      # weekly via .github/workflows/link-audit.yml and reports via issue.
      - name: Check links (advisory, PR-time)
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --accept 200,204,301,302,403,429 --root-dir "${{ github.workspace }}" --exclude-path docs --exclude-path docs-bn --exclude-path docs-hi --exclude-path docs-mr --exclude-path docs-ta --exclude-path docs-impactmojo --exclude-path docs-impactmojo-bn --exclude-path docs-impactmojo-hi --exclude-path docs-impactmojo-mr --exclude-path docs-impactmojo-ta --exclude "localhost|127.0.0.1|example.com|twitter.com|x.com|linkedin.com|facebook.com|instagram.com|t.me|wa.me|play.google.com|apps.apple.com|mailto:|/api$|/api/|janvayu.in/api" --timeout 30 --max-retries 2 "**/*.html" "**/*.md"
          fail: false

      - name: Surface broken-link count in PR summary
        if: always()
        run: |
          if [ -f lychee/out.md ]; then
            BROKEN=$(grep -c "✗" lychee/out.md || echo "0")
            echo "## Broken-link audit" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**${BROKEN}** potentially-broken links found across HTML + Markdown." >> $GITHUB_STEP_SUMMARY
            if [ "$BROKEN" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details><summary>See full report</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              cat lychee/out.md >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          fi

