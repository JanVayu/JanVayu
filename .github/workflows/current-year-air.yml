name: Current-year air layer

# The map's air figures are the 2024 satellite annual mean, because SatPM2.5
# V6GL03 has published nothing newer. The current-year layer fills that gap with
# a ~40 km model calibrated against the satellite series — and a "this year so
# far" figure is only true if something recomputes it as the year goes on.
#
# Runs on the 3rd of each month, which gives the upstream archive a couple of
# days to finalise the month that just ended. The script derives its own window
# from the date, so nothing here needs editing in January.

on:
  schedule:
    - cron: '0 4 3 * *'   # 04:00 UTC on the 3rd
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet shapely

      # The district geometry the script reads is a build artefact, not in the
      # repo. Rather than rebuild the whole boundary pipeline in CI, the layer
      # reuses the district centroids and 2024 values committed alongside it.
      - name: Rebuild the current-year layer
        run: python3 scripts/build-current-year-air.py --from-cache data/district-points.json

      # main is protected ("Changes must be made through a pull request"), so
      # the direct push this step used to make was refused on both runs it ever
      # had, 3 September and 3 October 2026, and the layer stayed at August with
      # nothing on the site to say so. The new month goes to a branch and a pull
      # request, the same fix the translation job needed (#411).
      - name: Open a pull request if the figures moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/current-year-air.json; then
            echo "No change: upstream has not published a new month yet."
            exit 0
          fi
          MONTH=$(python3 -c "import json;d=json.load(open('data/current-year-air.json'));m=d['_meta'];print(f\"{m['year']} through month {m['through_month']}\")")
          BRANCH="auto-air/${GITHUB_RUN_ID}"
          git config user.name "janvayu-air-bot"
          git config user.email "air-bot@janvayu.in"
          git checkout -b "$BRANCH"
          git add data/current-year-air.json
          git commit -m "Current-year air layer: $MONTH"
          git push origin "$BRANCH"
          if ! gh pr create --base main --head "$BRANCH" \
               --title "Current-year air layer: $MONTH" \
               --body "Monthly rebuild of data/current-year-air.json from the CAMS archive via Open-Meteo, calibrated to SatPM2.5 2024. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; then
            echo "::warning::Branch $BRANCH is pushed but the pull request was not opened (Settings > Actions > General > allow GitHub Actions to create pull requests). Open it from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...$BRANCH"
          fi
