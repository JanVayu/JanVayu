name: Code Quality (HTML + JS)

# Advisory HTML validation and JS linting on every PR. Surfaces issues
# in the step summary; never gates the build. Once the report is clean
# (or has a documented ignore list), promote individual checks to gating.

on:
  push:
    branches: [main, claude/weekly-factcheck]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run html-validate
        id: htmlv
        continue-on-error: true
        run: |
          npx --yes html-validate@9 \
            --formatter "stylish" \
            --config .htmlvalidate.json \
            "index.html" "blog/**/*.html" "ask/**/*.html" "embed/**/*.html" "downloads/**/*.html" "pm25/**/*.html" "pm10/**/*.html" "co/**/*.html" "no2/**/*.html" "so2/**/*.html" "o3/**/*.html" \
            > html-validate.log 2>&1 || true
          tail -200 html-validate.log

      - name: Surface in PR summary
        if: always()
        run: |
          echo "## HTML validation (advisory)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s html-validate.log ]; then
            ERRS=$(grep -cE "^.*(error|warning)" html-validate.log || echo "0")
            echo "**${ERRS}** issues found across HTML files." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Last 100 lines of html-validate output</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 html-validate.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "No HTML output captured." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload html-validate log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: html-validate
          path: html-validate.log
          retention-days: 30

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Rules live in eslint.config.mjs, not in flags here. ESLint 9 removed
      # --no-eslintrc and --rule, so the old invocation exited before linting
      # anything and `|| true` hid it: a green job that checked nothing.
      - name: Run ESLint (advisory)
        id: eslint
        continue-on-error: true
        run: |
          set +e
          npx --yes eslint@9 \
            "netlify/functions/**/*.mjs" "netlify/functions/**/*.js" "scripts/**/*.mjs" "ask/**/*.js" "sw.js" \
            --format stylish > eslint.log 2>&1
          status=$?
          set -e
          # Exit 1 means lint findings, which are advisory here. Anything else
          # (2 = config/flag/crash) means the lint did not run, and that must
          # not be reported as a clean pass.
          if [ $status -gt 1 ]; then
            echo "ESLINT_DID_NOT_RUN=1" >> $GITHUB_ENV
            echo "::warning::ESLint failed to run (exit $status) — see the log; this is NOT a clean lint."
          fi
          tail -200 eslint.log

      - name: Surface in PR summary
        if: always()
        run: |
          echo "## ESLint (advisory)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${ESLINT_DID_NOT_RUN:-0}" = "1" ]; then
            echo "**ESLint did not run — this is not a clean lint.** See the log below." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -s eslint.log ]; then
            PROBLEMS=$(grep -E "problems? \(" eslint.log | tail -1 || true)
            echo "**${PROBLEMS:-No problem summary line — ESLint produced no report.}**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Last 100 lines of eslint output</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 eslint.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "No ESLint output captured." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload eslint log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eslint
          path: eslint.log
          retention-days: 30
