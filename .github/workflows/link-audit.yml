name: Weekly Link Audit (strict)

# Strict link audit that runs weekly and opens / updates a tracking issue
# if any broken links are found. PR-time lychee remains advisory in ci.yml.
#
# To suppress a known false-positive add it to .lycheeignore at the repo root.

on:
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  issues: write
  contents: read

jobs:
  strict-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run lychee in strict mode
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            --accept 200,204,301,302,403,429
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
            --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"
            --root-dir "${{ github.workspace }}"
            --exclude-path docs --exclude-path docs-bn --exclude-path docs-hi --exclude-path docs-mr --exclude-path docs-ta
            --exclude-path docs-impactmojo --exclude-path docs-impactmojo-bn --exclude-path docs-impactmojo-hi --exclude-path docs-impactmojo-mr --exclude-path docs-impactmojo-ta
            --exclude "localhost|127.0.0.1|example.com|twitter.com|x.com|linkedin.com|facebook.com|instagram.com|t.me|wa.me|play.google.com|apps.apple.com|mailto:|/api($|/|[?])|janvayu[.]in/api($|/|[?])"
            --timeout 30
            --max-retries 2
            "**/*.html" "**/*.md"
          fail: true
          # honours .lycheeignore at repo root automatically

      # Without this the action opens a NEW issue every Monday. Five had piled
      # up by 2026-09 (#277, #314, #318, #325, #329) carrying the same two
      # errors, so nothing distinguished a fresh break from a month-old one and
      # the audit stopped being read. Reuse the open one instead.
      - name: Find the existing tracking issue
        id: existing
        if: failure() && steps.lychee.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'type: housekeeping', per_page: 100,
            });
            const hit = data.find(i => i.title === 'Weekly link audit — broken links detected');
            core.setOutput('number', hit ? String(hit.number) : '');
            core.info(hit ? `Reusing #${hit.number}` : 'None open; a new one will be created.');

      - name: Open / refresh tracking issue on failure
        if: failure() && steps.lychee.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Weekly link audit — broken links detected"
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.existing.outputs.number }}
          labels: |
            type: housekeeping
            priority: medium
