name: Weekly Link Audit (strict)

# Strict link audit that runs weekly and opens / updates a tracking issue
# if any broken links are found. PR-time lychee remains advisory in ci.yml.
#
# To suppress a known false-positive add it to .lycheeignore at the repo root.

on:
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  issues: write
  contents: read

jobs:
  strict-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee in strict mode
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            --accept 200,204,301,302,403,429
            --exclude-mail
            --exclude "localhost|127.0.0.1|example.com|twitter.com|x.com|linkedin.com|facebook.com|instagram.com|t.me|wa.me|play.google.com|apps.apple.com"
            --timeout 30
            --max-retries 2
            "**/*.html" "**/*.md"
          fail: true
          # honours .lycheeignore at repo root automatically

      - name: Open / refresh tracking issue on failure
        if: failure() && steps.lychee.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Weekly link audit — broken links detected"
          content-filepath: ./lychee/out.md
          labels: |
            type: housekeeping
            priority: medium
