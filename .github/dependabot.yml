version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies","ci"]
    open-pull-requests-limit: 2

  # Added 2026-10-02: resend and @netlify/blobs had drifted 15 and 1 minor
  # versions behind with nothing to say so, because only GitHub Actions were
  # covered. Monthly, one PR at a time, grouped so a minor bump is not three PRs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
