<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JanVayu — Full Walkthrough Deck</title>
<meta name="description" content="The comprehensive, always-up-to-date walkthrough of JanVayu — a slide for every section of India's citizen air-quality platform.">
<style>
  @font-face { font-family:'Fraunces'; font-weight:700; font-display:swap; src:url('/fonts/fraunces-700.woff2') format('woff2'); }
  @font-face { font-family:'Fraunces'; font-weight:400; font-display:swap; src:url('/fonts/fraunces-400.woff2') format('woff2'); }
  @font-face { font-family:'Kalam'; font-weight:400; font-display:swap; src:url('/fonts/kalam-400.woff2') format('woff2'); }
  @font-face { font-family:'Kalam'; font-weight:700; font-display:swap; src:url('/fonts/kalam-700.woff2') format('woff2'); }

  :root {
    --ink:#1e2a22; --muted:#5b6b60; --paper:#fbfaf7; --line:#e7e4dc;
    --green-700:#15803d; --green-900:#0f2b1c; --accent:#15803d; --red:#c92a2a;
    --sans: system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --serif:'Fraunces','Georgia',serif;
  }
  * { margin:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { background:#0b1a12; color:var(--ink); font-family:var(--sans); overflow:hidden; }

  /* Stage */
  .stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .slide {
    position:absolute; width:min(96vw, calc(96vh * 16 / 9)); aspect-ratio:16/9;
    background:var(--paper); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.5);
    padding:clamp(24px,4.2vw,64px); overflow:hidden;
    opacity:0; transform:translateX(40px) scale(.98); pointer-events:none;
    transition:opacity .38s ease, transform .38s ease;
    display:flex; flex-direction:column;
  }
  .slide.active { opacity:1; transform:none; pointer-events:auto; }
  .slide.prev { transform:translateX(-40px) scale(.98); }
  @media (prefers-reduced-motion: reduce){ .slide{ transition:opacity .2s; transform:none;} .slide.prev{transform:none;} }

  /* ── Mobile / portrait: drop the fixed 16:9 box; let the active slide fill
       the width and flow vertically so nothing overlaps. One slide at a time. */
  @media (max-width: 820px), (orientation: portrait) {
    html, body { overflow-y: auto; }
    .stage { position: static; display: block; min-height: 100vh; padding: 54px 12px 96px; }
    .slide {
      position: relative; width: 100%; max-width: 640px; margin: 0 auto;
      aspect-ratio: auto; min-height: calc(100vh - 170px);
      padding: 26px 22px; overflow: visible;
      opacity: 0; transform: none; pointer-events: none; display: none;
    }
    .slide.active { display: flex; opacity: 1; pointer-events: auto; }
    .slide.prev { transform: none; }
    h1.title { font-size: clamp(2rem, 9vw, 3rem); }
    h2.head { font-size: clamp(1.55rem, 6.6vw, 2.1rem); }
    .sub { font-size: 1.05rem; max-width: none; }
    .body, .figrow { flex-direction: column; align-items: stretch; gap: 18px; flex: none; margin-top: 1em; }
    .col { flex: none; min-width: 0; }
    ul.points li { font-size: 1rem; }
    .stats { grid-template-columns: 1fr; gap: 16px; flex: none; }
    .stat { text-align: left; }
    .stat .n { font-size: 2.4rem; }
    .dgm { min-height: 0; }
    .dgm svg { width: 100%; height: auto; max-height: 52vh; }
    .slide-note { position: static; margin-top: 18px; }
  }

  /* Slide interior */
  .eyebrow { font-size:clamp(.7rem,1.1vw,.85rem); font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); display:flex; align-items:center; gap:10px; }
  .eyebrow::before { content:''; width:26px; height:3px; background:var(--accent); border-radius:2px; }
  h1.title { font-family:var(--serif); font-weight:700; font-size:clamp(2rem,5.4vw,4.2rem); line-height:1.02; letter-spacing:-.02em; color:var(--ink); text-wrap:balance; margin-top:.2em; }
  h2.head { font-family:var(--serif); font-weight:700; font-size:clamp(1.5rem,3.4vw,2.7rem); line-height:1.08; letter-spacing:-.015em; color:var(--ink); text-wrap:balance; margin:.15em 0 .35em; }
  .sub { font-size:clamp(1rem,1.7vw,1.35rem); color:var(--muted); line-height:1.5; max-width:46ch; }
  .body { display:flex; gap:clamp(20px,3vw,48px); flex:1; min-height:0; margin-top:.6em; align-items:center; }
  .col { flex:1; min-width:0; }
  ul.points { list-style:none; display:flex; flex-direction:column; gap:clamp(10px,1.6vw,20px); }
  ul.points li { position:relative; padding-left:1.5em; font-size:clamp(.95rem,1.6vw,1.3rem); line-height:1.45; color:var(--ink); }
  ul.points li::before { content:''; position:absolute; left:0; top:.55em; width:.6em; height:.6em; border-radius:2px; background:var(--accent); }
  ul.points li b { font-weight:700; }
  ul.points li span { color:var(--muted); }
  .figrow { display:flex; gap:clamp(16px,3vw,40px); flex:1; min-height:0; align-items:stretch; margin-top:.5em; }
  .stat { text-align:center; }
  .stat .n { font-family:var(--serif); font-weight:700; font-size:clamp(2rem,5vw,3.6rem); line-height:1; color:var(--ink); }
  .stat .n.red { color:var(--red); }
  .stat .l { font-size:clamp(.8rem,1.3vw,1rem); color:var(--muted); margin-top:.4em; line-height:1.35; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(16px,3vw,40px); flex:1; align-content:center; }
  .dgm { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  .dgm svg { width:100%; height:100%; max-height:100%; object-fit:contain; }
  .slide-note { position:absolute; bottom:clamp(14px,2vw,26px); left:clamp(24px,4.2vw,64px); font-size:.8rem; color:var(--muted); }
  .foot { display:flex; align-items:baseline; gap:14px; margin-top:auto; padding-top:.6em; }
  .foot .brand { font-family:var(--serif); font-weight:700; color:var(--green-700); }
  .foot .url { font-size:.85rem; color:var(--muted); }
  .kicker { font-family:var(--serif); font-size:clamp(3rem,9vw,7rem); font-weight:700; line-height:1; color:rgba(255,255,255,.14); position:absolute; top:clamp(18px,3vw,40px); right:clamp(24px,4.5vw,64px); }

  /* Title / section slides — dark */
  .slide.cover { background:var(--green-900); color:#fff; justify-content:center; }
  .slide.cover h1.title, .slide.cover h2.head { color:#fff; }
  .slide.cover .sub { color:rgba(255,255,255,.82); max-width:52ch; }
  .slide.cover .eyebrow { color:#7fdba4; }
  .slide.cover .eyebrow::before { background:#15803d; }
  .slide.cover .foot .brand { color:#9be3b6; }
  .slide.cover .foot .url { color:rgba(255,255,255,.7); }
  .slide.cover .leaf { position:absolute; inset:0; border-radius:16px; background:radial-gradient(1000px 420px at 50% 118%, rgba(21,128,61,.4), transparent 70%); }

  /* Chrome */
  .bar { position:fixed; top:0; left:0; height:4px; background:var(--green-700); width:0; transition:width .3s ease; z-index:20; }
  .hud { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:20; display:flex; align-items:center; gap:14px; background:rgba(0,0,0,.5); color:#fff; padding:7px 14px; border-radius:999px; font-size:.85rem; backdrop-filter:blur(6px); }
  .hud button { background:none; border:none; color:#fff; cursor:pointer; font-size:1.1rem; line-height:1; padding:2px 6px; border-radius:6px; }
  .hud button:hover { background:rgba(255,255,255,.15); }
  .hud .count { font-variant-numeric:tabular-nums; min-width:3.5em; text-align:center; }
  .hint { position:fixed; top:12px; right:14px; z-index:20; color:rgba(255,255,255,.6); font-size:.75rem; }
  .hint kbd { background:rgba(255,255,255,.12); border-radius:4px; padding:1px 5px; font-family:var(--sans); }

  /* Speaker notes */
  .notes { position:fixed; inset:auto 0 0 0; max-height:38vh; overflow:auto; background:#10241a; color:#e7f5ee; padding:18px 22px; z-index:25; transform:translateY(101%); transition:transform .3s ease; border-top:2px solid var(--green-700); }
  .notes.open { transform:none; }
  .notes h4 { font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:#7fdba4; margin-bottom:6px; }
  .notes p { font-size:.95rem; line-height:1.55; }

  /* Overview grid */
  body.overview .stage { display:none; }
  .grid { position:fixed; inset:0; overflow:auto; padding:24px; display:none; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; align-content:start; }
  body.overview .grid { display:grid; }
  .thumb { aspect-ratio:16/9; background:var(--paper); border-radius:8px; border:2px solid transparent; cursor:pointer; overflow:hidden; position:relative; padding:12px; display:flex; flex-direction:column; }
  .thumb.cover { background:var(--green-900); color:#fff; }
  .thumb:hover { border-color:var(--green-700); }
  .thumb .tnum { position:absolute; top:6px; right:8px; font-size:.7rem; color:var(--muted); }
  .thumb.cover .tnum { color:rgba(255,255,255,.6); }
  .thumb .tt { font-family:var(--serif); font-weight:700; font-size:.95rem; line-height:1.15; }

  /* Print → PDF: one slide per page */
  @media print {
    body { background:#fff; overflow:visible; }
    .bar,.hud,.hint,.notes,.grid { display:none !important; }
    .stage { position:static; display:block; }
    .slide { position:relative; opacity:1 !important; transform:none !important; width:100%; aspect-ratio:16/9;
      box-shadow:none; border:1px solid var(--line); border-radius:0; page-break-after:always; margin:0; }
  }
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════════════
window.FULL_SLIDES = [
  // ── COVER ──
  { cover: true, ch: 'The complete tour', head: 'JanVayu, end to end',
    sub: 'Every section of the platform — the live data, the health toll, the money, the accountability, and the tools — one slide at a time.',
    note: 'This is the long walkthrough: a slide for essentially every panel on the site. Use it to train a newsroom, brief a class, or onboard a collaborator. For a 10-minute overview instead, use the short deck.' },

  // ── CH.1 WHY IT EXISTS ──
  { ch: 'Why it exists', head: 'India breathes the world’s most dangerous air',
    points: ['<b>1.72 million</b> deaths a year from ambient PM2.5 (Lancet Countdown 2025)', '<b>3.5 years</b> of life expectancy lost on average (AQLI 2025)', '<b>6th</b> most-polluted country; Loni the most-polluted city on Earth (IQAir 2025)', 'Roughly a quarter of the global PM2.5 death burden — the largest of any nation'],
    sub: 'The scale is why JanVayu exists: to turn scattered official data into a public record anyone can act on.', note: 'Open on the human scale, sourced. These are the anchor numbers repeated across the site, each fact-checked against its primary source.' },
  { ch: 'Why it exists', head: 'A public record, not a campaign',
    points: ['<b>Non-partisan</b> — we track promises and money, not parties', '<b>Citizen-led and open</b> — anyone can read, reuse or improve it', '<b>Every number cites its source</b>, and is re-checked against it every week', 'Free, forever, no ads'],
    sub: 'The case for clean air is strong enough that it never needs an exaggerated number.', note: 'Establish trust posture early: independence, sourcing, and the self-fact-checking discipline are the platform’s backbone.' },
  { ch: 'Why it exists', head: 'One clear picture, from many sources',
    points: ['<b>CPCB / CAAQMS</b> — India’s official monitoring network', '<b>WAQI, IQAir, OpenAQ</b> — global aggregators and community sensors', '<b>CREA, WHO, Lancet, NASA</b> — research and satellite data', 'JanVayu cleans and cross-checks them into one picture you can trust'],
    sub: 'Scattered official data, turned into something a citizen can actually read.', note: 'The value-add is synthesis and honesty, not owning sensors. Name the sources so users can verify.' },

  // ── CH.2 THE LIVE PICTURE ──
  { ch: 'The live picture', head: 'The dashboard',
    points: ['Live <b>PM2.5</b> for your city in µg/m³, with the AQI beside it and a plain-language health band', 'Cigarette-equivalent and disease-risk read-outs', '“Did you know” sourced facts and an anomaly explainer', 'Everything one tap from the city selector at the top'],
    sub: 'The home screen answers “how bad is it right now, and what does that mean for me?”', note: 'Walk the dashboard top to bottom; point out the city selector drives the whole page.' },

    points: ['157 Indian cities, ranked and coloured on <b>PM2.5</b> — the fraction that reaches the bloodstream', 'Type-to-search — jump to any city instantly', 'Covers the major NCAP non-attainment towns', 'Every value shown with its source and time'],
    sub: 'The whole country, one city tap away — and every headline number is PM2.5, not an index.', note: 'Core cities load live; the rest load when picked, to stay inside the data source’s free tier — but that’s a build detail, not something the reader needs on screen.' },
  { ch: 'The live picture', head: 'The live map',
    points: ['Every monitoring station plotted, colour-coded by AQI', '<b>MPs / MLAs / Districts</b> — all 543 Lok Sabha seats and 785 districts coloured by live air; grey where no monitor is near', '<b>Sources</b> — landfills, dumpsites, coal mines, red/orange industrial parks, SEZs', 'Constituency pop-ups link straight to the Accountability tracker and RTI templates'],
    sub: 'Where the numbers come from — and the air your MP answers for.', note: 'Emphasise the grey constituencies: that is the real monitoring gap, not a rendering error. Boundaries and source locations come from indianopenmaps.com (SBM, LGD, GatiShakti mirrors), attributed on the map.' },
  { ch: 'The live picture', head: 'Rankings & comparison',

  { ch: 'The live picture', head: 'Trends & forecast',

    sub: 'Look back to understand, look forward to plan.', note: 'The forecast is key-less and free; it feeds the chatbot’s tomorrow-answers too. Be honest about the fire map’s season — it peaks mid-Oct to late-Nov and is quiet the rest of the year.' },
  { ch: 'The live picture', head: 'One map, every place in India',
    points: ['A <b>Boundaries</b> menu covering <b>983,149 areas across seven levels</b> — state, district, block/mandal/tehsil, gram panchayat and village; city and ward', 'A <b>Colour</b> menu with nine measures: annual PM2.5, the same air by season, surface heat, tree cover, green cover and built-up', 'Every area carries all nine — no dropdown, no list of supported cities', 'A tenth, <b>this year so far</b>, answers the question everyone asks about the 2024 date — districts only, because it is a ~40 km model corrected against the satellite series, and it rebuilds every month', '<b>Compare</b> — plot any two measures against each other for whatever is on screen', '<b>Who breathes it</b> — schools and health centres over any level'],

  { ch: 'The live picture', head: 'Your airshed, or your town?',
    points: ['Across <b>785 districts</b>, <b>89.2%</b> of the variance in annual PM2.5 sits <i>between</i> states, not within them', 'State medians run Delhi <b>92.7</b> down to Ladakh <b>13.9</b>; 13 states and UTs are above India\u2019s own limit of 40', 'Pick a district and the panel splits its distance from the national median into region and local deviation', '<b>43 years</b> of PM2.5 underneath it: 783 districts, 1980 to 2022, annual and by season'],
    sub: 'NCAP sets targets city by city. Most of the burden arrives from the airshed.',

    points: ['Pick a state and a topic; it drafts a filing-ready RTI', 'Pre-filled from a scorecard when a city misses its target', 'Names the right pollution-control authority', 'Turns a citizen’s frustration into a formal question'],
    sub: 'The single most actionable tool on the site.', note: 'Demo the scorecard → RTI hand-off; it’s the platform’s theory of change in one flow.' },

  // ── CH.6 CITIZEN ACTION ──
  { ch: 'Citizen action', head: 'Act, learn, be heard',
    points: ['<b>Take Action / Citizen Plan</b> — concrete steps for your situation', '<b>Voices & Field Testimony</b> — the social record and on-ground accounts', '<b>Workshops</b> — book a facilitated session, plus a 10-question air-literacy self-check', '<b>Learning Games</b> — seven original India-context games'],
    sub: 'A platform you use, not just read.', note: 'Games + the new air-literacy quiz make this classroom-ready; workshops connect to a live facilitator.' },
  { ch: 'Citizen action', head: 'News, in context',
    points: ['<b>Social Feed</b> — Reddit, YouTube and Indian news, refreshed automatically', '<b>Live News</b> — the latest reporting, aggregated', '<b>Photo Gallery</b> — “The air, in pictures”, 32 documentary photographs', '<b>From the blog</b> — the newest post and the three behind it, on the dashboard'],
    sub: 'Keep the issue alive between crises.', note: 'If someone asks why X and Instagram are only links: neither can be read without a paid or authenticated API, so we link to the live search rather than show a feed that is not one — and every X link on the site is checked against X\u2019s public embed endpoint before it ships. The blog section is generated from the blog index, so publishing is enough to reach the front page. Every gallery photograph carries its own credit and source link.' },

  // ── CH.7 TOOLS & KNOWLEDGE ──
  { ch: 'Tools & knowledge', head: 'Ask JanVayu',
    points: ['A chatbot that answers about your city and ward', 'Seasonal, forecast and NCAP context built in', 'Answers in ten languages, with sources', 'Your fastest way into the data'],
    sub: 'Natural-language access to everything above.', note: 'It answers from JanVayu’s own verified figures and cites them; an eval suite gates it against fabricated citations and invented orders or schemes.' },
  { ch: 'Tools & knowledge', head: 'Learn & look things up',
    points: ['<b>Understanding AQI</b> — what the number actually rolls up', '<b>Glossary</b> — the vocabulary, one keystroke away (Ctrl-K)', '<b>Reading List</b> — a live Zotero library of ~29 studies', '<b>FAQ</b> — 27 sourced answers with a live search'],
    sub: 'From curious to informed.', note: 'Reading List is a real Zotero group; the AQI explainer’s CPCB-vs-EPA table was just corrected.' },
  { ch: 'Tools & knowledge', head: 'Take the data with you',
    points: ['<b>Downloads</b> — briefs, datasets, and citation-ready material', '<b>Data Archive</b> — a growing record of readings over time', '<b>Open Data API</b> — pull the data straight into your own work, no login', '<b>Embeddable widgets</b> — drop live AQI or rankings into any site'],
    sub: 'Built for researchers, journalists and advocates.', note: 'The API + embeds are the “use JanVayu in your work” surface; licence and citation are included.' },

  // ── CH.8 TRUST ──
  { ch: 'Trust', head: 'Every number, checked against its source',
    points: ['Every figure the site states is recomputed from the data on <b>every change</b>, and the build fails on drift', 'A claim we have <b>retracted</b> cannot come back \u2014 the build refuses it, in five languages', 'A periodic deep audit re-verifies statistics against primary sources; findings are logged publicly', 'Two honest methods are never collapsed into one, and unverifiable numbers are flagged rather than guessed'],
    sub: 'Honesty has to survive the plumbing.', note: 'This is what separates JanVayu from a marketing site, and it is worth being exact about which half is continuous and which is periodic. Continuous: the build recomputes every stated figure from the underlying data and fails on drift, and since September 2026 it also refuses a claim the site has publicly retracted, including inside the Hindi, Bengali, Marathi and Tamil docs. Periodic: a deeper audit that re-verifies statistics against primary sources on the web, whose findings are written into dated files in docs/. That deeper audit ran weekly through July 2026 and the deck used to promise weekly; it is not on a schedule now, so the wording says periodic. A guard fails the build if it goes more than four months without running.' },
  { ch: 'Trust', head: 'We check our own map against the monitors',
    points: ['Every PM2.5 figure on the site is <b>modelled</b> — satellite, reanalysis or reconstruction — and each says so', 'Since v26.6.184 there is also a <b>measured</b> layer: CPCB\u2019s own hourly record, via the XKDR India Air Quality Database (CC BY 4.0)', 'For 2024 the satellite map and the station readings agree at <b>r = 0.834</b>, the satellite about 2 \u00b5g/m\u00b3 lower', 'That gap is the right direction, not an error \u2014 a district average includes the fields around the city'],
    sub: 'A model you never compare against an instrument is a claim, not a measurement.',
    note: 'This is the slide that answers "how do you know your map is right". Be careful not to oversell it: the comparison validates pattern, not level, and a point monitor is not a district mean. Two honest by-products worth mentioning. First, 250 of 534 stations cannot produce a defensible annual mean for 2024 \u2014 they fail a twelve-month completeness test \u2014 which is a finding about the monitoring network, not a filter we should loosen. Second, the archive advertises coverage to March 2026 but CPCB\u2019s feed into it stops on 1 September 2025; the months after are two US Embassy monitors. We documented that the day after we got it wrong ourselves.' },
  { ch: 'Trust', head: 'Eleven years of the government\u2019s own bulletin',
    points: ['CPCB publishes a daily AQI bulletin as a PDF, and has since 1 May 2015 \u2014 published, and effectively unreadable as a series',
             'We hold it as one table: <b>297 cities, 2015 to 2026</b>, 507,334 city-days, days in each official category per city per year',
             'Beside every figure is <b>the number of monitors behind it</b>, which is the part that changes what the number means',
             'In CPCB\u2019s own 2024 bulletin, <b>204 of 264 cities had a citywide AQI from a median of exactly one monitor</b>'],
    sub: 'The record was always public. It was not usable.',
    note: 'Two things to be careful about if asked. First, there is deliberately no trend line across the window and the build refuses to let one in: reporting grew from 10 cities to 236 and the stations under each city grew with it, so a fall in Poor-or-worse days cannot be separated from a change in what was measuring. Read a single year. Second, 2015 and 2026 are part years and are marked as such next to the number, because 136 bad days of 235 in 2015 against 157 of 366 in 2024 reads as a rise and is a fall. 2015\u20132025 is UrbanEmissions.info\u2019s extraction, credited on the panel; 2026 is our own parse of the same PDFs, and on three 2025 dates checked city by city the two agree on all 671 city-days they share.' },
  { ch: 'Trust', head: 'Was it policy, or was it the wind?',
    points: ['A city\u2019s air can improve because it emitted less \u2014 or because the wind blew harder', 'We separate the two for <b>44 cities, 2018\u20132024</b>, using random forests over local weather (Grange et al. 2018)', '<b>33 are improving</b> once weather is removed. <b>11 are not.</b>', 'Steepest falls: Meerut \u221214.6, Varanasi \u221214.2, Lucknow \u221214.0 \u00b5g/m\u00b3 a year. Rising: Chandigarh +3.1, Gwalior +2.4, Mumbai +0.8'],
    sub: 'Every \u201cair improved by X%\u201d headline rests on not knowing which of the two happened.',
    note: 'The most quotable slide in the deck, so be precise about what it does and does not show. It removes weather as an explanation; it does not prove policy caused the rest. Emissions, fuel mix, construction and economic activity all sit inside what is left. Worth adding that normalisation mostly confirms the raw trend \u2014 only 6 of 44 cities move by a microgram a year or more \u2014 and in five of those the raw number was understating the improvement, so the fear that a city is claiming credit the wind earned is rarer than people expect. R\u00b2 runs 0.52 to 0.91; cities are not comparable to each other on it.' },
  { ch: 'Trust', head: 'Live vs annual — the honest version',
    points: ['A single day’s AQI swings with the weather', 'Annual averages are the fair yardstick for comparison', 'Ward maps show a live SPREAD, not a per-street truth', 'We say so, everywhere the distinction matters'],
    sub: 'Being right includes being clear about uncertainty.', note: 'The live-vs-annual honesty is a recurring theme; it protects the platform from over-claiming.' },

  // ── CLOSING ──
  { cover: true, ch: 'Get involved', head: 'Clean air is not a privilege. It is a right.',
    sub: 'The platform is open source and the data is yours — pull it, embed it, file an RTI with it, or add your name to the team at github.com/JanVayu/JanVayu.',
    note: 'Close on agency: the point of all this data is to be used. Point to the API, the RTI Assistant, and contribute@janvayu.in.' }
];

(function(){
  var DATA = window.FULL_SLIDES;
  var stage = document.getElementById('stage');
  var bar = document.getElementById('bar'), count = document.getElementById('count');
  var notesEl = document.getElementById('notes'), noteBody = document.getElementById('noteBody');
  var grid = document.getElementById('grid');
  var i = 0, slides = [], NOTES = [];

  // Chapter order (content slides only) → used for divider numbering.
  var chapterOrder = [];
  DATA.forEach(function(d){ if(!d.cover && d.ch && chapterOrder.indexOf(d.ch)<0) chapterOrder.push(d.ch); });
  function pad2(n){ return (n<10?'0':'') + n; }

  // Build the deck HTML + a parallel speaker-notes array.
  function build(){
    var html = '', lastCh = null;
    DATA.forEach(function(d){
      // Auto chapter divider before the first content slide of a new chapter.
      if(!d.cover && d.ch && d.ch !== lastCh){
        lastCh = d.ch;
        var n = chapterOrder.indexOf(d.ch) + 1;
        html += '<section class="slide cover"><div class="leaf"></div>'
              + '<span class="kicker">' + pad2(n) + '</span>'
              + '<div class="eyebrow">Chapter ' + pad2(n) + '</div>'
              + '<h2 class="head">' + d.ch + '</h2>'
              + '<div class="foot"><span class="brand">janvayu.in</span></div></section>';
        NOTES.push('Chapter ' + n + ' — ' + d.ch + '. ' + (chapterBlurb(d.ch) || ''));
      }
      if(d.cover){
        html += '<section class="slide cover"><div class="leaf"></div>'
              + '<div class="eyebrow">' + d.ch + '</div>'
              + '<h1 class="title" style="font-size:clamp(2rem,4.6vw,3.6rem)">' + d.head + '</h1>'
              + (d.sub ? '<p class="sub" style="margin-top:.6em">' + d.sub + '</p>' : '')
              + '<div class="foot"><span class="brand">janvayu.in</span>'
              + '<span class="url">Non-partisan · citizen-led · open source · free forever</span></div></section>';
      } else {
        var body;
        if(d.points && d.points.length){
          var lis = d.points.map(function(p){ return '<li>' + p + '</li>'; }).join('');
          body = '<div class="body"><div class="col"><ul class="points">' + lis + '</ul></div>'
               + (d.sub ? '<div class="col"><p class="sub">' + d.sub + '</p></div>' : '')
               + '</div>';
        } else {
          body = d.sub ? '<p class="sub" style="margin-top:.6em">' + d.sub + '</p>' : '';
        }
        html += '<section class="slide">'
              + '<div class="eyebrow">' + d.ch + '</div>'
              + '<h2 class="head">' + d.head + '</h2>'
              + body
              + '<div class="foot"><span class="brand">janvayu.in</span></div></section>';
      }
      NOTES.push(d.note || '');
    });
    stage.innerHTML = html;
    slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));
  }

  function chapterBlurb(ch){
    return ({
      'Why it exists': 'Set the stakes and the stance before touching the product.',
      'The live picture': 'The real-time surfaces — the parts people check daily.',
      'Health & exposure': 'Translate the numbers into what they mean for a body.',
      'The economic bill': 'The macroeconomic case, for policy audiences.',
      'Following the money': 'Accountability — the differentiator versus a plain dashboard.',
      'Citizen action': 'Turn readers into participants.',
      'Tools & knowledge': 'The reference layer and the take-it-with-you surfaces.',
      'Trust': 'Close the loop on why any of these numbers can be believed.'
    })[ch] || '';
  }

  function render(){
    slides.forEach(function(s,idx){
      s.classList.toggle('active', idx===i);
      s.classList.toggle('prev', idx<i);
    });
    count.textContent = (i+1) + ' / ' + slides.length;
    bar.style.width = ((i)/(slides.length-1||1))*100 + '%';
    noteBody.textContent = NOTES[i] || '';
    if (location.hash !== '#/'+(i+1)) history.replaceState(null,'','#/'+(i+1));
  }
  function go(n){ i = Math.max(0, Math.min(slides.length-1, n)); render(); }
  function next(){ go(i+1); } function prev(){ go(i-1); }

  build();

  document.getElementById('next').onclick = next;
  document.getElementById('prev').onclick = prev;

  document.addEventListener('keydown', function(e){
    if (e.key==='ArrowRight' || e.key==='PageDown' || e.key===' ') { e.preventDefault(); next(); }
    else if (e.key==='ArrowLeft' || e.key==='PageUp') { e.preventDefault(); prev(); }
    else if (e.key==='Home') go(0);
    else if (e.key==='End') go(slides.length-1);
    else if (e.key==='s' || e.key==='S') notesEl.classList.toggle('open');
    else if (e.key==='o' || e.key==='O') document.body.classList.toggle('overview');
    else if (e.key==='f' || e.key==='F') { if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen&&document.exitFullscreen(); }
  });

  // Build overview thumbnails
  slides.forEach(function(s,idx){
    var t = document.createElement('div');
    t.className = 'thumb' + (s.classList.contains('cover')?' cover':'');
    var titleEl = s.querySelector('.title,.head');
    t.innerHTML = '<span class="tnum">'+(idx+1)+'</span><span class="tt">'+(titleEl?titleEl.textContent:('Slide '+(idx+1)))+'</span>';
    t.onclick = function(){ document.body.classList.remove('overview'); go(idx); };
    grid.appendChild(t);
  });

  // Deep-link
  function fromHash(){ var m=/^#\/(\d+)/.exec(location.hash); if(m) i=Math.max(0,Math.min(slides.length-1, parseInt(m[1],10)-1)); }
  fromHash(); window.addEventListener('hashchange', function(){ fromHash(); render(); });
  render();

  // Touch swipe
  var x0=null;
  stage.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
  stage.addEventListener('touchend',function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>50){ dx<0?next():prev(); } x0=null; },{passive:true});
})();
</script>
<script src="../js/dyslexia-font.js" data-accent="var(--accent)" data-radius="var(--radius)" defer></script>
