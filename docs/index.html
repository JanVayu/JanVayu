<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JanVayu Documentation</title>
  <meta name="description" content="JanVayu - India's Citizen Air Quality Platform. Documentation for developers, contributors, and users.">
  <meta property="og:title" content="JanVayu Documentation">
  <meta property="og:description" content="Documentation for India's citizen-led air quality accountability platform.">
  <meta property="og:type" content="website">
  <link rel="icon" href="https://www.janvayu.in/favicon.svg" type="image/svg+xml">

  <!-- Docsify Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/css/theme-simple.min.css">

  <!-- Custom Styles -->
<link rel="stylesheet" href="/styles.css?v=202606233">
<script>try{if(localStorage.getItem('janvayu-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<script>try{if(!localStorage.getItem('janvayu-theme')&&localStorage.getItem('docsify-dark-mode')==='dark'){localStorage.setItem('janvayu-theme','dark');document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
<script src="/js/chrome.js?v=202606233" defer></script>
  <style>
    :root {
      /* Brand colors matching janvayu.in */
      --theme-color: var(--accent);
      --theme-color-secondary: var(--accent-hover);

      /* Sidebar */
      --sidebar-width: 280px;
      --sidebar-background: var(--bg-section);
      --sidebar-border-color: var(--border);
      --sidebar-name-color: var(--text);
      --sidebar-name-font-size: 1.35rem;
      --sidebar-name-font-weight: 700;
      --sidebar-nav-link-color: var(--text-2);
      --sidebar-nav-link-color--active: var(--accent);
      --sidebar-nav-link-font-weight--active: 600;
      --sidebar-nav-strong-color: var(--text);
      --sidebar-nav-strong-font-size: 0.85rem;
      --sidebar-nav-strong-font-weight: 700;
      --sidebar-nav-strong-margin: 1.5em 0 0.5em 0;
      --sidebar-nav-strong-text-transform: uppercase;

      /* Content */
      --content-max-width: 860px;
      --base-font-family: var(--sans);
      --base-font-size: 16px;
      --base-line-height: 1.7;
      --base-color: var(--text);
      --heading-color: var(--text);

      /* Links */
      --link-color: var(--accent);
      --link-color--hover: var(--accent-hover);

      /* Code */
      --code-font-family: var(--mono);
      --code-inline-background: var(--bg-section);
      --code-inline-color: var(--ink-green);
      --code-block-border-radius: 8px;

      /* Cover */
      --cover-background-color: linear-gradient(135deg, #1a3a2a 0%, #16A34A 100%);
      --cover-color: #fff;

      /* Blockquote */
      --blockquote-border-color: var(--accent);
      --blockquote-background: var(--bg-section);

      /* Notice / Tip / Warning */
      --notice-tip-border-color: var(--accent);

      /* Search */
      --search-background: var(--bg-card);
      --search-input-border-color: var(--border);
      --search-result-keyword-color: var(--accent);
    }

    /* Dark mode */
    [data-theme="dark"] {
      --sidebar-background: var(--bg-section);
      --sidebar-border-color: var(--border);
      --sidebar-name-color: var(--text);
      --sidebar-nav-link-color: var(--text-2);
      --sidebar-nav-link-color--active: var(--accent);
      --sidebar-nav-strong-color: var(--text);
      --base-color: var(--text);
      --heading-color: var(--text);
      --code-inline-background: var(--bg-section);
      --code-inline-color: var(--accent);
      --blockquote-background: var(--bg-section);
      --content-max-width: 860px;
      --base-background-color: var(--bg);
      --background: var(--bg);
      --content-background: var(--bg);
      --code-theme-background: var(--bg-section);
      --link-color: var(--accent);
    }
    /* Without an explicit background here the page stayed light while
       --base-color went near-white: white text on a white page. */
    [data-theme="dark"],
    [data-theme="dark"] .content,
    [data-theme="dark"] .markdown-section,
    [data-theme="dark"] main,
    [data-theme="dark"] section.cover { background-color: var(--bg); }
    [data-theme="dark"] .markdown-section { color: var(--text); }
    [data-theme="dark"] .markdown-section a { color: var(--accent); }
    [data-theme="dark"] table tr:nth-child(odd) { background: var(--bg); }
    [data-theme="dark"] table tr:nth-child(even) { background: var(--bg-section); }
    [data-theme="dark"] table td, [data-theme="dark"] table th { color: var(--text); border-color: var(--border); }
    [data-theme="dark"] table th { background: var(--bg-section); }

    /* App name styling */
    .app-name-link img {
      max-width: 36px;
      margin-right: 10px;
      vertical-align: middle;
    }

    /* Language selector */
    .lang-selector {
      padding: 8px 16px;
      border-top: 1px solid var(--sidebar-border-color);
      margin-top: auto;
      font-size: 0.85rem;
    }

    .lang-selector a {
      display: inline-block;
      padding: 3px 8px;
      margin: 2px;
      border-radius: 4px;
      color: var(--sidebar-nav-link-color);
      text-decoration: none;
      font-size: 0.8rem;
    }

    .lang-selector a:hover,
    .lang-selector a.active {
      background: var(--theme-color);
      color: #fff;
    }

    /* Footer in sidebar */
    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--sidebar-border-color);
      font-size: 0.75rem;
      color: #6b7280;
      text-align: center;
    }

    .sidebar-footer a {
      color: var(--theme-color);
      text-decoration: none;
    }

    /* Better table styling */
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }

    table th {
      background: #f0fdf4;
      font-weight: 600;
      text-align: left;
      padding: 10px 14px;
      border: 1px solid #e5e7eb;
    }

    table td {
      padding: 10px 14px;
      border: 1px solid #e5e7eb;
    }

    table tr:nth-child(even) {
      background: #fafbfc;
    }

    /* Smooth scroll */
    html {
      scroll-behavior: smooth;
    }

    /* Better code blocks */
    .markdown-section pre {
      border-radius: 8px;
      padding: 1em;
    }

    /* Badge-like tags */
    .markdown-section code {
      border-radius: 4px;
      padding: 2px 6px;
    }

    /* Cover page tweaks */
    section.cover {
      background: linear-gradient(135deg, #1a3a2a 0%, #16A34A 100%) !important;
    }

    section.cover .cover-main > p:last-child a {
      border-radius: 8px;
      padding: 10px 28px;
      font-weight: 600;
    }

  </style>
</head>
<body data-jv-chrome>
  <div id="app">Loading...</div>

  <!-- The floating emoji toggle that used to sit here kept its own preference
       under `docsify-dark-mode`, so the docs and the rest of the site could
       disagree about the theme and each would overwrite the other on the way
       back. js/chrome.js owns the toggle and the key now, and it renders a
       text control rather than a glyph. One preference, sitewide. -->

  <script>
    window.$docsify = {
      name: '<img src="https://www.janvayu.in/favicon.svg" alt="JanVayu"> JanVayu',
      nameLink: '/',
      repo: 'JanVayu/JanVayu',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results found.',
        depth: 4,
        pathNamespaces: ['/hi', '/bn', '/mr', '/ta']
      },
      alias: {
        // Language routing — map /hi/*, /bn/*, etc. to language directories
        // served from this same Netlify deploy. Same-origin keeps it simple:
        // no CORS, no cross-origin Docsify quirks, files always match the
        // current commit. Regex uses (.+) so the bare '/hi/' route falls
        // through to the literal alias which points at README.md; '(.*)'
        // would swallow '/hi/' with empty capture and produce a directory URL.
        '/hi/(.+)': 'https://www.janvayu.in/docs-hi/$1',
        '/hi/': 'https://www.janvayu.in/docs-hi/README.md',
        '/hi/_sidebar.md': 'https://www.janvayu.in/docs-hi/_sidebar.md',
        '/bn/(.+)': 'https://www.janvayu.in/docs-bn/$1',
        '/bn/': 'https://www.janvayu.in/docs-bn/README.md',
        '/bn/_sidebar.md': 'https://www.janvayu.in/docs-bn/_sidebar.md',
        '/mr/(.+)': 'https://www.janvayu.in/docs-mr/$1',
        '/mr/': 'https://www.janvayu.in/docs-mr/README.md',
        '/mr/_sidebar.md': 'https://www.janvayu.in/docs-mr/_sidebar.md',
        '/ta/(.+)': 'https://www.janvayu.in/docs-ta/$1',
        '/ta/': 'https://www.janvayu.in/docs-ta/README.md',
        '/ta/_sidebar.md': 'https://www.janvayu.in/docs-ta/_sidebar.md'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied'
      },
      tabs: {
        persist: true,
        sync: true
      },
      footer: {
        copy: '<span>JanVayu &copy; 2026 | <a href="https://www.janvayu.in" target="_blank">janvayu.in</a> | MIT + CC BY-NC-SA 4.0</span>',
        pre: '<hr>',
        style: 'text-align: center; font-size: 0.8rem; color: #6b7280; padding: 1em 0;'
      }
    };
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/js/docsify-themeable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-toml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-markdown.min.js"></script>

  <!-- Footer plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-footer-enh@0.1.0/dist/docsify-footer-enh.min.js"></script>
<script src="../js/dyslexia-font.js" data-accent="var(--accent)" data-radius="var(--radius)" defer></script>
</body>
</html>
