<svg viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How farmers dodge fire satellites: a polar-orbiting satellite passes over Punjab around 1:30 PM and flags active fires; between 2020 and 2024 farmers shifted peak stubble burning to about 5 PM, after the overpass, so many fires go uncounted while the smoke still reaches Delhi."><text x="200" y="30" text-anchor="middle" font-family="Kalam, Comic Sans MS, cursive" font-size="18" font-weight="700" fill="#15803d">Dodging the fire satellites</text><text x="200" y="52" text-anchor="middle" font-family="Kalam, Comic Sans MS, cursive" font-size="12" font-weight="400" fill="#5b6b60">burns shifted to after the pass</text><g><path d="M30.719863120616935 80.70194473425653 L368.5101876011154 79.5331933831349 L370.4407927293472 177.09610464311075 L28.47254672256011 174.16207439120518" stroke="none" stroke-width="0" fill="#e7f2ff"></path><path d="M30.879462873783513 80.53754546634354 C148.74969363338454 82.91800724313627, 266.66704427423616 81.12801430694644, 370.5729985431178 80.54339066023672 M30.532492267216938 79.85065934247854 C125.74304474953719 77.88790626456473, 220.75395281043308 78.55855642141307, 369.5011324541675 79.49407547356466 M371.3712144173952 78.82251397679015 C370.8163149471843 101.6942793890836, 367.55747213712596 126.6633767852263, 368.23954286610314 177.46979193947064 M369.84847207778364 80.23041859675256 C370.592850534878 113.31739728092104, 371.3752657739057 146.4143089928273, 369.024744475089 176.75715592194223 M370.8819002662078 177.3536533269623 C285.42360193554833 176.302094420173, 202.30999525041446 175.30602218952959, 29.75176650229365 176.83691860325632 M369.6429397574725 176.49950337831586 C275.4595206799043 177.23977689565203, 181.42921904080086 176.19191428729775, 29.823630617560475 175.3324016936089 M30.302950298553426 175.10693393683476 C31.537243285314204 152.30900770045812, 29.424874907828556 127.43118760980187, 31.264681449393457 79.33066356987716 M30.694652