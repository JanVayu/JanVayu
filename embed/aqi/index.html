<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JanVayu AQI Widget</title>
<style>
  :root { --good: #22C55E; --moderate: #EAB308; --poor: #F97316; --vpoor: #EF4444; --severe: #7C3AED; --hazard: #831843; --accent: #1B6B4A; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body.theme-light { background: #fff; color: #0F172A; }
  body.theme-dark  { background: #0B1426; color: #F1F5F9; }
  .widget { display: flex; flex-direction: column; gap: 4px; }
  .city { font-size: 0.78rem; font-weight: 600; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.04em; }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .aqi { font-size: 2.2rem; font-weight: 700; line-height: 1; }
  .label { font-size: 0.95rem; font-weight: 600; }
  .pm { font-size: 0.78rem; opacity: 0.7; margin-top: 2px; }
  .footer { font-size: 0.65rem; opacity: 0.6; margin-top: 6px; }
  .footer a { color: inherit; text-decoration: none; border-bottom: 1px dotted; }
  .err { font-size: 0.85rem; opacity: 0.7; }
  /* Soft fallback card — never a blank widget */
  .fallback {
    display: flex; flex-direction: column; gap: 4px;
    border-left: 3px solid var(--accent); padding: 6px 0 6px 10px;
  }
  .fallback .title { font-size: 0.95rem; font-weight: 700; color: var(--accent); }
  .fallback .msg { font-size: 0.78rem; opacity: 0.75; }
  .fallback .cta { font-size: 0.7rem; opacity: 0.6; }
  .fallback .cta a { color: inherit; border-bottom: 1px dotted; text-decoration: none; }
</style>
</head>
<body>
<div class="widget" id="w">
  <div class="err">Loading…</div>
</div>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const city = (params.get('city') || 'delhi').toLowerCase();
  const theme = params.get('theme') === 'dark' ? 'dark' : 'light';
  document.body.classList.add('theme-' + theme);

  const el = document.getElementById('w');
  // WAQI is fetched via the JanVayu proxy so the API token stays server-side.
  // See netlify/functions/waqi-proxy.mjs.
  const PROXY = '/.netlify/functions/waqi-proxy';
  const SAFE_CITY = city.replace(/[^a-zA-Z0-9\-_]/g, '').slice(0, 60);

  function color(aqi) {
    if (aqi <= 50) return 'var(--good)';
    if (aqi <= 100) return 'var(--moderate)';
    if (aqi <= 200) return 'var(--poor)';
    if (aqi <= 300) return 'var(--vpoor)';
    if (aqi <= 400) return 'var(--severe)';
    return 'var(--hazard)';
  }
  function label(aqi) {
    if (aqi <= 50) return 'Good';
    if (aqi <= 100) return 'Moderate';
    if (aqi <= 200) return 'Poor';
    if (aqi <= 300) return 'Very Poor';
    if (aqi <= 400) return 'Severe';
    return 'Hazardous';
  }

  // Render a polished fallback so the embed never looks blank.
  function renderFallback(reason) {
    const cityName = SAFE_CITY.charAt(0).toUpperCase() + SAFE_CITY.slice(1);
    el.innerHTML = `
      <div class="fallback">
        <div class="title">JanVayu AQI</div>
        <div class="city">${cityName}</div>
        <div class="msg">Live reading temporarily unavailable.</div>
        <div class="cta"><a href="https://www.janvayu.in/?city=${encodeURIComponent(SAFE_CITY)}" target="_blank" rel="noopener">Open dashboard ↗</a></div>
      </div>
    `;
  }

  let attempt = 0;
  async function tryFetch() {
    attempt++;
    try {
      const ctrl = new AbortController();
      const timeout = setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch(PROXY + '?city=' + encodeURIComponent(SAFE_CITY), { signal: ctrl.signal });
      clearTimeout(timeout);
      if (!res.ok) throw new Error('proxy ' + res.status);
      const json = await res.json();
      if (json.status !== 'ok' || !json.data || json.data.aqi === '-') throw new Error('no data');
      const aqi = parseInt(json.data.aqi, 10);
      if (!Number.isFinite(aqi)) throw new Error('bad aqi');
      const pm25 = json.data.iaqi?.pm25?.v;
      const cityName = json.data.city?.name || SAFE_CITY;
      el.innerHTML = `
        <div class="city">${cityName}</div>
        <div class="row">
          <span class="aqi" style="color:${color(aqi)};">${aqi}</span>
          <span class="label" style="color:${color(aqi)};">${label(aqi)}</span>
        </div>
        ${pm25 ? `<div class="pm">PM2.5: <strong>${pm25}</strong> µg/m³</div>` : ''}
        <div class="footer">Live AQI · <a href="https://www.janvayu.in/" target="_blank" rel="noopener">JanVayu</a></div>
      `;
    } catch (e) {
      // First failure: silently retry once after 1.5 s. Second failure: render fallback.
      if (attempt < 2) {
        setTimeout(tryFetch, 1500);
      } else {
        renderFallback(String(e));
      }
    }
  }
  tryFetch();

  // Auto-refresh every 10 minutes
  setTimeout(() => location.reload(), 10 * 60 * 1000);
})();
</script>
</body>
</html>
