<html lang="en">
<head>

  <meta name="description" content="Ask any question about air quality in India. Live AQI data, health advice, and accountability.">
  <meta name="theme-color" content="#16A34A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ask JanVayu">
  <link rel="manifest" href="/ask/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #16A34A;
      --accent-hover: #15803d;
      --bg: #FFFEF9;
      --bg-card: #fff;
      --text: #1a1a18;
      --text-2: #4a4a46;
      --text-3: #7a7a74;
      --text-4: #a0a09a;
      --border: #e5e5df;
      --border-light: #f0f0ea;
      --radius: 12px;
      --sans: 'DM Sans', system-ui, sans-serif;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e0c;
        --bg-card: #1a1a18;
        --text: #e8e8e2;
        --text-2: #b0b0a8;
        --text-3: #6e6e68;
        --text-4: #4a4a46;
        --border: #2a2a28;
        --border-light: #1e1e1c;
      }
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Header */
    .app-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .app-logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #1a3a2a, #16A34A);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 0.9rem;
    }
    .app-title {
      font-size: 1.1rem; font-weight: 700; color: var(--accent);
      flex: 1;
    }
    .app-subtitle {
      font-size: 0.65rem; color: var(--text-3); text-transform: uppercase;
      letter-spacing: 0.06em; font-weight: 500;
    }
    .app-header a {
      color: var(--text-3); text-decoration: none; font-size: 0.75rem;
      padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
    }

    /* City selector */
    .city-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
      overflow-x: auto;
    }
    .city-chip {
      padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--border);
      background: none; color: var(--text-2);
      font-family: var(--sans); font-size: 0.78rem; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: all 0.15s;
    }
    .city-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .city-chip:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

    /* Chat area */
    .chat-area {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg {
      max-width: 88%; padding: 12px 16px;
      border-radius: 16px; font-size: 0.9rem; line-height: 1.6;
      animation: msgIn 0.2s ease;
    }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg-user {
      align-self: flex-end;
      background: var(--accent); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-ai {
      align-self: flex-start;
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .msg-meta {
      font-size: 0.68rem; color: var(--text-4); margin-top: 4px;
    }
    .msg-ai .msg-meta { color: var(--text-3); }
    .msg-feedback {
      display: flex; align-items: center; gap: 6px;
      margin-top: 8px; padding-top: 6px;
      border-top: 1px solid var(--border-light);
    }
    .msg-feedback span { font-size: 0.68rem; color: var(--text-4); }
    .feedback-btn {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 3px 8px; cursor: pointer; font-size: 0.75rem;
      color: var(--text-3); display: flex; align-items: center; gap: 3px;
      transition: all 0.15s;
    }
    .feedback-btn:hover { border-color: var(--accent); color: var(--accent); }
    .feedback-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
    .feedback-btn:disabled { opacity: 0.5; cursor: default; }
    .feedback-thanked { font-size: 0.7rem; color: var(--accent); font-weight: 500; }
    .msg-typing {
      align-self: flex-start;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; padding: 12px 20px;
      border-bottom-left-radius: 4px;
    }
    .typing-dots { display: flex; gap: 4px; }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--text-4);
      animation: dot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }

    /* Welcome state */
    .welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px; gap: 16px;
    }
    .welcome h2 { font-size: 1.2rem; color: var(--text); }
    .welcome p { font-size: 0.85rem; color: var(--text-2); max-width: 320px; line-height: 1.6; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 360px; }
    .suggestion {
      padding: 8px 14px; border-radius: 20px;
      border: 1px solid var(--border); background: none;
      font-family: var(--sans); font-size: 0.78rem; color: var(--text-2);
      cursor: pointer; transition: all 0.15s;
    }
    .suggestion:hover { border-color: var(--accent); color: var(--accent); }

    /* Input bar */
    .input-bar {
      display: flex; align-items: flex-end; gap: 8px;
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .input-bar textarea {
      flex: 1; padding: 10px 14px;
      border: 1px solid var(--border); border-radius: 20px;
      background: var(--bg-card); color: var(--text);
      font-family: var(--sans); font-size: 0.9rem;
      resize: none; outline: none; min-height: 42px; max-height: 120px;
      line-height: 1.4;
    }
    .input-bar textarea:focus { border-color: var(--accent); }
    .input-bar textarea::placeholder { color: var(--text-4); }
    .send-btn {
      width: 42px; height: 42px; border-radius: 50%;
      border: none; background: var(--accent); color: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: opacity 0.15s;
    }
    .send-btn:disabled { opacity: 0.4; cursor: default; }
    .send-btn:hover:not(:disabled) { background: var(--accent-hover); }

    /* Install banner */
    .install-banner {
      display: none; padding: 10px 16px;
      background: var(--bg-card); border-top: 1px solid var(--border);
      font-size: 0.78rem; color: var(--text-2);
      align-items: center; gap: 10px; flex-shrink: 0;
    }
    .install-banner button {
      padding: 6px 14px; border-radius: 8px;
      border: 1px solid var(--accent); background: none;
      color: var(--accent); font-family: var(--sans);
      font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }
    .install-banner .dismiss {
      border: none; color: var(--text-4); margin-left: auto;
      background: none; cursor: pointer; font-size: 1.1rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

    <select id="langPicker" aria-label="Language" onchange="setLanguage(this.value)" style="padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-family: var(--sans); font-size: 0.78rem; cursor: pointer;">

      <option value="mr">म</option>

      <option value="gu">ગુ</option>
      <option value="kn">ಕ</option>
      <option value="ml">മ</option>
      <option value="pa">ਪੰ</option>

    <a href="https://www.janvayu.in">janvayu.in</a>

  <div class="chat-area" id="chatArea" role="log" aria-live="polite" aria-atomic="false" aria-label="Ask JanVayu conversation">
    <div class="welcome" id="welcome">

      <div class="suggestions" id="suggestionsList"></div>
    </div>
  </div>

  <div class="install-banner" id="installBanner">
    <span data-i18n="installPrompt">Install Ask JanVayu for quick access</span>
    <button onclick="installPWA()" data-i18n="installBtn">Install</button>
    <button class="dismiss" onclick="this.parentElement.style.display='none'" aria-label="Dismiss">&times;</button>
  </div>

  <div class="input-bar">
    <textarea id="questionInput" placeholder="Ask about air quality..." rows="1"

    <button class="send-btn" id="sendBtn" onclick="sendQuestion()" aria-label="Send">

    </button>
  </div>

          'ਹੁਣ ਭਾਰਤ ਦੇ 5 ਸਭ ਤੋਂ ਪ੍ਰਦੂਸ਼ਿਤ ਸ਼ਹਿਰ',
          'ਮੈਂ 2 ਘੰਟੇ ਆਟੋ ਨਾਲ ਸਫ਼ਰ ਕਰਦਾ ਹਾਂ — ਮੇਰਾ PM2.5 ਐਕਸਪੋਜ਼ਰ ਕਿੰਨਾ ਹੈ?',
          'ਦਿੱਲੀ ਬਨਾਮ ਬੇਂਗਲੁਰੂ ਦੀ ਹਵਾ ਦੀ ਤੁਲਨਾ ਕਰੋ',
          'ਪਟਨਾ ਵਿੱਚ ਪ੍ਰਦੂਸ਼ਣ ਕਿੱਥੋਂ ਆਉਂਦਾ ਹੈ?',
          'ਮੇਰੇ ਸਕੂਲ ਨੇੜੇ ਇੱਟ ਭੱਠੇ ਬਾਰੇ RTI ਤਿਆਰ ਕਰੋ',
          'ਅੱਜ ਦੀ AQI ਰੀਡਿੰਗ ਕਿੰਨੀ ਭਰੋਸੇਯੋਗ ਹੈ?',
          'ਅੱਜ ਮੈਂ ਕਿੰਨੇ ਸਿਗਰੇਟ ਦੇ ਬਰਾਬਰ ਪੀ ਰਿਹਾ ਹਾਂ?',
          '2019 ਤੋਂ ਮੁੰਬਈ ਦੀ ਹਵਾ ਖਰਾਬ ਹੋਈ ਹੈ?',
          'ਕੀ ਮੈਨੂੰ ਦਿੱਲੀ ਤੋਂ ਬੇਂਗਲੁਰੂ ਜਾਣਾ ਚਾਹੀਦਾ ਹੈ?'
        ],
        inputPlaceholder: 'ਹਵਾ ਦੀ ਗੁਣਵੱਤਾ ਬਾਰੇ ਪੁੱਛੋ...',
        installPrompt: 'ਤੇਜ਼ ਪਹੁੰਚ ਲਈ Ask JanVayu ਇੰਸਟਾਲ ਕਰੋ',
        installBtn: 'ਇੰਸਟਾਲ',
        errorMsg: 'ਕੁਝ ਗਲਤ ਹੋ ਗਿਆ। ਆਪਣਾ ਕਨੈਕਸ਼ਨ ਚੈੱਕ ਕਰੋ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।',
        noResponse: 'ਕੋਈ ਜਵਾਬ ਨਹੀਂ ਮਿਲਿਆ।',
        htmlLang: 'pa'
      }
    };

    function applyI18n() {
      const t = I18N[currentLang] || I18N.en;
      document.documentElement.lang = t.htmlLang;
      document.title = t.title;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (t[key]) el.textContent = t[key];
      });
      const placeholderEl = document.getElementById('questionInput');
      if (placeholderEl) placeholderEl.placeholder = t.inputPlaceholder;
      // Rebuild suggestions in the active language
      const sugList = document.getElementById('suggestionsList');
      if (sugList) {
        sugList.innerHTML = '';
        t.suggestions.forEach(s => {
          const btn = document.createElement('button');
          btn.className = 'suggestion';
          btn.textContent = s;
          btn.addEventListener('click', () => askSuggestion(btn));
          sugList.appendChild(btn);
        });
      }
    }

    function setLanguage(code) {
      if (!I18N[code]) return;
      currentLang = code;
      try { localStorage.setItem('janvayu-ask-lang', code); } catch (e) {}
      const picker = document.getElementById('langPicker');
      if (picker) picker.value = code;
      applyI18n();
    }

    // Initialise from localStorage or browser language
    (function initLang() {
      let saved = null;
      try { saved = localStorage.getItem('janvayu-ask-lang'); } catch (e) {}
      if (saved && I18N[saved]) {
        currentLang = saved;
      } else {
        const browser = (navigator.language || '').slice(0, 2);
        if (I18N[browser]) currentLang = browser;
      }
      const picker = document.getElementById('langPicker');
      if (picker) picker.value = currentLang;
      applyI18n();
    })();

    // City selector
    document.getElementById('cityBar').addEventListener('click', e => {
      const chip = e.target.closest('.city-chip');
      if (!chip) return;
      document.querySelectorAll('.city-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      selectedCity = chip.dataset.city;
    });

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function askSuggestion(btn) {
      document.getElementById('questionInput').value = btn.textContent;
      sendQuestion();
    }

    async function sendQuestion() {
      const input = document.getElementById('questionInput');
      const question = input.value.trim();
      if (!question) return;

      // Hide welcome
      const welcome = document.getElementById('welcome');
      if (welcome) welcome.remove();

      // Add user message
      addMessage(question, 'user');
      input.value = '';
      input.style.height = 'auto';

      // Show typing indicator
      const typing = addTyping();

      try {
        const res = await fetch('/.netlify/functions/air-query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, city: selectedCity, lang: currentLang }),
        });
        const data = await res.json();
        typing.remove();

        let meta = '';
        if (data.dataUsed) {
          meta = data.dataUsed.city + ' \u2014 AQI: ' + data.dataUsed.aqi +
            ', PM2.5: ' + (data.dataUsed.pm25 ?? 'N/A') + ' \u00b5g/m\u00b3';
        }
        const t = I18N[currentLang] || I18N.en;
        addMessage(data.answer || t.noResponse, 'ai', meta, question);
      } catch (e) {
        typing.remove();
        const t = I18N[currentLang] || I18N.en;
        addMessage(t.errorMsg, 'ai');
        if (typeof console !== 'undefined' && console.error) {
          console.error('Ask JanVayu fetch failed:', e && e.message ? e.message : e);
        }
      }
    }

    function addMessage(text, type, meta, question) {
      const chat = document.getElementById('chatArea');
      const div = document.createElement('div');
      div.className = 'msg msg-' + type;
      div.textContent = text;
      if (meta) {
        const m = document.createElement('div');
        m.className = 'msg-meta';
        m.textContent = meta;
        div.appendChild(m);
      }
      if (type === 'ai' && text && !text.startsWith('Something went wrong')) {
        const fb = document.createElement('div');
        fb.className = 'msg-feedback';
        fb.innerHTML = '<span>Was this helpful?</span>';
        const thumbUp = document.createElement('button');
        thumbUp.className = 'feedback-btn';
        thumbUp.innerHTML = '<svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor"><path d="M8.834.066C7.494-.087 6.5 1.048 6.5 2.25v.5c0 1.329-.647 2.424-1.261 3.178-.397.488-.866.89-1.344 1.193A.75.75 0 003 7.75v5.5a.75.75 0 00.75.75h6.5a.75.75 0 00.696-.471l2.5-6.25A.75.75 0 0013 6.5H9.366a.75.75 0 01-.74-.868l.416-2.5A1.75 1.75 0 007.309.14L8.834.066zM2.5 8a.5.5 0 00-1 0v5.5a.5.5 0 001 0V8z"/></svg> Yes';
        const thumbDown = document.createElement('button');
        thumbDown.className = 'feedback-btn';
        thumbDown.innerHTML = '<svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor"><path d="M7.166 15.934C8.506 16.087 9.5 14.952 9.5 13.75v-.5c0-1.329.647-2.424 1.261-3.178.397-.488.866-.89 1.344-1.193A.75.75 0 0013 8.25v-5.5a.75.75 0 00-.75-.75h-6.5a.75.75 0 00-.696.471l-2.5 6.25A.75.75 0 003 9.5h3.634a.75.75 0 01.74.868l-.416 2.5a1.75 1.75 0 001.733 1.926l1.475.14zM13.5 8a.5.5 0 001 0V2.5a.5.5 0 00-1 0V8z"/></svg> No';
        function handleFeedback(isPositive) {
          thumbUp.disabled = true;
          thumbDown.disabled = true;
          if (isPositive) { thumbUp.classList.add('selected'); } else { thumbDown.classList.add('selected'); }
          const thanked = document.createElement('span');
          thanked.className = 'feedback-thanked';
          thanked.textContent = isPositive ? 'Thanks!' : 'Thanks for the feedback';
          fb.appendChild(thanked);
          try {
            const stored = JSON.parse(localStorage.getItem('janvayu-feedback') || '[]');
            stored.push({
              ts: Date.now(), city: selectedCity, q: question || '',
              positive: isPositive, answer: text.slice(0, 200)
            });
            if (stored.length > 100) stored.splice(0, stored.length - 100);
            localStorage.setItem('janvayu-feedback', JSON.stringify(stored));
          } catch (e) {}
        }
        thumbUp.addEventListener('click', () => handleFeedback(true));
        thumbDown.addEventListener('click', () => handleFeedback(false));
        fb.appendChild(thumbUp);
        fb.appendChild(thumbDown);
        div.appendChild(fb);
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addTyping() {
      const chat = document.getElementById('chatArea');
      const div = document.createElement('div');
      div.className = 'msg-typing';
      div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    // PWA install
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').style.display = 'flex';
    });

    function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(result => {
        deferredPrompt = null;
        document.getElementById('installBanner').style.display = 'none';
      });
    }

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/ask/sw.js');
    }
  </script>
</body>
</html>
